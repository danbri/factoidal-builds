name: Check scoped pinned HTTPS connection reuse
on:
  push:
    branches: [wip/bbc-pinned-https-fixture]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: experiments/bbc-pinned-https
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Measure the same ordered responses through two approved addresses
        working-directory: experiments/bbc-pinned-https
        run: |
          set -euo pipefail
          test "$(git hash-object native_net.base.ts)" = 1359504dff664aea51b8098ede9812df04e70dbb
          cp native_net.base.ts native_net.ts
          python3 make-variant.py native_net.ts
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=fixture.invalid \
            -addext 'subjectAltName=DNS:fixture.invalid' -keyout key.pem -out cert.pem
          deno check --no-config fixture.ts
          deno run --no-config --allow-read=cert.pem,key.pem --allow-net=127.0.0.1,127.0.0.2,fixture.invalid,wrong.invalid fixture.ts | tee report.json
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-https-reuse-fixture
          path: experiments/bbc-pinned-https/report.json
          retention-days: 7
