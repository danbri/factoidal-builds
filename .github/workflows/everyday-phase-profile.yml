name: Attribute elapsed CPU replay time on BBC, GOV.UK and W3C
on:
  push:
    branches: [wip/712-everyday-phase-profile]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: e4445d14752cc3ec75da7bf2fc1797263d02efbf
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: bbc
            url: https://www.bbc.co.uk/news
            run: "45638334817"
            artifact: bbc-uk-replay-with-photos
            archive: bbc-uk-with-photos.zip
            sha: 32c6aa1ba6934f8db893078034c1efaf8e203416b9c6aa2783a0c65e7d86bf46
          - page: govuk
            url: https://www.gov.uk/
            run: "45430099580"
            artifact: desktop-govuk-snapshot
            archive: desktop-govuk-*.zip
            sha: f6ce846865473c4a20453944c232763f29849852a43fca5e4190f11117ab776e
          - page: w3c
            url: https://www.w3.org/
            run: "45431269816"
            artifact: desktop-w3c-home-snapshot
            archive: desktop-w3c-home-*.zip
            sha: 359b431764ad4eb9debb4e5dc2e4571d968cd95447b52fe767f9933145f4a388
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: experiments/everyday-phase-profile
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CORE }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            tests/browser-wpt
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: "45613857797"
          name: foafnaut-linux-native-worker
          path: engine
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.run }}
          name: ${{ matrix.artifact }}
          path: capture
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Profile two fresh processes with the same inputs
        env:
          PAGE: ${{ matrix.page }}
          URL: ${{ matrix.url }}
          ARCHIVE_GLOB: ${{ matrix.archive }}
          ARCHIVE_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH REFTEST_TIME REFTEST_DUMP_DIR
          test "$(git -C core rev-parse HEAD)" = "$CORE"
          (cd engine && grep -Fx "$CORE" source-commit.txt && sha256sum -c SHA256SUMS)
          mapfile -t archives < <(find capture -name "$ARCHIVE_GLOB")
          test "${#archives[@]}" -eq 1
          export REALPAGES_REPLAY="$PWD/${archives[0]}"
          echo "$ARCHIVE_SHA  $REALPAGES_REPLAY" | sha256sum -c -
          mkdir runtime out
          tag="build-${CORE:0:12}-foafnaut-web"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D runtime -p build-info.json -p foafnaut-web.tar.gz
          expected=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' runtime/build-info.json)
          echo "$expected  runtime/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf runtime/foafnaut-web.tar.gz -C runtime docs/web/hub/html-webgpu/runtime
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          renderer=core/tests/browser-wpt/reftest-render.ts
          python3 experiments/everyday-phase-profile/instrument.py "$renderer"
          deno check --no-config --no-npm "$renderer"
          sha256sum engine/libweb-render.so "$renderer" "$REALPAGES_REPLAY" > out/inputs.sha256
          jq -nc --arg url "$URL" --arg file "$PAGE.png" '{url:$url,file:$file,width:1280,height:735}' > out/jobs.jsonl
          for sample in 1 2; do
            deno run --no-config --no-npm --unstable-ffi -A --preload "$lab/realpages/replay.ts"               "$renderer" --native-engine "$PWD/engine/libweb-render.so" --list out/jobs.jsonl               --out "out/run-$sample" 2>&1 | tee "out/run-$sample.log"
            grep '^__done ' "out/run-$sample.log" | cut -d' ' -f2- | jq -e 'select(.status=="ok")' > "out/result-$sample.json"
            grep '^{"type":"everyday-phase"' "out/run-$sample.log" | jq -e --arg url "$URL"               'select(.url==$url and .times.cpuFrame>0 and .times.prepare>0 and .methods["prepare.inspect"].calls>0)' > "out/phase-$sample.json"
            jq -c '{url,times,methods,nativeTimings}' "out/phase-$sample.json" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-phase-profile-${{ matrix.page }}
          path: out/
          retention-days: 7
