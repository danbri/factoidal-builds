name: Profile the MDN display startup scroll stall
on:
  push:
    branches: [wip/mdn-display-turn-profile]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: 05ec0b29ca8ad75ef2dfca91a4f06cf16ed58067
  SET: foafnaut-darwin-arm64
  WEB: build-05ec0b29ca8a-foafnaut-web
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            release-tests/mdn-display-turn-profile.py
            third_party/realpages/developer.mozilla.org/mdn-display-20261115.zip
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 05ec0b29ca8ad75ef2dfca91a4f06cf16ed58067
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Set up the pinned engine and desktop host
        run: |
          set -euo pipefail
          mkdir -p engines/base engines/web
          gh release download "build-${CORE:0:12}-$SET" -R "$GITHUB_REPOSITORY" -p "$SET.tar.gz" -p build-info.json -D engines/base
          jq -e --arg sha "$CORE" '.source_commit == $sha' engines/base/build-info.json >/dev/null
          expected=$(jq -er --arg archive "$SET.tar.gz" '.artifacts[$archive].sha256' engines/base/build-info.json)
          echo "$expected  engines/base/$SET.tar.gz" | shasum -a 256 -c -
          tar -xzf "engines/base/$SET.tar.gz" -C engines/base
          library=$(find "$PWD/engines/base" -name libweb-render.dylib -print | head -1)
          window=$(find "$PWD/engines/base" -name libnative-window.dylib -print | head -1)
          test -s "$library"
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz -p build-info.json -D engines/web
          web_sha=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' engines/web/build-info.json)
          echo "$web_sha  engines/web/foafnaut-web.tar.gz" | shasum -a 256 -c -
          tar -xzf engines/web/foafnaut-web.tar.gz -C engines/web docs/web/hub/html-webgpu/runtime
          lab=core/labs/demos/foafnaut
          bash "$lab/realpages/setup-host.sh" "$PWD/$lab" "$PWD/engines/web" "$window"
          echo "ENGINE=$library" >> "$GITHUB_ENV"
      - name: Capture the native startup turn and wheel latency
        run: |
          set -euo pipefail
          mkdir -p out
          snapshot="$PWD/third_party/realpages/developer.mozilla.org/mdn-display-20261115.zip"
          test "$(git hash-object "$snapshot")" = f08704fa2df02f35d8b1e9e05877e6c1016b4dbd
          echo "7e20f9b88501aac93f1af4cb6095a1cca6b6a24dc4deea9beddcdcef0df1b9fc  $ENGINE" | shasum -a 256 -c -
          echo "549078dad4194ce84b3f0ef486b442162ede3bc769b641ff04b0f1fa411b95b9  core/labs/demos/foafnaut/run_html.ts" | shasum -a 256 -c -
          shasum -a 256 "$snapshot" "$ENGINE" > out/inputs.sha256
          sudo -n true
          python3 release-tests/mdn-display-turn-profile.py "$PWD/core/labs/demos/foafnaut" "$ENGINE" "$snapshot" "$PWD/out" |
            tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdn-display-turn-profile
          path: out/
          retention-days: 7
