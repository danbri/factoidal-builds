name: Build Factoidal from factoidal-core
# The run list shows what each run builds (agents find their runs by it; mac-release.yml finds
# the main lane's runs by it). Workflows that follow this one match its name above, not this.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('core {0}{1}', inputs.core_ref || 'main (Mac release lane)', inputs.macos && ' +macOS' || '')
      || (github.event_name == 'schedule'
          && (github.event.schedule == '41 2 * * *' && 'core main (nightly)' || 'core main (Mac release lane, hourly poll)')
          || 'core main (Mac release lane, builds repo push)') }}

# Builds one danbri/factoidal-core commit and publishes its artifacts as
# releases of this repository, one per artifact set:
#
#   build-<12 hex>-linux-x86_64   bin/linux-x86_64/  Lean CLI and W3C runner
#   build-<12 hex>-darwin-arm64   bin/darwin-arm64/  same, macOS arm64
#   build-<12 hex>-web            npm/ + docs/       Lean wasm
#   (Lean only since 2026-11-15: no F* build, test or release product runs here.)
#   build-<12 hex>-foafnaut-darwin-arm64  experimental native graphics demos
#   build-<12 hex>-foafnaut-browser-linux-x86_64  native Linux browser
#   build-<12 hex>-foafnaut-web   experimental SVG WebGPU runtime
#
# Each release carries <set>.tar.gz and build-info.json (source commit,
# toolchains, sha256 of every file). core's tools/fetch-builds.sh installs
# them. A set is published only when every job that contributes to it
# passed its gates; this repository's git history only gains the
# latest/<set>.json pointer. The Linux CLI and web sets, the Linux browser,
# and the macOS sets publish in separate jobs so other releases can proceed
# during the browser smoke test or a wait for a macOS runner.
#
# Gates per job (a failing gate means no artifact upload, so no release):
#   lean       full `lake build` (library, proofs, #guards, executables),
#              HACL* extern probe, native + CLI smoke scripts, and on Linux
#              the Lean conformance scoreboard when core carries it.
#   js-fuel-mono  `lake build JSFuelMono`: fuel monotonicity of the BubblePopJS evaluator
#              (core JS/FuelMonoAll.lean). Publishes nothing; a failure fails the run, and the
#              run's conclusion is the merge verdict for a core PR.
#   lean-wasm  Wasm/build-wasm.sh (Emscripten 6.0.8, cached work dir from
#              the toolchain-cache branch) and the npm Lean-engine tests.
#   foafnaut-host-tests  core's labs/demos/foafnaut/test.sh on the foafnaut-engines
#              artifact (Linux, Wasm engines), beside the macOS bundle job; gates
#              foafnaut-web. The bundle job runs test.sh again with the native library.
#   web-gates  the npm package suite on the Lean engine, the OWL package checks
#              and the Touchstone LWS client lab
#              (tools/lws-touchstone-client.sh; JDK 25 and Maven; any
#              non-zero exit fails the job and so the web release).

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'factoidal-core branch, tag or 40-hex commit (empty: main, else claude/core-split)'
        required: false
        default: ''
      force:
        description: 'Rebuild even when releases for this commit exist (runs the gates; an existing release is never replaced)'
        type: boolean
        default: false
      cold:
        description: 'Cold build: restore no .lake, ccache or leanc object cache (skills/foafnaut/ci-caching.md in core)'
        type: boolean
        default: false
      macos:
        description: 'Also run the macOS jobs (lean-macos, foafnaut bundle) for a commit not on core main. Merges are gated on the Linux jobs; core main commits and the nightly run always include macOS'
        type: boolean
        default: false
      mac_runner:
        description: 'Where macOS jobs run: auto (the owner''s Mac overnight when online, else macos-15), github, self-hosted'
        type: choice
        options: [auto, github, self-hosted]
        default: auto
  schedule:
    # Poll core every hour; a commit that already has releases is skipped
    # (the resolve job ends the run in seconds). A push to core cannot start
    # this workflow without a cross-repository token, so the poll is how core
    # changes reach a build.
    - cron: '23 * * * *'
    # Nightly (02:41 UTC): main's head with every job, macOS included, whether or not it is
    # released; nightly-report opens or updates an issue when a job fails (owner decision
    # 2026-11-16: macOS is not a merge gate; a nightly macOS failure is fixed or reverted
    # the next morning). scripts/resolve-macos.sh names this cron.
    - cron: '41 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'requests/**'

permissions:
  contents: write
  actions: read   # foafnaut-host-tests.yml may read another run's artifact when dispatched alone

# One group for each ref: a dispatch of a branch or commit has a group of its own, so the
# hourly poll, pushes here and builds of other refs never cancel its pending run
# (GitHub keeps one pending run in a group and cancels the earlier one). Schedule,
# push and a dispatch with an empty core_ref share the group of main, where a newer
# pending run replacing an older one costs nothing: both build the newest main commit.
# Builds of different refs may run at once: caches are content-keyed, and only main
# commits publish releases (one per commit) and the latest/*.json pointers. The nightly run
# has a group of its own, so an hourly poll never replaces it.
#
# The Mac release lane (owner rule 2026-11-16: a Mac build of the newest main is always done or
# building): the group build-factoidal-main runs the macOS jobs of main's head
# (scripts/resolve-macos.sh). mac-release.yml dispatches into it (empty core_ref) whenever main's
# head has no Mac release and no run of the group is waiting; a pending run resolves main's head
# when it starts, so a newer main replaces the pending build and never cancels the running one.
# A dispatch with macos=true (a PR's or branch's macOS check) goes to the shared group
# build-factoidal-macos-adhoc, which foafnaut-macos.yml's branch builds use too: at most one
# ad-hoc macOS build at a time, a newer request replacing a waiting one, so ad-hoc work holds at
# most one of the account's five macOS slots (skills/ci-runner in core: the budget).
concurrency:
  group: build-factoidal-${{ github.event_name == 'workflow_dispatch' && (inputs.macos && 'macos-adhoc' || inputs.core_ref || 'main') || (github.event.schedule == '41 2 * * *' && 'nightly' || 'main') }}
  cancel-in-progress: false

env:
  CORE_REPO: danbri/factoidal-core

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      sha: ${{ steps.r.outputs.sha }}
      short: ${{ steps.r.outputs.short }}
      proceed: ${{ steps.r.outputs.proceed }}
      foafnaut: ${{ steps.r.outputs.foafnaut }}
      foafnaut_web: ${{ steps.r.outputs.foafnaut_web }}
      foafnaut_linux_browser: ${{ steps.r.outputs.foafnaut_linux_browser }}
      macos: ${{ steps.r.outputs.macos }}
      nightly: ${{ steps.r.outputs.nightly }}
      mac_runs_on: ${{ steps.mac.outputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.core_ref }}
          INPUT_MACOS: ${{ inputs.macos }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: scripts/resolve-core.sh
      # The macOS jobs prefer the owner's Mac (self-hosted, overnight) when it reports itself
      # online with room; otherwise GitHub's macos-15. skills/ci-runner in core.
      - id: mac
        env:
          MAC_RUNNER: ${{ vars.MAC_RUNNER }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mac_runner }}
          NEED_GIB: '12'
          LEAD_H: '3'
        run: python3 scripts/mac-runs-on.py

  # The Lean build is two jobs with one step list (a YAML anchor), so that
  # lean-wasm and web-gates wait only for the Linux job. With one matrix job they also waited
  # for a macOS runner: lean-wasm started 85 min after dispatch in run 43709145133, 15 min
  # after the Linux build had finished.
  lean:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps: &lean-steps
      - uses: actions/checkout@v4
        with:
          path: builds
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
          submodules: ${{ matrix.platform == 'linux-x86_64' && 'recursive' || 'false' }}

      - name: Install elan (toolchain from core's lean-toolchain)
        run: bash builds/scripts/install-elan.sh

      - name: Cache .lake
        if: ${{ !inputs.cold }}
        uses: actions/cache@v4
        with:
          path: core/formal/lean4/.lake
          key: lake-${{ matrix.platform }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ hashFiles('core/formal/lean4/**/*.lean', 'core/formal/lean4/lakefile.lean', 'core/formal/lean4/ffi/**', 'core/tools/wasmvm/quickjs/*.js') }}
          restore-keys: |
            lake-${{ matrix.platform }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-

      - name: Rebuild modules that include_str non-Lean files
        # Lake does not track include_str inputs (tools/wasmvm/quickjs/prelude.js and
        # webassembly.js, read by WasmVM/Hosts/LeanJS.lean). A .lake restored from an
        # older cache (restore-keys) would keep a stale BubblePopJS prelude, so its
        # outputs are always removed; Lake rebuilds LeanJS and its dependents.
        shell: bash
        run: |
          find core/formal/lean4/.lake/build -path '*WasmVM/Hosts/LeanJS*' -print -delete 2>/dev/null || true

      - name: lake build (library, proofs, #guards, every executable)
        working-directory: core/formal/lean4
        shell: bash
        run: |
          set -o pipefail
          # heavy-step.sh: on the owner's Mac, the disk floor and the Lean build lock; else as is.
          bash ../../../builds/scripts/heavy-step.sh lake build 2>&1 | tee "$RUNNER_TEMP/lake-build.log"

      - name: Tail-recursion gate (danbri/factoidal issue 746)
        if: matrix.platform == 'linux-x86_64'
        working-directory: core
        shell: bash
        run: |
          # The audit reads every generated .c file; a restored .lake cache can
          # hold the IR of modules that no longer exist, so drop those first.
          find formal/lean4/.lake/build/ir -name '*.c' | while read -r c; do
            rel=${c#formal/lean4/.lake/build/ir/}
            [ -f "formal/lean4/${rel%.c}.lean" ] || rm -f "$c"
          done
          python3 tools/lean-tail-recursion-audit.py --gate

      - name: FOUNDATION binding gates (danbri/factoidal issue 975)
        if: matrix.platform == 'linux-x86_64'
        working-directory: core
        shell: bash
        run: |
          # The dataflow registry and its generated inventory, the FOUNDATION
          # import gate (foundation/manifest.toml) and the entry-point gate
          # (every npm export, wasm op and CLI command is bound to a registered
          # stage, or is on the unbound list, which may only shrink).
          bash tests/dataflow/run.sh

      # The case list for the packed-package OWL checks of web-gates: the
      # source boundary gate on the exact core commit built here (the other
      # OWL source gates run in core's verify-lean4.yml). Its report is the
      # --cases input of tools/check-owl-public-artifact.mjs.
      - name: OWL consistency public producer and proof bypass controls
        if: matrix.platform == 'linux-x86_64'
        working-directory: core
        run: python3 tools/check-owl-public-boundary.py --json "$RUNNER_TEMP/owl-public-boundary.json"

      - name: Preserve the OWL boundary report even after failure
        if: always() && matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: owl-reader-assurance-linux
          path: ${{ runner.temp }}/owl-public-boundary.json
          # always(): after a failed gate the report may not exist; that gate's error is the one to read.
          if-no-files-found: warn
          retention-days: 30

      - name: HACL* extern probe (Ed25519 vectors + sha256 differential)
        working-directory: core/formal/lean4
        run: |
          # The macOS checkout skips submodules; section 6 of the probe reads
          # the VCDM 2.0 fixtures and counts a missing directory as a failure
          # (run 19 failed: vc-credential-structural 0 pass, 1 fail).
          if [ ! -d ../../third_party/testing/vc/tests/input ]; then
            git -C ../.. submodule update --init --depth 1 third_party/testing/vc
          fi
          lake exe l4vc-probe

      # core issue 551: leanjs linked Lean's elaborator (11 -> 111 MB) through a proof module in its
      # import closure, and nothing failed. core's tools/binary-budget.py checks the imports of the
      # shipped binaries and, on the built leanjs, Lean-library symbols and the size budget (+2 %).
      - name: Shipped binaries link no Lean compiler code; size budget
        if: matrix.platform == 'linux-x86_64'
        working-directory: core/formal/lean4
        shell: bash
        run: |
          if [ ! -f ../../tools/binary-budget.py ]; then
            echo "core commit carries no tools/binary-budget.py"; exit 0
          fi
          python3 ../../tools/binary-budget.py imports .
          bash ../../../builds/scripts/heavy-step.sh lake build leanjs
          python3 ../../tools/binary-budget.py check leanjs=.lake/build/bin/leanjs
          # leanjs is not a default target: its root's C (JS/Main.c, its own `main`) must not reach
          # the .lake cache, or lean-wasm links it beside the other mains (duplicate main/run_main).
          rm -f .lake/build/ir/L4Factoidal/JS/Main.c* .lake/build/bin/leanjs

      - name: Dispatch ABI and CLI smoke
        working-directory: core/formal/lean4
        run: |
          # The macOS checkout skips submodules; cli-smoke runs W3C SPARQL 1.1
          # query files through `l4factoidal query` (issue 741 cases) and counts
          # missing files as a failure (run 34 failed: cli-smoke 62 pass, 1 fail).
          if [ ! -r ../../third_party/testing/w3c/sparql/sparql11/manifest-all.ttl ]; then
            git -C ../.. submodule update --init --depth 1 third_party/testing/w3c
          fi
          Wasm/native-smoke.sh
          Wasm/cli-smoke.sh

      - name: Lean conformance scoreboard
        if: matrix.platform == 'linux-x86_64'
        working-directory: core
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out/meta"
          if [ -x tools/lean-scoreboard.sh ]; then
            # The scoreboard exits non-zero while any suite has a failing
            # case. That is a measurement, published in the web release; it
            # does not stop the build. The exit code is recorded with it.
            SB_RC=0
            tools/lean-scoreboard.sh --json "$RUNNER_TEMP/out/meta/lean-scoreboard.json" \
              > "$RUNNER_TEMP/out/meta/lean-scoreboard.txt" 2>&1 || SB_RC=$?
            cat "$RUNNER_TEMP/out/meta/lean-scoreboard.txt"
            echo "scoreboard exit code: $SB_RC" | tee -a "$RUNNER_TEMP/out/meta/lean-scoreboard.txt"
            [ -s "$RUNNER_TEMP/out/meta/lean-scoreboard.json" ] || { echo "::error::scoreboard wrote no JSON"; exit 1; }
          else
            echo "core commit carries no tools/lean-scoreboard.sh" | tee "$RUNNER_TEMP/out/meta/lean-scoreboard.txt"
          fi

      - name: Stage native Lean executables
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/out/stage/bin/${{ matrix.platform }}"
          mkdir -p "$D" "$RUNNER_TEMP/out/meta"
          for b in l4factoidal l4w3c l4wasm-cli; do
            cp core/formal/lean4/.lake/build/bin/$b "$D/"
          done
          # l4diff (Lean against F*) ran in web-gates until F* builds stopped on 2026-11-15;
          # it is still staged for manual use. A tool of this pipeline, not a release
          # product: tools/ is not in any set publish.sh assembles.
          if [ "${{ matrix.platform }}" = linux-x86_64 ] && [ -x core/formal/lean4/.lake/build/bin/l4diff ]; then
            mkdir -p "$RUNNER_TEMP/out/tools"
            cp core/formal/lean4/.lake/build/bin/l4diff "$RUNNER_TEMP/out/tools/"
          fi
          python3 - "$RUNNER_TEMP/out/meta/toolchains-lean-${{ matrix.platform }}.json" <<'PY'
          import json, subprocess, sys
          v = subprocess.run(['lean', '--version'], cwd='core/formal/lean4',
                             capture_output=True, text=True).stdout.strip()
          json.dump({'lean': v}, open(sys.argv[1], 'w'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lean-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

  # Not a merge gate (owner, 2026-11-16): runs for core main commits (the release path), the
  # nightly run, and a dispatch with macos=true. On the owner's Mac overnight when it is up.
  lean-macos:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
    runs-on: ${{ fromJSON(needs.resolve.outputs.mac_runs_on) }}
    timeout-minutes: 330
    steps: *lean-steps

  # Fuel monotonicity of the BubblePopJS evaluator (core JS/FuelMonoAll.lean: IH_all over every
  # fuel-taking function of the evaluator's mutual block and the built-in families; the theorems
  # about faster tiers stand on it). `lake build` does not build it: the proof is a chain of
  # generated modules checked one Lean process at a time (about 11 minutes on the Mac, under 2 GB
  # each). A Linux merge gate beside the lean job, not after it: it takes the newest earlier
  # .lake cache, Lake rebuilds the JS modules that changed, and the run's conclusion includes it.
  # A change to a function of the block or to a built-in that breaks a step lemma fails here.
  js-fuel-mono:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
      - name: Does this core commit have the proof target?
        id: has
        shell: bash
        run: |
          if grep -q '^lean_lib JSFuelMono' core/formal/lean4/lakefile.lean; then
            echo "target=true" >> "$GITHUB_OUTPUT"
          else
            echo "target=false" >> "$GITHUB_OUTPUT"
            echo "::notice::this core commit has no JSFuelMono target (before core PR 539): nothing to check"
          fi
      - name: Install elan (toolchain from core's lean-toolchain)
        if: steps.has.outputs.target == 'true'
        run: bash builds/scripts/install-elan.sh
      - name: Restore .lake from the lean job's cache
        if: ${{ steps.has.outputs.target == 'true' && !inputs.cold }}
        uses: actions/cache/restore@v4
        with:
          path: core/formal/lean4/.lake
          key: lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ hashFiles('core/formal/lean4/**/*.lean', 'core/formal/lean4/lakefile.lean', 'core/formal/lean4/ffi/**', 'core/tools/wasmvm/quickjs/*.js') }}
          restore-keys: |
            lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: lake build JSFuelMono (IH_all and the fuel-monotonicity theorems)
        if: steps.has.outputs.target == 'true'
        working-directory: core/formal/lean4
        shell: bash
        run: |
          set -o pipefail
          start=$(date +%s)
          if lake build JSFuelMono 2>&1 | tee "$RUNNER_TEMP/fuel-mono.log"; then
            echo "JSFuelMono: built in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          first=$(grep -E '^(error|✖)' "$RUNNER_TEMP/fuel-mono.log" | grep -m1 -oE 'L4Factoidal[./]JS[./][A-Za-z0-9_]*' || true)
          msg="Fuel monotonicity of the BubblePopJS evaluator no longer checks (first failing module: ${first:-see the log})."
          msg="$msg A function of the evaluator's mutual block or a built-in changed (formal/lean4/L4Factoidal/JS/Interp.lean)."
          msg="$msg After adding or renaming a definition, regenerate the proof modules in core:"
          msg="$msg python3 tools/fuelmono-natives.py formal/lean4/L4Factoidal/JS/Interp.lean formal/lean4/L4Factoidal/JS (built-ins);"
          msg="$msg python3 tools/fuelmono-gen.py formal/lean4/L4Factoidal/JS/Interp.lean --split formal/lean4/L4Factoidal/JS tools/fuelmono-groups.txt (the block; a new function also needs a line in a group)."
          msg="$msg Then lake build JSFuelMono. A step that still fails is a real loss of monotonicity (a handler that swallows a halt, a result at fuel 0 other than out of fuel) or needs a rule in JS/FuelMono.lean. See skills/theorem-pipeline in core."
          echo "::error title=JSFuelMono::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  lean-wasm:
    needs: [resolve, lean]
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core

      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore .lake from the lean job
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v4
        with:
          path: core/formal/lean4/.lake
          key: lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ hashFiles('core/formal/lean4/**/*.lean', 'core/formal/lean4/lakefile.lean', 'core/formal/lean4/ffi/**', 'core/tools/wasmvm/quickjs/*.js') }}
          restore-keys: |
            lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-

      - name: Rebuild modules that include_str non-Lean files
        # Lake does not track include_str inputs (tools/wasmvm/quickjs/prelude.js and
        # webassembly.js, read by WasmVM/Hosts/LeanJS.lean). A .lake restored from an
        # older cache (restore-keys) would keep a stale BubblePopJS prelude, so its
        # outputs are always removed; Lake rebuilds LeanJS and its dependents.
        shell: bash
        run: |
          find core/formal/lean4/.lake/build -path '*WasmVM/Hosts/LeanJS*' -print -delete 2>/dev/null || true

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.8-${{ runner.os }}

      - name: Install Emscripten 6.0.8 and libuv headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y libuv1-dev
          if [ ! -x ~/emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          fi
          ~/emsdk/emsdk install 6.0.8
          ~/emsdk/emsdk activate 6.0.8

      - name: Restore the Lean wasm work dir from toolchain-cache
        shell: bash
        run: |
          set -euo pipefail
          T=$(sed 's|.*:||' core/formal/lean4/lean-toolchain | tr -d ' \n')
          git -C builds fetch -q origin toolchain-cache
          if git -C builds cat-file -e "origin/toolchain-cache:l4wasm-work-cache-$T.tar.gz" 2>/dev/null; then
            git -C builds show "origin/toolchain-cache:l4wasm-work-cache-$T.tar.gz" | tar -xz -C "$HOME"
            echo "restored l4wasm work dir for $T"
          else
            echo "no l4wasm work cache for $T; cold build"
          fi

      - name: Build the Lean wasm module
        shell: bash
        run: |
          set -euo pipefail
          source ~/emsdk/emsdk_env.sh
          mkdir -p core/npm/factoidal/l4-assets core/docs/npm/lean
          L4_WASM_WORK="$HOME/l4wasm-work" core/formal/lean4/Wasm/build-wasm.sh

      - name: Stage Lean web products
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out/meta"
          builds/scripts/stage-products.sh core "$RUNNER_TEMP/out/stage" \
            docs/web/hub/assets/l4 npm/factoidal/l4-assets npm/factoidal-lean docs/npm/lean
          echo '{"emscripten": "6.0.8"}' > "$RUNNER_TEMP/out/meta/toolchains-lean-wasm.json"

      - uses: actions/upload-artifact@v4
        with:
          name: lean-wasm
          path: ${{ runner.temp }}/out/
          retention-days: 7

  # The experimental lab is an independent artifact set. Its failure must
  # not withhold a passing core web/native set. The small engines reuse the
  # same pinned runtime cache; no full library extraction is needed here.
  foafnaut-engines:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.foafnaut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EM_COMPILER_WRAPPER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache-emcc
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 600M
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.8-${{ runner.os }}
      - name: Install Emscripten 6.0.8 and libuv headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y libuv1-dev ccache
          if [ ! -x ~/emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          fi
          ~/emsdk/emsdk install 6.0.8
          ~/emsdk/emsdk activate 6.0.8
      # build-web-render.sh runs `lake build` on part of the library. This job does not wait for
      # the lean job, so it gets the newest earlier Linux cache, and Lake rebuilds what changed.
      - name: Restore .lake from the lean job's cache
        id: lake
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v4
        with:
          path: core/formal/lean4/.lake
          key: lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ hashFiles('core/formal/lean4/**/*.lean', 'core/formal/lean4/lakefile.lean', 'core/formal/lean4/ffi/**', 'core/tools/wasmvm/quickjs/*.js') }}
          restore-keys: |
            lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Rebuild modules that include_str non-Lean files
        # As in the lean job: an older cache (restore-keys) may hold a stale BubblePopJS prelude.
        if: steps.lake.outputs.cache-hit != 'true'
        shell: bash
        run: |
          find core/formal/lean4/.lake/build -path '*WasmVM/Hosts/LeanJS*' -print -delete 2>/dev/null || true
      - name: Restore the Lean runtime cache
        shell: bash
        run: |
          set -euo pipefail
          T=$(sed 's|.*:||' core/formal/lean4/lean-toolchain | tr -d ' \n')
          git -C builds fetch -q origin toolchain-cache
          if git -C builds cat-file -e "origin/toolchain-cache:l4wasm-work-cache-$T.tar.gz" 2>/dev/null; then
            git -C builds show "origin/toolchain-cache:l4wasm-work-cache-$T.tar.gz" | tar -xz -C "$HOME"
          else
            echo "No cache for $T; build-engines.sh will bootstrap only runtime/Init/Std"
          fi
      # ccache under Emscripten (EM_COMPILER_WRAPPER) for the C compiles of build-engines.sh and
      # build-web-render.sh. ccache keys each object on the compiler's bytes, its flags and the
      # preprocessed source with every header, so a hit is the object the compile would make; the
      # cache key below only picks which earlier store to start from (same Emscripten and Lean).
      - name: Cold build, ccache off
        if: ${{ inputs.cold }}
        run: echo "CCACHE_DISABLE=1" >> "$GITHUB_ENV"
      - name: Restore the Emscripten ccache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache-emcc
          key: ccache-emcc-6.0.8-${{ runner.os }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ github.run_id }}
          restore-keys: |
            ccache-emcc-6.0.8-${{ runner.os }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Build and check the Foafnaut engines
        shell: bash
        run: |
          set -euo pipefail
          ccache -z > /dev/null || true   # this run's ccache statistics only
          source ~/emsdk/emsdk_env.sh
          bash core/labs/demos/foafnaut/build-engines.sh --runtime-cache "$HOME/l4wasm-work"
          # test.sh runs in foafnaut-host-tests, on these engines and the HTML engine below,
          # so that a failing test does not stop the engine build or hide the other failures.
          python3 core/tests/external/svg/suite.py --check-fixtures
          python3 -m unittest discover -s core/tests/external/svg -p test_suite.py -v
      # Older core revisions lack the shared stroke producer required by this
      # packager. Keep their existing native build path usable.
      - uses: actions/setup-node@v4
        if: needs.resolve.outputs.foafnaut_web == 'true' || needs.resolve.outputs.foafnaut_linux_browser == 'true'
        with:
          node-version: '22'
      - name: Build and check the Lean HTML browser runtime
        if: needs.resolve.outputs.foafnaut_web == 'true' || needs.resolve.outputs.foafnaut_linux_browser == 'true'
        env:
          LINUX_BROWSER: ${{ needs.resolve.outputs.foafnaut_linux_browser }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f core/docs/web/hub/html-webgpu/index.njk ] || [ "$LINUX_BROWSER" = true ]; then
            source ~/emsdk/emsdk_env.sh
            export FACTOIDAL_WASM_RUNTIME_CACHE="$HOME/l4wasm-work"
            bash core/labs/demos/foafnaut/build-web-render.sh --wasm
            node core/labs/demos/foafnaut/web-render/check-wasm.mjs \
              core/labs/demos/foafnaut/.build/web-render/engines/web-render.mjs \
              "$RUNNER_TEMP/html-wasm-abi.json"
          fi
      - name: ccache statistics
        if: always()
        run: ccache -s || true
      # A sample of the compiles again with no cache: each object must be the same bytes.
      - name: Cache audit (Wasm objects)
        if: needs.resolve.outputs.foafnaut_web == 'true' || needs.resolve.outputs.foafnaut_linux_browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          L=core/labs/demos/foafnaut/.build/web-render
          [ -s "$L/compile-commands.txt" ] || { echo "core has no compile-commands.txt: no audit"; exit 0; }
          source ~/emsdk/emsdk_env.sh
          export EM_CACHE="$PWD/$L/emscripten-cache"
          ( cd core/formal/lean4 && bash ../../../builds/scripts/cache-audit.sh "$OLDPWD/$L/compile-commands.txt" 12 "$RUNNER_TEMP/cache-audit-wasm.json" )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-audit-wasm
          path: ${{ runner.temp }}/cache-audit-wasm.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save the Emscripten ccache
        if: always() && !inputs.cold
        uses: actions/cache/save@v4
        with:
          path: .ccache-emcc
          key: ccache-emcc-6.0.8-${{ runner.os }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: foafnaut-engines
          # Never upload the runtime cache, generated C or object files.
          path: |
            core/labs/demos/foafnaut/.build/engines/*.mjs
            core/labs/demos/foafnaut/.build/engines/*.wasm
            core/labs/demos/foafnaut/.build/web-render/engines/*.mjs
            core/labs/demos/foafnaut/.build/web-render/engines/*.wasm
            core/labs/demos/foafnaut/.build/native-artifact.json
            core/labs/demos/foafnaut/.build/source-SHA256SUMS
            core/labs/demos/foafnaut/.build/tool-versions.txt
            core/labs/demos/foafnaut/.build/runtime-object-witness.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Package the SVG browser runtime from the fresh tested build
        if: needs.resolve.outputs.foafnaut_web == 'true'
        env:
          CORE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/foafnaut-web/stage/docs/web/hub/svg-webgpu/runtime"
          mkdir -p "$(dirname "$STAGE")" "$RUNNER_TEMP/foafnaut-web/meta"
          node builds/scripts/package-svg-runtime.mjs \
            --core core --source-commit "$CORE_SHA" \
            --out "$STAGE" --kind development
          python3 - core/labs/demos/foafnaut/.build/tool-versions.txt core/labs/demos/foafnaut/toolchain-versions.env "$RUNNER_TEMP/foafnaut-web/meta/toolchains-foafnaut-web.json" <<'PY'
          import json, pathlib, subprocess, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          versions = dict(line.split('=', 1) for line in pathlib.Path(sys.argv[2]).read_text().splitlines()
                          if line and not line.startswith('#'))
          value = {'lean_build': lines[0], 'emscripten': versions['EMSCRIPTEN_VERSION'],
                   'deno': subprocess.check_output(['deno', '--version'], text=True).splitlines()[0]}
          json.dump(value, open(sys.argv[3], 'w'), indent=2)
          PY
      - name: Package the HTML browser runtime from the fresh checked build
        if: needs.resolve.outputs.foafnaut_web == 'true'
        env:
          CORE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -f core/docs/web/hub/html-webgpu/index.njk ]; then
            node builds/scripts/package-html-runtime.mjs \
              --core core --source-commit "$CORE_SHA" --kind development \
              --out "$RUNNER_TEMP/foafnaut-web/stage/docs/web/hub/html-webgpu/runtime"
            cp "$RUNNER_TEMP/html-wasm-abi.json" "$RUNNER_TEMP/foafnaut-web/meta/html-wasm-abi.json"
            # The Lean hygiene ratchet's counts from the engine build record; publish.sh
            # refuses a foafnaut-web set without them.
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); "hygiene" in r and json.dump(r["hygiene"],open(sys.argv[2],"w"),indent=2)' \
              core/labs/demos/foafnaut/.build/web-render/source-witness.json "$RUNNER_TEMP/foafnaut-web/meta/hygiene.json"
          fi
      # WasmVM guest modules, one step for all of them: WebAssembly that Lean's WasmVM
      # engine runs inside the Foafnaut engine. Core's own pinned scripts build them from
      # the same source commit; they are published beside the engine runtime and never
      # committed to core (Iron Rule 9). Now: QuickJS-NG for page scripts
      # (tools/wasmvm/build-quickjs.sh; the Hub and the native window load it only when the
      # engine answers scriptSession info). HarfBuzz (build-harfbuzz.sh) and the media
      # decoders (build-media.sh) build the same way and join this step when the engine
      # loads them. A core revision without the page-mode guest (no prelude.js) gets none.
      - name: Build the WasmVM guest modules
        if: needs.resolve.outputs.foafnaut_web == 'true'
        env:
          CORE_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f core/tools/wasmvm/build-quickjs.sh ] && [ -f core/tools/wasmvm/quickjs/prelude.js ]; then
            source ~/emsdk/emsdk_env.sh
            OUT="$RUNNER_TEMP/foafnaut-web/stage/docs/web/hub/wasm-guests"
            mkdir -p "$OUT"
            EMCC="$(command -v emcc)" bash core/tools/wasmvm/build-quickjs.sh "$RUNNER_TEMP/qjs-wasm"
            cp "$RUNNER_TEMP/qjs-wasm/qjs-wasmvm.wasm" "$OUT/qjs-wasmvm.wasm"
            # MIT: a distributed build carries the notice.
            cp "$RUNNER_TEMP/qjs-wasm/src/quickjs-0.18.0/LICENSE" "$OUT/qjs-wasmvm.LICENSE"
            node -e '
              const fs=require("fs"),b=fs.readFileSync(process.argv[1]);
              const names=WebAssembly.Module.exports(new WebAssembly.Module(b)).map(e=>e.name);
              for(const n of ["qjs_new","qjs_eval","qjs_call","qjs_dispatch","qjs_run_job","qjs_page_mode","qjs_page","_initialize"])
                if(!names.includes(n))throw Error("guest module lacks export "+n);
              console.log("qjs-wasmvm.wasm: "+b.length+" bytes, exports checked");' "$OUT/qjs-wasmvm.wasm"
            python3 - "$OUT" "$CORE_SHA" core <<'PY'
          import hashlib, json, pathlib, sys
          out, sha, core = pathlib.Path(sys.argv[1]), sys.argv[2], pathlib.Path(sys.argv[3])
          h = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          builder = core / 'tools/wasmvm/build-quickjs.sh'
          inputs = [builder, core / 'tools/wasmvm/quickjs/qjs_wasmvm_entry.c', core / 'tools/wasmvm/quickjs/prelude.js']
          manifest = {'format': 'factoidal-wasm-guests-v1', 'sourceCommit': sha,
            'files': [{'path': p.name, 'bytes': p.stat().st_size, 'sha256': h(p)} for p in sorted(out.iterdir())],
            'guests': {'qjs-wasmvm.wasm': {'what': 'QuickJS-NG v0.18.0 for page scripts, run by WasmVM in the Foafnaut engine',
              'licence': 'MIT (qjs-wasmvm.LICENSE)',
              'inputs': [{'path': str(p.relative_to(core)), 'sha256': h(p)} for p in inputs]}},
            'qualification': 'Built from the named core commit by its pinned script (tarball SHA-256 checked); exports checked. Not a JavaScript conformance claim.'}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          else
            echo "core has no page-mode QuickJS guest; no WasmVM guest modules"
          fi
      - name: Upload the checked browser runtime release candidate
        if: needs.resolve.outputs.foafnaut_web == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foafnaut-web
          path: ${{ runner.temp }}/foafnaut-web/
          if-no-files-found: error
          retention-days: 7

  # core's test.sh on the engines just built, on Linux, beside the slow macOS bundle job:
  # a test failure shows about 45 minutes after dispatch instead of 2.5 hours, and test.sh
  # lists every failing check. The bundle job runs test.sh again with the native library
  # (the native halves of the Wasm-and-native tests); here those print NOT RUN.
  foafnaut-host-tests:
    needs: [resolve, foafnaut-engines]
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.foafnaut == 'true'
    uses: ./.github/workflows/foafnaut-host-tests.yml
    with:
      core_sha: ${{ needs.resolve.outputs.sha }}

  # Build the document worker from the same source as the Wasm fallback. Keep
  # the worker independent of the web and Mac package jobs.
  foafnaut-linux-native-worker:
    needs: resolve
    if: needs.resolve.outputs.foafnaut_linux_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
          persist-credentials: false
      - name: Install elan and native build dependencies
        run: |
          set -euo pipefail
          bash builds/scripts/install-elan.sh
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d ' \n' < core/formal/lean4/lean-toolchain)"
          sudo apt-get update -q
          sudo apt-get install -y -q libuv1-dev libc++-dev libc++abi-dev
      - name: Restore Linux Lake cache
        if: ${{ !inputs.cold }}
        id: lake
        uses: actions/cache/restore@v4
        with:
          path: core/formal/lean4/.lake
          key: lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ hashFiles('core/formal/lean4/**/*.lean', 'core/formal/lean4/lakefile.lean', 'core/formal/lean4/ffi/**', 'core/tools/wasmvm/quickjs/*.js') }}
          restore-keys: |
            lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Rebuild modules that include_str non-Lean files
        if: steps.lake.outputs.cache-hit != 'true'
        run: |
          if [ -d core/formal/lean4/.lake/build ]; then
            find core/formal/lean4/.lake/build -path '*WasmVM/Hosts/LeanJS*' -delete
          fi
      - name: Restore the native C object cache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v4
        with:
          path: ~/leanc-cache
          key: leanc-objects-v1-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ github.run_id }}
          restore-keys: |
            leanc-objects-v1-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Compile and stage the self-contained worker
        env:
          CORE_SHA: ${{ needs.resolve.outputs.sha }}
          COLD: ${{ inputs.cold }}
        run: |
          set -euo pipefail
          git -C core rev-parse HEAD | grep -Fx "$CORE_SHA"
          if [[ "$COLD" != true ]]; then
            export LEANC_REAL="$(cd core/formal/lean4 && elan which leanc)"
            export LEANC_CACHE="$HOME/leanc-cache"
            export LEANC_ID="$(tr -d ' \n' < core/formal/lean4/lean-toolchain) x86_64"
            mkdir -p "$HOME/leanc-shim" "$LEANC_CACHE"
            install -m 755 builds/release-tests/leanc-cache.sh "$HOME/leanc-shim/leanc"
            export PATH="$HOME/leanc-shim:$PATH"
          fi
          bash core/labs/demos/foafnaut/build-web-render.sh --native 2>&1 | tee "$RUNNER_TEMP/native-worker.log"
          lib=core/labs/demos/foafnaut/.build/web-render/engines/libweb-render.so
          test -s "$lib"
          readelf -dW "$lib" > "$RUNNER_TEMP/native-worker-dynamic.txt"
          if grep -E 'RPATH|RUNPATH' "$RUNNER_TEMP/native-worker-dynamic.txt"; then exit 1; fi
          grep -F 'SELF_CONTAINED libweb-render.so: NEEDED ' "$RUNNER_TEMP/native-worker.log"
          install -D -m 644 "$lib" "$RUNNER_TEMP/native-worker/libweb-render.so"
          (
            cd "$RUNNER_TEMP/native-worker"
            printf '%s\n' "$CORE_SHA" > source-commit.txt
            sha256sum libweb-render.so > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foafnaut-native-worker-log
          path: |
            ${{ runner.temp }}/native-worker.log
            ${{ runner.temp }}/native-worker-dynamic.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: foafnaut-linux-native-worker
          path: ${{ runner.temp }}/native-worker/
          if-no-files-found: error
          retention-days: 7

  foafnaut-browser-linux:
    needs: [resolve, foafnaut-engines, foafnaut-linux-native-worker]
    if: needs.resolve.outputs.foafnaut_linux_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      archive_url: ${{ steps.archive.outputs.artifact-url }}
    env:
      SET: foafnaut-browser-linux-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
          # The browser version record uses git describe when tags are present.
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: actions/download-artifact@v4
        with:
          name: foafnaut-engines
          path: core/labs/demos/foafnaut/.build
      - uses: actions/download-artifact@v4
        with:
          name: foafnaut-linux-native-worker
          path: ${{ runner.temp }}/native-worker
      - name: Install native window build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev
      - name: Build and archive the Linux browser
        shell: bash
        env:
          CORE_SHA: ${{ needs.resolve.outputs.sha }}
          CORE_REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ]
          stage="$RUNNER_TEMP/package"
          worker="$RUNNER_TEMP/native-worker"
          git -C core rev-parse HEAD | grep -Fx "$CORE_SHA"
          grep -Fx "$CORE_SHA" "$worker/source-commit.txt"
          (cd "$worker" && sha256sum -c SHA256SUMS)
          install -m 644 "$worker/libweb-render.so" core/labs/demos/foafnaut/.build/web-render/engines/
          bash core/labs/demos/foafnaut/build-linux-browser.sh "$stage/foafnaut-linux-x86_64"
          cmp "$worker/libweb-render.so" "$stage/foafnaut-linux-x86_64/libweb-render.so"
          python3 - core/labs/demos/foafnaut/.build/tool-versions.txt "$RUNNER_TEMP/toolchains.json" <<'PY'
          import json, pathlib, subprocess, sys
          def first_line(*command):
              return subprocess.check_output(command, text=True).splitlines()[0]
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          versions = {'lean': lines[0], 'emscripten': lines[1], 'deno': first_line('deno', '--version'),
                      'cc': first_line('cc', '--version'), 'sdl2': first_line('pkg-config', '--modversion', 'sdl2')}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(versions))
          PY
          python3 builds/scripts/make-release.py "$stage" "$SET" "$CORE_SHA" "$CORE_REF" \
            "$RUNNER_TEMP/$SET" "$RUNNER_TEMP/toolchains.json"
      - uses: actions/upload-artifact@v4
        id: archive
        with:
          name: ${{ env.SET }}-candidate
          path: ${{ runner.temp }}/${{ env.SET }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  foafnaut-browser-linux-check:
    needs: [resolve, foafnaut-browser-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SET: foafnaut-browser-linux-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
          sparse-checkout: labs/demos/foafnaut/check-linux-browser.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SET }}-candidate
          path: ${{ runner.temp }}/${{ env.SET }}
      - name: Install runtime libraries and X11 test tools
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libvulkan1 \
            mesa-vulkan-drivers xvfb xauth xdotool python3-pil python3-xlib
      - name: Check the relocated browser with Xvfb and Mesa software Vulkan
        shell: bash
        env:
          CORE_SHA: ${{ needs.resolve.outputs.sha }}
          ARCHIVE_URL: ${{ needs.foafnaut-browser-linux.outputs.archive_url }}
        run: |
          set -euo pipefail
          archive="$SET.tar.gz"
          candidate="$RUNNER_TEMP/$SET"
          evidence="$RUNNER_TEMP/linux-browser-evidence"
          verified="$RUNNER_TEMP/$SET-checked"
          relocated="$(mktemp -d "$RUNNER_TEMP/relocated-browser.XXXXXX")"
          mkdir -p "$evidence" "$verified"
          expected=$(jq -er --arg sha "$CORE_SHA" --arg set "$SET" --arg archive "$archive" \
            'select(.source_commit == $sha and .set == $set) | .artifacts[$archive].sha256' "$candidate/build-info.json")
          ( cd "$candidate" && printf '%s  %s\n' "$expected" "$archive" | sha256sum --check )
          tar -xzf "$candidate/$archive" -C "$relocated"
          browser="$relocated/foafnaut-linux-x86_64/foafnaut"
          test -x "$browser"
          (cd "$(dirname "$browser")" && sha256sum -c SHA256SUMS)
          test -s "$(dirname "$browser")/libweb-render.so"
          env -u LD_LIBRARY_PATH "$browser" --version --wasm-engine > "$evidence/wasm-version.txt"
          grep -F "$CORE_SHA" "$evidence/wasm-version.txt"
          if grep -F 'does not match' "$evidence/wasm-version.txt"; then exit 1; fi
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          export PATH=/usr/bin:/bin SDL_VIDEODRIVER=x11 DENO_WEBGPU_BACKEND=vulkan
          export VK_DRIVER_FILES="$driver" XDG_RUNTIME_DIR="$(mktemp -d)"
          cd "$relocated"
          xvfb-run -a -s '-screen 0 1280x1024x24' /usr/bin/python3 \
            "$GITHUB_WORKSPACE/core/labs/demos/foafnaut/check-linux-browser.py" "$browser" "$evidence"
          jq -e --arg sha "$CORE_SHA" --arg digest "$expected" \
            'select(.format == "foafnaut-linux-window-smoke-v1" and .status == "pass" and .worker == "native" and .sourceCommit == $sha) | .archive_sha256 = $digest' \
            "$evidence/window-smoke.json" > "$verified/window-smoke.json"
          printf 'Linux browser GUI smoke passed on Xvfb using Mesa software Vulkan. [Download the checked archive](%s).\n' "$ARCHIVE_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foafnaut-browser-linux-evidence
          path: ${{ runner.temp }}/linux-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SET }}-checked
          path: ${{ runner.temp }}/${{ env.SET }}-checked/window-smoke.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  foafnaut:
    needs: [resolve, lean-macos, foafnaut-engines]
    if: needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.foafnaut == 'true' && needs.resolve.outputs.macos == 'true'
    runs-on: ${{ fromJSON(needs.resolve.outputs.mac_runs_on) }}
    timeout-minutes: 150  # 60 cancelled run 43620498679 at 60 min (2026-11-14) in "Package, relocate and check the native demos"; 30 was cancelled on 2026-11-08 (run 42520417546)
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: actions/download-artifact@v4
        with:
          name: foafnaut-engines
          path: core/labs/demos/foafnaut/.build
      # build-web-render.sh --native runs `lake build` on part of the library: 70 of this job's
      # 99 minutes on 2026-11-15 (run 43686125908) with no cache. The macOS lean job of this run
      # (a need of this job) saved its .lake under this exact key.
      - name: Restore .lake from the lean job's cache
        id: lake
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v4
        with:
          path: core/formal/lean4/.lake
          key: lake-darwin-arm64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ hashFiles('core/formal/lean4/**/*.lean', 'core/formal/lean4/lakefile.lean', 'core/formal/lean4/ffi/**', 'core/tools/wasmvm/quickjs/*.js') }}
          restore-keys: |
            lake-darwin-arm64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Rebuild modules that include_str non-Lean files
        # As in the lean job: an older cache (restore-keys) may hold a stale BubblePopJS prelude.
        if: steps.lake.outputs.cache-hit != 'true'
        shell: bash
        run: |
          find core/formal/lean4/.lake/build -path '*WasmVM/Hosts/LeanJS*' -print -delete 2>/dev/null || true
      - name: Install pinned Lean for fresh native source preparation
        run: bash builds/scripts/install-elan.sh
      # The C objects of Lean's generated C, by content (release-tests/leanc-cache.sh: key is the
      # toolchain, the flags and the C source; Lean's C includes only the toolchain's lean.h).
      # Shared with foafnaut-macos.yml, which compiles the same files with the same flags.
      - name: Restore the C object cache
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v4
        with:
          path: ~/leanc-cache
          key: leanc-objects-v1-darwin-arm64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ github.run_id }}
          restore-keys: |
            leanc-objects-v1-darwin-arm64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Put the object cache in front of leanc
        if: ${{ !inputs.cold }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/leanc-cache" "$HOME/leanc-shim"
          rm -f "$HOME/leanc-cache/.hits" "$HOME/leanc-cache/.misses"; touch "$HOME/leanc-cache/.start"
          cp builds/release-tests/leanc-cache.sh "$HOME/leanc-shim/leanc"; chmod +x "$HOME/leanc-shim/leanc"
          ( cd core/formal/lean4 && lean --version )   # elan installs core's toolchain
          REAL=$(cd core/formal/lean4 && elan which leanc)
          [ -x "$REAL" ]
          { echo "LEANC_REAL=$REAL"; echo "LEANC_CACHE=$HOME/leanc-cache"
            echo "LEANC_ID=$(tr -d ' \n' < core/formal/lean4/lean-toolchain) darwin-arm64"; } >> "$GITHUB_ENV"
          echo "$HOME/leanc-shim" >> "$GITHUB_PATH"
      - name: Package, relocate and check the native demos
        run: bash builds/scripts/heavy-step.sh bash builds/scripts/build-foafnaut.sh core "$RUNNER_TEMP/foafnaut-out"
      - name: Save the C object cache
        if: always() && !inputs.cold
        shell: bash
        run: |
          echo "C objects: $(wc -c < "$HOME/leanc-cache/.hits" 2>/dev/null | tr -d ' ' || echo 0) from the cache, $(wc -c < "$HOME/leanc-cache/.misses" 2>/dev/null | tr -d ' ' || echo 0) compiled" | tee -a "$GITHUB_STEP_SUMMARY"
          # Keep only the objects this build used.
          find "$HOME/leanc-cache" -name '*.o' ! -newer "$HOME/leanc-cache/.start" -delete || true
      - if: always() && !inputs.cold
        uses: actions/cache/save@v4
        with:
          path: ~/leanc-cache
          key: leanc-objects-v1-darwin-arm64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ github.run_id }}
      # A sample of the native compiles again with the real leanc: each object must be the same bytes.
      - name: Cache audit (native objects)
        # Also after a failed test: the objects are built before test.sh runs.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          L=core/labs/demos/foafnaut/.build/web-render
          [ -s "$L/compile-commands.txt" ] || { echo "core has no compile-commands.txt: no audit"; exit 0; }
          ( cd core/formal/lean4 && bash ../../../builds/scripts/cache-audit.sh "$OLDPWD/$L/compile-commands.txt" 8 "$RUNNER_TEMP/cache-audit-native.json" )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-audit-native
          path: ${{ runner.temp }}/cache-audit-native.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check standalone native HTML architecture and dependencies
        run: |
          python3 - "$RUNNER_TEMP/foafnaut-out/stage/foafnaut/lean-html-scene-darwin-arm64" <<'PY'
          import json, pathlib, subprocess, sys
          binary = pathlib.Path(sys.argv[1])
          if not binary.exists():
              print('This source has no native HTML producer')
              raise SystemExit(0)
          architectures = subprocess.check_output(['lipo', '-archs', str(binary)], text=True).split()
          if architectures != ['arm64']:
              raise SystemExit(f'Unexpected native HTML architectures: {architectures}')
          lines = subprocess.check_output(['otool', '-L', str(binary)], text=True).splitlines()[1:]
          dependencies = [line.split(' (', 1)[0].strip() for line in lines if line.strip()]
          if not dependencies or any(not path.startswith(('/usr/lib/', '/System/Library/')) for path in dependencies):
              raise SystemExit(f'Non-system native HTML runtime dependency: {dependencies}')
          print(json.dumps({'nativeHtmlArchitectures': architectures, 'systemDependencies': dependencies,
                            'scope': 'Architecture and dynamic dependencies; behavior has separate relocated CPU checks, no GPU claim'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: foafnaut-darwin-arm64
          path: ${{ runner.temp }}/foafnaut-out/
          # The staged browser demo imports four checked files from web/.build/engines.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # No F* jobs since 2026-11-15: the project is Lean first, and automatic F* builds, tests
  # and release products stopped (the F* sources stay in core). The fstar and fstar-macos
  # jobs are in this file's history (builds commit 34e80a1) if F* is ever built again.
  web-gates:
    # The npm package's own suite, on the Lean wasm module of lean-wasm installed into a
    # core checkout. The web release is published only when this job passes.
    needs: [resolve, lean, lean-wasm]
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: lean-wasm
          path: art/lean-wasm
      - name: Install the Lean engine's web products into the checkout
        shell: bash
        run: |
          set -euo pipefail
          for d in art/lean-wasm/stage; do
            ( cd "$d" && tar -cf - . ) | ( cd core && tar -xpf - )
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: owl-reader-assurance-linux
          path: art/owl-assurance
      - name: Pack and extract the OWL test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owl-package"
          ( cd core/npm/factoidal && npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/owl-package" ) > "$RUNNER_TEMP/owl-package/pack.json"
          python3 - "$RUNNER_TEMP/owl-package" <<'PY'
          import hashlib, json, pathlib, sys, tarfile
          dest = pathlib.Path(sys.argv[1])
          packed = json.loads((dest / 'pack.json').read_text())
          entry = packed[0] if isinstance(packed, list) else packed['@factoidal/core']
          filename = entry['filename']
          assert pathlib.Path(filename).name == filename
          archive = dest / filename
          with tarfile.open(archive) as stream:
              stream.extractall(dest, filter='data')
          (dest / 'sha256.json').write_text(json.dumps({
              'filename': filename, 'bytes': archive.stat().st_size,
              'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()
          }, indent=2) + '\n')
          PY
      # The two OWL package tools of a core commit older than OWL_TOOLS_SHA
      # (factoidal-core PR 178) stop before any case: they expect 20 cases
      # where the boundary report has 23, and a `reason` on a `true` answer.
      # For such a commit the tools of OWL_TOOLS_SHA run instead; the case
      # list still comes from the commit built here. Cost of not having this:
      # the 0.20.0 commit 0c9a222b could not get its web release.
      - name: OWL package check tools for this core commit
        id: owltools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ needs.resolve.outputs.sha }}
          OWL_TOOLS_SHA: e655516c98ace27d604c199bd48ef88f05e7b97c
        run: |
          set -euo pipefail
          status=$(gh api "repos/$CORE_REPO/compare/$OWL_TOOLS_SHA...$CORE_SHA" --jq .status)
          if [ "$status" = ahead ] || [ "$status" = identical ]; then
            echo "dir=core/tools" >> "$GITHUB_OUTPUT"
            echo "core $CORE_SHA carries the OWL package tools ($status against $OWL_TOOLS_SHA)"
          else
            dir="$RUNNER_TEMP/owl-tools"
            mkdir -p "$dir"
            for f in check-owl-public-artifact.mjs test-owl-public-artifact.mjs; do
              gh api -H 'Accept: application/vnd.github.raw' \
                "repos/$CORE_REPO/contents/tools/$f?ref=$OWL_TOOLS_SHA" > "$dir/$f"
              test -s "$dir/$f"
            done
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
            echo "::warning::core $CORE_SHA is $status against $OWL_TOOLS_SHA; the OWL package tools of $OWL_TOOLS_SHA run"
          fi
      - name: OWL artifact runner refusal and hard-timeout controls
        run: >-
          node ${{ steps.owltools.outputs.dir }}/test-owl-public-artifact.mjs
          --cases art/owl-assurance/owl-public-boundary.json
          --json "${{ runner.temp }}/owl-artifact-controls.json"
      - name: Checked OWL consistency through packed Wasm and npm facade
        run: >-
          node ${{ steps.owltools.outputs.dir }}/check-owl-public-artifact.mjs
          --package "${{ runner.temp }}/owl-package/package"
          --cases art/owl-assurance/owl-public-boundary.json
          --json "${{ runner.temp }}/owl-public-artifact.json"
      - name: Preserve OWL package evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl-public-artifact
          path: |
            ${{ runner.temp }}/owl-public-artifact.json
            ${{ runner.temp }}/owl-artifact-controls.json
            ${{ runner.temp }}/owl-package/pack.json
            ${{ runner.temp }}/owl-package/sha256.json
          if-no-files-found: warn
          retention-days: 30
      - name: npm package suite
        working-directory: core/npm/factoidal
        shell: bash
        run: |
          set -o pipefail
          # The package's own test script (node --test with its globs; Node 22
          # does not take a bare directory). esbuild is its one dev dependency
          # (the bundler test); --ignore-scripts keeps the install inert.
          npm ci --ignore-scripts --no-audit --no-fund
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-suite.txt"
      - name: The npm suite skipped no test
        shell: bash
        run: |
          # A skipped test is not a pass (danbri/factoidal issue 1038, P3): a
          # test that skips on a capability probe passes silently on a wasm
          # that lacks the capability. node --test prints "# skipped N" (TAP,
          # the default when stdout is not a terminal) or "ℹ skipped N" (spec).
          set -euo pipefail
          F="$RUNNER_TEMP/npm-suite.txt"
          SKIP=$(grep -E '^(#|ℹ) (skip|skipped) [0-9]+$' "$F" | tail -n 1 | awk '{print $NF}' || true)
          TODO=$(grep -E '^(#|ℹ) todo [0-9]+$' "$F" | tail -n 1 | awk '{print $NF}' || true)
          if [ -z "$SKIP" ]; then
            echo "::error::no skip count in the npm suite summary (format changed?)"; exit 1
          fi
          echo "npm suite: skipped $SKIP, todo ${TODO:-?}"
          if [ "$SKIP" -ne 0 ]; then
            echo "::error::the npm suite skipped $SKIP test(s); a skip is not a pass:"
            grep -E '# SKIP|﹣' "$F" || true
            exit 1
          fi
      # Touchstone client lab (https://github.com/ebremer/touchstone, module
      # harness-clients, 53 client rules): our LWS client does what each task
      # says. tools/lws-touchstone-client.sh clones Touchstone at the commit
      # it pins, builds the lab with Maven, starts it on a loopback port and
      # runs tests/lws/client/touchstone-session.mjs against the Lean wasm
      # engine installed above. Exit 0: no rule failed and every rule that
      # did not pass is listed in tests/lws/client/touchstone-xfail.tsv
      # (issue 1043). Exit 1: a failure or an unlisted non-pass. Exit 2: the
      # lab could not run. Any non-zero exit fails the job.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Maven repository cache (Touchstone lab dependencies)
        uses: actions/cache@v4
        with:
          path: ~/.m2-touchstone
          key: touchstone-m2-${{ hashFiles('core/tools/lws-touchstone-client.sh') }}
      - name: LWS client, Touchstone client lab
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          if [ ! -f tools/lws-touchstone-client.sh ]; then
            echo "core commit has no tools/lws-touchstone-client.sh" | tee "$RUNNER_TEMP/out/lws-touchstone-client.txt"
            exit 0
          fi
          mvn -version
          export TOUCHSTONE_M2="$HOME/.m2-touchstone"
          export TOUCHSTONE_OUT="$RUNNER_TEMP/out/touchstone-client"
          # pipefail: LAB_RC is the script's exit code, not tee's.
          LAB_RC=0
          bash tools/lws-touchstone-client.sh 2>&1 | tee "$RUNNER_TEMP/out/lws-touchstone-client.txt" || LAB_RC=$?
          echo "lws-touchstone-client exit code: $LAB_RC" | tee -a "$RUNNER_TEMP/out/lws-touchstone-client.txt"
          exit "$LAB_RC"
      - name: Mark web gates passed
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/npm-suite.txt" "$RUNNER_TEMP/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: web-gates
          path: ${{ runner.temp }}/out/
          retention-days: 7

  # Each set publishes after its own gates. This job can publish CLI and web sets while the
  # Linux browser or macOS apps are still being verified (scripts/publish.sh).
  publish:
    needs: [resolve, lean, lean-wasm, web-gates, foafnaut-engines, foafnaut-host-tests]
    if: always() && needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: '{lean-linux-x86_64,lean-wasm,web-gates,foafnaut-web}'
      - name: Assemble, pack and publish the Linux-built sets (linux-x86_64, web, foafnaut-web)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT: ${{ needs.resolve.outputs.short }}
          REF: ${{ needs.resolve.outputs.ref }}
          PUBLISH_SETS: linux-x86_64 web foafnaut-web
          # The engines' tests (test.sh, in foafnaut-host-tests) gate the web runtime. Until
          # 2026-11-15 test.sh ran inside foafnaut-engines before the HTML engine existed, so
          # only its first part gated; now all of it does, on the Wasm engines.
          FOAFNAUT_WEB: ${{ needs.resolve.outputs.foafnaut_web == 'true' && needs['foafnaut-engines'].result == 'success' && needs['foafnaut-host-tests'].result == 'success' }}
        run: scripts/publish.sh

  # This archive has its own source-pinned engine, host tests and relocated X11 check.
  # The Lean SDK lane runs FOUNDATION checks for its CLI and web packages.
  publish-linux-browser:
    needs: [resolve, foafnaut-host-tests, foafnaut-browser-linux-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: 'foafnaut-browser-linux-x86_64-*'
      - name: Publish the checked Linux browser archive
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT: ${{ needs.resolve.outputs.short }}
          REF: ${{ needs.resolve.outputs.ref }}
          PUBLISH_SETS: foafnaut-browser-linux-x86_64
          FOAFNAUT_LINUX_BROWSER: ${{ needs.resolve.outputs.foafnaut_linux_browser }}
        run: scripts/publish.sh

  publish-macos:
    needs: [resolve, lean-macos, foafnaut]
    if: always() && needs.resolve.outputs.proceed == 'true' && needs.resolve.outputs.macos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the macOS artifacts (lean-darwin-arm64, foafnaut-darwin-arm64).
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: '*-darwin-arm64'
      - name: Assemble, pack and publish the macOS sets (darwin-arm64, foafnaut-darwin-arm64)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT: ${{ needs.resolve.outputs.short }}
          REF: ${{ needs.resolve.outputs.ref }}
          PUBLISH_SETS: darwin-arm64 foafnaut-darwin-arm64
          FOAFNAUT: ${{ needs.resolve.outputs.foafnaut }}
        run: scripts/publish.sh

  # Timing and cache record of this run (scripts/ci-metrics.py): a table in the run summary,
  # an artifact, and a row per job on the branch ci-metrics (runs.csv, runs/<run_id>.json).
  # `python3 scripts/ci-metrics.py trend` shows the last runs side by side.
  metrics:
    needs: [resolve, publish, publish-linux-browser, publish-macos]
    if: always() && needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the ci-metrics branch
      actions: write    # read job logs; delete superseded caches
    steps:
      - uses: actions/checkout@v4
      - name: Timing and cache record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci-metrics.py run --run-id "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/m" --skip-job metrics
          cat "$RUNNER_TEMP/m/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-metrics
          path: ${{ runner.temp }}/m/
          retention-days: 90
      - name: Record on the branch ci-metrics
        run: scripts/record-ci-metrics.sh "$RUNNER_TEMP/m/ci-metrics-$GITHUB_RUN_ID.json"
      # Old entries of the .lake, ccache and leanc object cache families go (the newest two of
      # each stay), so the 10 GB store does not evict the small compiler caches first. Speed only:
      # every restore falls back to the newest entry and each tool checks what it restores.
      - name: Drop superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-metrics.py prune --keep 2

  # The nightly run's report: an issue labelled "nightly" opened or updated on failure, closed
  # when green, and a one-line summary for the coordination log (scripts/nightly-report.sh).
  nightly-report:
    needs: [resolve, publish, publish-linux-browser, publish-macos]
    if: always() && needs.resolve.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.resolve.outputs.short }}
          PROCEED: ${{ needs.resolve.outputs.proceed }}
        run: scripts/nightly-report.sh
