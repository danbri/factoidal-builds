# Publish npm/factoidal (@factoidal/core) to npmjs.com via TRUSTED
# PUBLISHING (OIDC) — no npm tokens anywhere.
#
# https://docs.npmjs.com/trusted-publishers
# Requirements met here: GitHub-hosted runner; id-token: write; npm CLI
# >= 11.5.1 + Node >= 22.14 (Node 24 ships npm 11.x; the version-check
# step makes a too-old npm fail loudly rather than fall back to token
# auth); package.json's repository.url matches this repository.
#
# npmjs.com side (one-time, owner): package Settings -> Trusted
# Publisher -> GitHub Actions with EXACTLY:
#   Organization or user: danbri
#   Repository:           factoidal-builds
#   Workflow filename:    npm-publish.yml
#   Environment name:     (leave blank)
#   Allowed actions:      npm publish
# Fields are case-sensitive; npm validates them only at publish time.
#
# EXTRACTION DRIFT CHECK NOTE (issue #465): the drift check that
# re-extracts F* and verifies the committed .ml now runs in
# factoidal-core's CI pipeline (check-extraction.yml). That repo owns
# the formal sources and the extraction guarantee. This workflow publishes
# the committed npm package (whose assets depend on extraction) after
# verifying in core that the extraction is valid. The package's
# prepublishOnly gate (npm test, candidate-package tests) still runs
# inside npm publish.
#
# Trigger: manual (workflow_dispatch) or an npm-v* tag. The publish
# ships the COMMITTED npm/factoidal tree — bundles are committed
# (iron rule #9 family) — after prepublishOnly tests pass.
#
# Cost: ~3-5 min (Node setup + npm test only, no F* extraction).
name: npm-publish
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'npm-v*'
permissions:
  id-token: write   # OIDC — required for trusted publishing
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Extraction drift check happens in factoidal-core's check-extraction.yml
      # This workflow assumes the committed npm/ package is already verified
      # by core's CI pipeline before this tag is pushed.

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm version (trusted publishing needs >= 11.5.1)
        run: |
          node --version
          npm --version
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5)) { print "npm too old for trusted publishing"; exit 1 } }'

      - name: Publish (OIDC; provenance generated automatically)
        working-directory: npm/factoidal
        run: npm publish
