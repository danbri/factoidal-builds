name: Verify mobile Wikipedia pointer input with the bounded link transport
on:
  push:
    branches: [wip/mobile-wikipedia-pointer-replay]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: 2a69ebffd8ed7de14afde70c6da3937483b00202
  WEB: build-05ec0b29ca8a-foafnaut-web
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            release-tests/packaged-linux-survey.py
            third_party/realpages/en.wikipedia.org/m-us-20261115.zip
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 2a69ebffd8ed7de14afde70c6da3937483b00202
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45464645924
          name: foafnaut-browser-linux-x86_64-candidate
          path: package
          github-token: ${{ github.token }}
      - name: Run the exact candidate host on the same graphical runtime
        shell: bash
        run: |
          set -euo pipefail
          lab="$PWD/core/labs/demos/foafnaut"
          test "$(git -C core rev-parse HEAD)" = "$CORE"
          mkdir -p runtime out work
          mapfile -t archives < <(find package -name '*.tar.gz')
          test "${#archives[@]}" -eq 1
          echo "76e2d22ed3e6a52ef8e79d347bae491a19f486799d7873644619645fb948ed4e  ${archives[0]}" | sha256sum -c -
          tar -xzf "${archives[0]}" -C package
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -D runtime -p build-info.json -p foafnaut-web.tar.gz
          digest=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' runtime/build-info.json)
          echo "$digest  runtime/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf runtime/foafnaut-web.tar.gz -C runtime docs/web/hub/html-webgpu/runtime
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          window=$(find "$PWD/package" -name libnative-window.so -print -quit)
          cp "$window" "$lab/.build/native/"
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool python3-pil python3-xlib
          export VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$VK_DRIVER_FILES"
          export SDL_VIDEODRIVER=x11 DENO_WEBGPU_BACKEND=vulkan XDG_RUNTIME_DIR="$RUNNER_TEMP/foafnaut-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export DIAG_LAB="$lab" DIAG_DENO=$(command -v deno)
          export SNAPSHOT="$PWD/third_party/realpages/en.wikipedia.org/m-us-20261115.zip"
          echo "8801911e887d74487d0f43358aed2506751cbabbcd9ecca11209b5eb2792195c  $SNAPSHOT" | sha256sum -c -
          cat > work/foafnaut <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          extra=()
          if [[ -n ${REALPAGES_REPLAY:-} ]]; then extra=(--preload "$DIAG_LAB/realpages/replay.ts"); fi
          exec "$DIAG_DENO" run --no-check --no-config --no-npm --unstable-ffi --unstable-webgpu -A "${extra[@]}" "$DIAG_LAB/run_html.ts" --wasm-engine "$@"
          SH
          chmod +x work/foafnaut
          mapfile -t selection < <(jq -r '.pages | to_entries[] | select(.value.id=="m-us") | .key' "$lab/realpages/pages.json")
          test "${#selection[@]}" -eq 1
          count=$(jq '.pages|length' "$lab/realpages/pages.json")
          for mode in archived live; do
            if [[ "$mode" == archived ]]; then export REALPAGES_REPLAY="$SNAPSHOT"; else unset REALPAGES_REPLAY; fi
            xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 release-tests/packaged-linux-survey.py               "$PWD/work/foafnaut" "$lab" "$PWD/out/$mode" "${selection[0]}" "$count"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          for mode in ("archived", "live"):
              root = Path("out", mode)
              row, = json.loads((root / "summary.json").read_text())
              assert row["id"] == "m-us", row
              assert row["state"] == "presented", row
              assert row["scrollChangesPixels"] and row["scrollTrace"]["scroll"] > 0, row
              assert row["loaded"]["links"] > 10000, row
              log = (root / "m-us.log").read_text()
              assert "link regions: input exceeds" not in log
              print(mode, row["loaded"]["links"], row["presentedMs"], row["scrollObservedMs"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-wikipedia-pointer-window
          path: out/
          retention-days: 7
