name: Measure cold single-scene and layered Linux window presentation
on:
  push:
    branches: [wip/linux-window-first-frame-paths]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: release-tests/first-frame-window-paths.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 45464645924
          name: foafnaut-browser-linux-x86_64-candidate
          path: package
          github-token: ${{ github.token }}
      - name: Alternate both renderer paths with fresh driver caches
        env:
          SDL_VIDEODRIVER: x11
          DENO_WEBGPU_BACKEND: vulkan
          FOAFNAUT_DIAGNOSTIC_FIRST_PAINT_ONLY: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          mapfile -t archives < <(find package -name '*.tar.gz')
          test "${#archives[@]}" -eq 1
          echo "76e2d22ed3e6a52ef8e79d347bae491a19f486799d7873644619645fb948ed4e  ${archives[0]}" | sha256sum -c -
          tar -xzf "${archives[0]}" -C package
          binary=$(find "$PWD/package" -type f -name foafnaut -print -quit)
          echo "f13f8bf61fa7f760d37308b70ad7d4d55c89a707b969ec5a7fad44eaf7f59e0c  $binary" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool python3-pil python3-xlib
          dpkg-query -W mesa-vulkan-drivers libvulkan1 libsdl2-2.0-0 > out/driver-versions.txt
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -f "$VK_DRIVER_FILES"
          unset MESA_SHADER_CACHE_DISABLE MESA_SHADER_CACHE_DIR
          rc=0
          for pass in a1 b1 b2 a2; do
            export FOAFNAUT_SCENE_MODE=layered
            if [[ "$pass" == b* ]]; then FOAFNAUT_SCENE_MODE=single; fi
            export XDG_CACHE_HOME="$RUNNER_TEMP/cache-$pass"
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime-$pass"
            install -d -m 700 "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
            mkdir "out/$pass"
            xvfb-run -a -s '-screen 0 1280x1024x24' /usr/bin/python3 release-tests/first-frame-window-paths.py               "$binary" "$PWD/out/$pass" || rc=1
          done
          test "$rc" = 0
          /usr/bin/python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          from PIL import Image

          print("| Pass | Layout ms | Graphics session ms | Draw ms | Visible frame ms |")
          print("| --- | --- | --- | --- | --- |")
          for arm in ("a1", "b1", "b2", "a2"):
              root = Path("out", arm)
              rec = json.loads((root/"window-smoke.json").read_text())
              frame = rec["firstFrame"]
              assert rec["status"] == "pass" and rec["pages"][0]["matchedPixels"] > 1500
              assert bool(frame.get("layers")) == arm.startswith("a"), (arm, frame)
              with Image.open(root/"first.png") as image:
                  assert image.size == (800, 500)
              print("|", arm, "|", frame["layoutMs"], "|", frame["sessionMs"], "|",
                    frame["drawMs"], "|", rec["pages"][0]["sinceLaunchMs"], "|")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-first-frame-scene-paths
          path: out/
          retention-days: 7
