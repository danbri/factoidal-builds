name: Compare the three CSS2 list-marker float regressions
on:
  push:
    branches: [wip/float-list-marker-pixel-pair]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  BASELINE_RUN: "45530401313"
  CANDIDATE_RUN: "45530814625"
  BASELINE: 1b851ac72fdf346f904de1d2ef77dc87a7d52da1
  CANDIDATE: 84b19a75a2ccbb92a3c8224f54b7873edb5ba47a
  WPT: 056c528ccb5844b01628e0cd667520535dee16cc
  WEB: build-05ec0b29ca8a-foafnaut-web
jobs:
  wait-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Wait for exact native engine artifacts
        run: |
          set -euo pipefail
          for pair in "$BASELINE_RUN:foafnaut-linux-native-worker" "$CANDIDATE_RUN:branch-engine"; do
            endpoint="repos/$GITHUB_REPOSITORY/actions/runs/${pair%%:*}"
            artifact="${pair#*:}"
            until gh api "$endpoint/artifacts" --jq '.artifacts[] | select(.expired|not) | .name' | grep -Fx "$artifact"; do
              if [[ "$(gh api "$endpoint" --jq .status)" == completed ]]; then exit 1; fi
              sleep 30
            done
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs" --jq '.jobs[].name' |
            grep -Fx "Build libweb-render.so from $CANDIDATE"
  reftest:
    needs: wait-engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.BASELINE }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            tests/browser-wpt
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BASELINE_RUN }}
          name: foafnaut-linux-native-worker
          path: engines/baseline
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CANDIDATE_RUN }}
          name: branch-engine
          path: engines/candidate
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Pin the engine, harness, and WPT inputs
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$BASELINE"
          (cd engines/baseline && grep -Fx "$BASELINE" source-commit.txt && sha256sum -c SHA256SUMS)
          mkdir -p runtime out wpt/css/CSS2/lists/support wpt/css/reference
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -D runtime -p build-info.json -p foafnaut-web.tar.gz
          expected=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' runtime/build-info.json)
          echo "$expected  runtime/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf runtime/foafnaut-web.tar.gz -C runtime docs/web/hub/html-webgpu/runtime
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          curl --compressed --retry 3 -fsSL "https://wpt.fyi/api/manifest?sha=$WPT" -o MANIFEST.json
          download() {
            curl --retry 3 -fsSL "https://raw.githubusercontent.com/web-platform-tests/wpt/$WPT/$1" -o "wpt/$1"
          }
          for test in list-style-applies-to-017 list-style-image-applies-to-017 list-style-type-applies-to-017 list-style-image-applies-to-ref-1; do
            download "css/CSS2/lists/$test.html"
          done
          download css/reference/single_square_list_marker.xht
          download css/CSS2/lists/support/blue15x15.png
          sha256sum engines/*/libweb-render.so > out/inputs.sha256
      - name: Render both arms and retain the pixel evidence
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          prefix=css/CSS2/lists
          only="/$prefix/list-style-applies-to-017.html,/$prefix/list-style-image-applies-to-017.html,/$prefix/list-style-type-applies-to-017.html"
          for role in baseline candidate; do
            python3 core/tests/browser-wpt/wpt-reftests.py run --manifest MANIFEST.json --wpt-root "$PWD/wpt" \
              --native-engine "$PWD/engines/$role/libweb-render.so" --prefix "$prefix/" --jobs 1 --only "$only" --out "$PWD/out/$role"
            jq -e '.valid and (.tests | length == 3)' "out/$role/results.json"
            jq -r --arg role "$role" '.tests[] | [$role,.test,.status,([.edges[].totalPixels // 0] | add)] | @tsv' \
              "out/$role/results.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: float-list-marker-pixel-pair
          path: out/
          retention-days: 7
