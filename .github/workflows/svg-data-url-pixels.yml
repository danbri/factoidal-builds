name: SVG data URL reftests
on:
  push:
    branches: [wip/svg-data-url-pixels]
    paths: [.github/workflows/svg-data-url-pixels.yml]
permissions:
  actions: read
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      WPT: 4b26db8978f6024d3184ca483d74afbc354b35de
      WEB_TAG: build-ef1710ff226d-foafnaut-web
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 042a49667c8a19953c359093979ad8cc866b352e
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub
            third_party/fonts
            tests/browser-wpt
            formal/lean4/lean-toolchain
          sparse-checkout-cone-mode: false
      - name: Wait for the exact native engine build
        shell: bash
        run: |
          set -euo pipefail
          for pair in 45089145355:042a49667c8a19953c359093979ad8cc866b352e; do
            run=${pair%%:*}
            sha=${pair#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[].name' |
              grep -Fx "Build libweb-render.so from $sha"
            until gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx branch-engine; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status || true)
              if [[ $status == completed ]]; then
                echo "::error::Native build run $run ended without a branch-engine artifact."
                exit 1
              fi
              sleep 30
            done
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 45089145355
          name: branch-engine
          github-token: ${{ github.token }}
          path: candidate
      - id: pins
        run: echo "deno=v$(sed -n 's/^DENO_VERSION=//p' core/labs/demos/foafnaut/toolchain-versions.env)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.pins.outputs.deno }}
      - name: Install the renderer runtime and pinned WPT inputs
        shell: bash
        run: |
          set -euo pipefail
          tc=$(tr -d '[:space:]' < core/formal/lean4/lean-toolchain)
          test "$tc" = "$(cat candidate/lean-toolchain)"
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          echo "LD_LIBRARY_PATH=$(ELAN_TOOLCHAIN="$tc" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean" >> "$GITHUB_ENV"
          gh release download "$WEB_TAG" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz
          echo 'cb7ef521b7ec41ae27375afba8d7056f75295498419a9f5f976e08323b7353d5  foafnaut-web.tar.gz' | sha256sum -c -
          mkdir -p web
          tar -xzf foafnaut-web.tar.gz -C web docs/web/hub/html-webgpu/runtime
          runtime=web/docs/web/hub/html-webgpu/runtime
          host=core/labs/demos/foafnaut/.build
          mkdir -p "$host/native-html/runtime" "$host/engines"
          cp "$runtime"/web-render.{mjs,wasm} "$host/native-html/runtime/"
          cp "$runtime"/render-plan.{mjs,wasm} "$host/engines/"
          curl --compressed --retry 3 -fsSL "https://wpt.fyi/api/manifest?sha=$WPT" -o MANIFEST.json
      - uses: actions/checkout@v4
        with:
          repository: web-platform-tests/wpt
          ref: 4b26db8978f6024d3184ca483d74afbc354b35de
          path: wpt
          persist-credentials: false
          sparse-checkout: |
            svg
            css/support
            css/reference
            common
            fonts
            images
      - name: Run the SVG image data URL reftests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA' > names.txt
          import json
          from pathlib import Path

          manifest = Path("MANIFEST.json")
          data = json.loads(manifest.read_text())
          svg = data["items"]["reftest"]["svg"]
          previous = {
              '/svg/embedded/image-embedding-svg-viewref-with-viewbox.svg': 'FAIL',
              '/svg/embedded/image-embedding-svg-with-fractional-viewbox.svg': 'FAIL',
              '/svg/embedded/image-embedding-svg-with-viewport-units-inline-style.svg': 'FAIL',
              '/svg/embedded/image-embedding-svg-with-viewport-units.svg': 'FAIL',
              '/svg/embedded/image-modify-href-1.svg': 'TIMEOUT',
              '/svg/embedded/image-modify-href-3.svg': 'TIMEOUT',
              '/svg/embedded/image-preserveaspectratio-ignores-svg-root-viewbox.html': 'FAIL',
              '/svg/embedded/image-preserveaspectratio-meet-svg-viewbox-only.html': 'FAIL',
              '/svg/embedded/image-preserveaspectratio-meet-svg-with-size.html': 'FAIL',
              '/svg/embedded/image-preserveaspectratio-none-animated-viewbox.html': 'FAIL',
              '/svg/embedded/image-preserveaspectratio-none-shared-document.html': 'FAIL',
              '/svg/embedded/image-preserveaspectratio-none-svg-viewbox-only.html': 'FAIL',
              '/svg/embedded/image-preserveaspectratio-overrides-svg-root.html': 'FAIL',
              '/svg/embedded/image-preserveaspectratio-slice-svg.html': 'FAIL',
              '/svg/embedded/image-remove-href-1.svg': 'TIMEOUT',
              '/svg/embedded/image-remove-href-3.svg': 'TIMEOUT',
              '/svg/painting/reftests/non-scaling-stroke-non-uniform-scale.html': 'FAIL',
              '/svg/painting/reftests/non-scaling-stroke-with-none-preserve-aspect-ratio.html': 'FAIL',
          }
          folder = Path("wpt/svg/foafnaut-regressions")
          folder.mkdir(parents=True, exist_ok=True)
          opening = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">'
          rect = '<rect width="64" height="64" fill="green"/>'
          nested = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">' + rect + '</svg>'
          escaped = nested.replace('&', '&amp;').replace('<', '&lt;').replace('"', '&quot;')
          (folder / "inline-data.svg").write_text(opening +
              '<image width="64" height="64" href="data:image/svg+xml,' + escaped + '"/></svg>')
          (folder / "inline-data-ref.svg").write_text(opening + rect + '</svg>')
          local = "/svg/foafnaut-regressions/inline-data.svg"
          svg["foafnaut-regressions"] = {
              "inline-data.svg": ["local", [None, [
                  ["/svg/foafnaut-regressions/inline-data-ref.svg", "=="]
              ], {}]]
          }
          manifest.write_text(json.dumps(data))
          Path("baseline.json").write_text(json.dumps(previous))
          print(",".join(sorted(previous) + [local]))
          PYDATA
          names=$(cat names.txt)
          python3 core/tests/browser-wpt/wpt-reftests.py run --manifest MANIFEST.json \
            --wpt-root "$PWD/wpt" --native-engine "$PWD/candidate/libweb-render.so" \
            --prefix svg/ --jobs 2 --only "$names" --out "$PWD/out"
          python3 - "$names" <<'PYREPORT' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path

          previous = json.loads(Path("baseline.json").read_text())
          names = set(sys.argv[1].split(","))
          data = json.loads(Path("out/results.json").read_text())
          assert data["valid"], data
          actual = {row["test"]: row for row in data["tests"]}
          assert set(actual) == names, set(actual) ^ names
          print("Historical baseline: 7444aac0e2db, workflow 45080060302")
          for name in sorted(actual):
              row = actual[name]
              print(name, previous.get(name, "local"), "->", row["status"], row.get("skipped", ""))
          local = "/svg/foafnaut-regressions/inline-data.svg"
          assert actual[local]["status"] == "PASS", actual[local]
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-data-url-pixels
          path: out/
          retention-days: 14

