name: Verify the W3C search form in native Foafnaut
on:
  push:
    branches: [wip/verify-w3c-search-form]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  HOST: 98cf12b45124a964363520bda0d84a543a19094d
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: experiments/w3c-search
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.HOST }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Verify the host, renderer, and runtime
        run: |
          set -euo pipefail
          lab="$PWD/core/labs/demos/foafnaut"
          test "$(git -C core rev-parse HEAD)" = "$HOST"
          mkdir -p package web out
          gh release download "build-${HOST:0:12}-foafnaut-browser-linux-x86_64" -R "$GITHUB_REPOSITORY" \
            -D package -p foafnaut-browser-linux-x86_64.tar.gz
          archive=package/foafnaut-browser-linux-x86_64.tar.gz
          echo "923339230618fd52361e0d54c4e6eaf6a28a68eb2badb33d41bcb78628e269e3  $archive" | sha256sum -c -
          tar -xzf "$archive" -C package
          browser=$(find "$PWD/package" -type f -name foafnaut -print -quit)
          directory=$(dirname "$browser")
          (cd "$directory" && sha256sum -c SHA256SUMS)
          jq -e --arg sha "$HOST" '.commitFull==$sha' "$directory/BUILD-INFO.json"
          engine=$(find "$directory" -name libweb-render.so -type f -print -quit)
          test -s "$engine"
          gh release download "build-${HOST:0:12}-foafnaut-web" -R "$GITHUB_REPOSITORY" -D web -p foafnaut-web.tar.gz -p build-info.json
          expected=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' web/build-info.json)
          echo "$expected  web/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf web/foafnaut-web.tar.gz -C web docs/web/hub/html-webgpu/runtime
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/web"
          cp "$directory/libnative-window.so" "$lab/.build/native/"
          echo "LAB=$lab" >> "$GITHUB_ENV"
          echo "DENO_BIN=$(command -v deno)" >> "$GITHUB_ENV"
          echo "NATIVE_LIB=$engine" >> "$GITHUB_ENV"
          echo "OBSERVE=$PWD/experiments/w3c-search/observe.ts" >> "$GITHUB_ENV"
          sha256sum "$archive" web/foafnaut-web.tar.gz "$engine" "$lab/run_html.ts" > out/inputs.sha256
          deno check --no-config --no-npm experiments/w3c-search/observe.ts
          deno run --no-config --no-npm --unstable-ffi -A experiments/w3c-search/height.ts "$engine" |
            tee out/form-height.jsonl
      - name: Type and submit through the native window
        env:
          SDL_VIDEODRIVER: x11
          DENO_WEBGPU_BACKEND: vulkan
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool python3-pil python3-xlib
          export VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$VK_DRIVER_FILES"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/browser-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          cat > "$RUNNER_TEMP/host" <<'BASH'
          #!/bin/bash
          exec "$DENO_BIN" run --no-check --no-config --no-npm --node-modules-dir=none             --unstable-webgpu --unstable-ffi -A --preload "$OBSERVE" "$LAB/run_html.ts"             --follow-links --log-all --native-engine "$NATIVE_LIB" "$@"
          BASH
          chmod +x "$RUNNER_TEMP/host"
          failed=0
          for mode in enter button; do
            xvfb-run -a -s '-screen 0 1440x1000x24' /usr/bin/python3 experiments/w3c-search/probe.py \
              "$LAB/check-linux-browser.py" "$RUNNER_TEMP/host" "$PWD/out/$mode" "$mode" || failed=1
            jq . "out/$mode/receipt.json" >> "$GITHUB_STEP_SUMMARY" || failed=1
            jq -e '.status=="handoff-pass" and .typedPixelsObserved' "out/$mode/receipt.json" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3c-search-released-native
          path: out/
          retention-days: 7
