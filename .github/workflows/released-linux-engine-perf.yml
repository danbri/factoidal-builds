name: Compare released Linux engines on the same BBC replay
on:
  push:
    branches: [wip/released-linux-engine-perf]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  PARENT: c575c92a7e13a07ea09fc2f00fc01f62f7ca1c5c
  CANDIDATE: 76f307e51e441e60b6cc5191b66475e2c8dbc918
  RUNTIME: 98cf12b45124a964363520bda0d84a543a19094d
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: experiments/released-linux-engine-perf/instrument.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CANDIDATE }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            tests/browser-wpt
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: 45638334817
          name: bbc-uk-replay-with-photos
          path: capture
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Download and check the exact released engine files
        run: |
          set -euo pipefail
          mkdir -p out engines/parent engines/candidate runtime
          test "$(git -C core rev-parse HEAD)" = "$CANDIDATE"
          for entry in "parent:$PARENT" "candidate:$CANDIDATE" "runtime:$RUNTIME"; do
            role=${entry%%:*}
            sha=${entry#*:}
            set=foafnaut-linux-x86_64
            dest="engines/$role"
            if [[ $role == runtime ]]; then set=foafnaut-web; dest=runtime; fi
            gh release download "build-${sha:0:12}-$set" -R "$GITHUB_REPOSITORY" -D "$dest" -p build-info.json -p "$set.tar.gz"
            expected=$(jq -er --arg sha "$sha" --arg asset "$set.tar.gz"               'select(.source_commit == $sha) | .artifacts[$asset].sha256' "$dest/build-info.json")
            echo "$expected  $dest/$set.tar.gz" | sha256sum -c -
            if [[ $role == runtime ]]; then
              tar -xzf "$dest/$set.tar.gz" -C "$dest" docs/web/hub/html-webgpu/runtime
            else
              mkdir "$dest/$set"
              tar -xzf "$dest/$set.tar.gz" -C "$dest/$set"
              engine_sha=$(jq -er --arg asset "$set.tar.gz" '.artifacts[$asset].files["foafnaut/libweb-render.so"].sha256' "$dest/build-info.json")
              echo "$engine_sha  $dest/$set/foafnaut/libweb-render.so" | sha256sum -c -
            fi
          done
          test -s engines/parent/foafnaut-linux-x86_64/foafnaut/libweb-render.so
          test -s engines/candidate/foafnaut-linux-x86_64/foafnaut/libweb-render.so
          cp engines/parent/build-info.json out/parent-build-info.json
          cp engines/candidate/build-info.json out/candidate-build-info.json
          cp runtime/build-info.json out/runtime-build-info.json
          lscpu > out/runner.txt
          echo "32c6aa1ba6934f8db893078034c1efaf8e203416b9c6aa2783a0c65e7d86bf46  capture/bbc-uk-with-photos.zip" | sha256sum -c -
      - name: Alternate the engine on identical inputs and host code
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH REFTEST_TIME REFTEST_DUMP_DIR
          export REALPAGES_REPLAY="$PWD/capture/bbc-uk-with-photos.zip"
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          renderer=core/tests/browser-wpt/reftest-render.ts
          python3 experiments/released-linux-engine-perf/instrument.py "$renderer"
          deno check --no-config --no-npm "$renderer"
          sha256sum engines/*/foafnaut-linux-x86_64/foafnaut/libweb-render.so "$renderer" "$REALPAGES_REPLAY" > out/inputs.sha256
          printf '%s\n' '{"url":"https://www.bbc.co.uk/news","file":"bbc.png","width":1280,"height":735}' > out/jobs.jsonl
          sample=0
          for role in parent candidate candidate parent; do
            sample=$((sample+1))
            dir="out/$sample-$role"
            mkdir "$dir"
            deno run --no-config --no-npm --unstable-ffi -A --preload "$lab/realpages/replay.ts" "$renderer"               --native-engine "$PWD/engines/$role/foafnaut-linux-x86_64/foafnaut/libweb-render.so"               --list out/jobs.jsonl --out "$dir" 2>&1 | tee "$dir/run.log"
            grep '^__done ' "$dir/run.log" | cut -d' ' -f2- | jq -e 'select(.status=="ok")' > "$dir/result.json"
            grep '^{"type":"everyday-phase"' "$dir/run.log" | jq -e               'select(.times.cpuFrame>0 and .methods["prepare.scriptSession"].calls>0)' > "$dir/phase.json"
            jq -c --arg role "$role" '{role,times,session:.methods["prepare.scriptSession"]}'               "$dir/phase.json" >> "$GITHUB_STEP_SUMMARY"
          done
          jq -s -e 'length == 4 and all(.[]; .status == "ok" and (.sha | type == "string"))' out/*/result.json
          jq -s 'map({sha,scriptCost})' out/*/result.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-linux-engine-perf
          path: out/
          retention-days: 7
