name: Profile BBC and Wikipedia layout on macOS
on:
  push:
    branches: [wip/everyday-layout-profile]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: 51f7ce6af97b0d17aa7b7f337238b6835d81c8fe
  SET: foafnaut-engine-darwin-arm64
  WEB: build-4618bea0c1ac-foafnaut-web
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            core-diagnostics
            third_party/realpages/en.wikipedia.org
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 51f7ce6af97b0d17aa7b7f337238b6835d81c8fe
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts/noto-sans
      - uses: actions/download-artifact@v4
        with:
          run-id: 45408439387
          name: bbc-home-snapshot
          path: snapshots
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Set up the pinned engine and desktop host
        run: |
          set -euo pipefail
          mkdir -p engines/base engines/web
          gh release download "build-${CORE:0:12}-$SET" -R "$GITHUB_REPOSITORY" -p "$SET.tar.gz" -p build-info.json -D engines/base
          jq -e --arg sha "$CORE" '.source_commit == $sha' engines/base/build-info.json >/dev/null
          expected=$(jq -er --arg archive "$SET.tar.gz" '.artifacts[$archive].sha256' engines/base/build-info.json)
          echo "$expected  engines/base/$SET.tar.gz" | shasum -a 256 -c -
          tar -xzf "engines/base/$SET.tar.gz" -C engines/base
          library=$(find "$PWD/engines/base" -name libweb-render.dylib -print | head -1)
          window=$(find "$PWD/engines/base" -name libnative-window.dylib -print | head -1)
          test -s "$library"
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz -D engines/web
          tar -xzf engines/web/foafnaut-web.tar.gz -C engines/web docs/web/hub/html-webgpu/runtime
          lab=core/labs/demos/foafnaut
          bash "$lab/realpages/setup-host.sh" "$PWD/$lab" "$PWD/engines/web" "$window"
          echo "ENGINE=$library" >> "$GITHUB_ENV"
      - name: Sample native layout on frozen BBC and Wikipedia documents
        run: |
          set -euo pipefail
          mkdir -p out "$RUNNER_TEMP/documents"
          shasum -a 256 "$ENGINE" > out/engine.sha256
          python3 core-diagnostics/layout-input.py snapshots/bbc.co.uk/desktop-bbc-news-20261124.zip "$RUNNER_TEMP/documents/bbc"
          python3 core-diagnostics/layout-input.py third_party/realpages/en.wikipedia.org/m-us-20261115.zip "$RUNNER_TEMP/documents/wiki"
          font="$PWD/core/third_party/fonts/noto-sans/NotoSans-Regular.ttf"
          test -s "$font"
          for page in bbc wiki; do
            for family in bitmap noto; do
              args=()
              [[ $family != noto ]] || args=("$font")
              out="$PWD/out/$page-$family"
              deno run --no-config --allow-read --allow-ffi --unstable-ffi core-diagnostics/layout-profile.ts "$ENGINE" "$RUNNER_TEMP/documents/$page" sample "${args[@]}" > "$out.ndjson" 2>"$out.probe.log" &
              pid=$!
              for i in {1..30}; do
                grep -q '"stage":"layout"' "$out.ndjson" && break
                sleep 0.10
              done
              sudo sample "$pid" 5 2 -file "$out.sample" >"$out.sampler.log" 2>&1 || true
              wait "$pid"
              test -s "$out.sample"
              grep -q 'Call graph:' "$out.sample"
            done
          done
      - name: Measure desktop BBC first frame and scroll independently
        if: always() && env.ENGINE != ''
        run: |
          set -euo pipefail
          lab=core/labs/demos/foafnaut
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          deno run -A "$lab/realpages/survey.ts" --platform macos --host "$PWD/$lab" --engine "$ENGINE" \
            --snapshots "$PWD/snapshots" --only desktop-bbc-news,desktop-bbc-news-noscripts --timeout 105 --retries 0 \
            --watch 8 --chrome "$chrome" --out "$PWD/out/desktop" --release "$CORE"
          jq -r '.pages[]|[.id,.state,.first_frame_s,.first_layout_ms,.scroll_latency_p95_ms,.layout_similarity]|@tsv' out/desktop/summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-layout-profile
          path: out/
          retention-days: 7
