name: Verify the archived W3C contents line fits
on:
  push:
    branches: [wip/w3c-flexbox-nowrap-replay]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            release-tests/w3c-nowrap-geometry.ts
            third_party/realpages/w3.org/w3c-flexbox-20261115.zip
          sparse-checkout-cone-mode: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Get the exact two engines
        run: |
          set -euo pipefail
          for item in 45501736982:baseline 45505222970:candidate; do
            run=${item%:*}
            arm=${item#*:}
            for i in $(seq 1 150); do
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n branch-engine -D "$arm"; then break; fi
              if [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)" == completed ]]; then
                echo "Missing exact engine from $run" >&2; exit 1
              fi
              sleep 20
            done
            test -s "$arm/libweb-render.so"
          done
      - name: Measure the archived contents line in Noto Sans
        run: |
          set -euo pipefail
          mkdir out
          snapshot=third_party/realpages/w3.org/w3c-flexbox-20261115.zip
          echo "a01b88268d16a2ab95bdf0a2edf8f56bf5634bf3534fa793d13263166f38d206  $snapshot" | sha256sum -c -
          curl -fsSL https://raw.githubusercontent.com/danbri/factoidal-core/046e86e2b5b831f922d433a678378bf003e8de1a/third_party/fonts/noto-sans/NotoSans-Regular.ttf -o noto.ttf
          echo "f3961a9cde016d41a4879aecda1474d3a36d6bf54fa0e4643de029cc2248b0e8  noto.ttf" | sha256sum -c -
          sha256sum "$snapshot" noto.ttf baseline/libweb-render.so candidate/libweb-render.so > out/inputs.sha256
          unzip -p "$snapshot" bodies/0001 > release-tests/page.html
          unzip -p "$snapshot" bodies/0009 > release-tests/dark.css
          unzip -p "$snapshot" bodies/0021 > release-tests/base.css
          for arm in baseline candidate; do
            deno run --no-config --allow-ffi --allow-read=release-tests,noto.ttf release-tests/w3c-nowrap-geometry.ts \
              "$PWD/$arm/libweb-render.so" "" original noto.ttf > "out/$arm.jsonl"
          done
          python3 - <<'PYTHON' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          def result(arm):
              rows = [json.loads(line) for line in Path("out", arm + ".jsonl").read_text().splitlines()]
              assert rows[0]["font"]["family"] == "Noto Sans", rows[0]
              assert not rows[-1]["errors"], rows[-1]["errors"]
              geom = {item["selector"]: item["pos"] for item in rows[-1]["rows"]}
              span = next(box for selector, box in geom.items() if selector.endswith(" .content"))
              sidebar = geom["#toc"]
              return dict(span=span, sidebar=sidebar, overflow=span[0] + span[2] - sidebar[0] - sidebar[2])

          a, b = result("baseline"), result("candidate")
          print(json.dumps(dict(baseline=a, candidate=b), indent=2))
          assert a["overflow"] > 20, a
          assert b["overflow"] <= 0, b
          assert a["sidebar"] == b["sidebar"], (a,b)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3c-flexbox-nowrap-replay
          path: out/
          retention-days: 7
