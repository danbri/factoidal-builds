name: Compare archived Wikipedia wordmark and layout reductions
on:
  push:
    branches: [wip/712-wikipedia-logo]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: e4445d14752cc3ec75da7bf2fc1797263d02efbf
  CANDIDATE: f9b92f87724b938a1dcee54ca35d4ca97361a39f
  NATIVE_RUN: "45641641030"
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Wait for the exact SVG definition candidate
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN"
          gh api "$endpoint/jobs" --jq '.jobs[].name' | grep -Fx "Build libweb-render.so from $CANDIDATE"
          until gh api "$endpoint/artifacts" --jq '.artifacts[] | select(.expired|not) | .name' | grep -Fx branch-engine; do
            if [[ "$(gh api "$endpoint" --jq .status)" == completed ]]; then exit 1; fi
            sleep 30
          done
  pixels:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: experiments/wikipedia-logo/probe.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CORE }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            tests/browser-wpt
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.NATIVE_RUN }}
          name: branch-engine
          path: engine
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 45416936347
          name: desktop-wikipedia-www-snapshot
          path: capture
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Verify engine and runtime and compare synthetic fixtures
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          test "$(git -C core rev-parse HEAD)" = "$CORE"
          test -s engine/libweb-render.so
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat engine/lean-toolchain)"
          export LD_LIBRARY_PATH="$(ls -d "$HOME/.elan/toolchains/"*/lib/lean | head -1)"
          archive=$(find capture -name desktop-wikipedia-www-20261124.zip -print -quit)
          echo "d83f40080b38f311dc42c3be0a74b6d948e8c0bf0e9da1b7b94d76d02556721c  $archive" | sha256sum -c -
          mkdir out runtime
          tag="build-${CORE:0:12}-foafnaut-web"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D runtime -p build-info.json -p foafnaut-web.tar.gz
          expected=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' runtime/build-info.json)
          echo "$expected  runtime/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf runtime/foafnaut-web.tar.gz -C runtime docs/web/hub/html-webgpu/runtime
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          sudo apt-get update
          sudo apt-get install -y python3-pil
          google-chrome --version > out/chrome.txt
          sha256sum engine/libweb-render.so experiments/wikipedia-logo/probe.py > out/inputs.sha256
          REQUIRE_LOGO_INK=1 /usr/bin/python3 experiments/wikipedia-logo/probe.py | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wikipedia-logo-candidate-pixels
          path: out/
          retention-days: 7
