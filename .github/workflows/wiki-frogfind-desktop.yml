name: Verify desktop Wikipedia and FrogFind replays
on:
  push:
    branches: [wip/wiki-frogfind-desktop]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: ce375e25bbf6c2b6c1f8a577be9e99c47b1a0fd8
  SET: foafnaut-engine-darwin-arm64
  WEB: build-4618bea0c1ac-foafnaut-web
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ce375e25bbf6c2b6c1f8a577be9e99c47b1a0fd8
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: 45417573057
          name: desktop-frogfind-snapshot
          path: snapshots
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 45416936347
          name: desktop-wikipedia-www-snapshot
          path: snapshots
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: f43b16f155d62addbe5c54380818f0653859d238
          path: survey
          persist-credentials: false
          sparse-checkout: labs/demos/foafnaut/realpages
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Set up the pinned engine and desktop host
        run: |
          set -euo pipefail
          mkdir -p engines/base engines/web
          gh release download "build-${CORE:0:12}-$SET" -R "$GITHUB_REPOSITORY" -p "$SET.tar.gz" -p build-info.json -D engines/base
          jq -e --arg sha "$CORE" '.source_commit == $sha' engines/base/build-info.json >/dev/null
          expected=$(jq -er --arg archive "$SET.tar.gz" '.artifacts[$archive].sha256' engines/base/build-info.json)
          echo "$expected  engines/base/$SET.tar.gz" | shasum -a 256 -c -
          tar -xzf "engines/base/$SET.tar.gz" -C engines/base
          library=$(find "$PWD/engines/base" -name libweb-render.dylib -print | head -1)
          window=$(find "$PWD/engines/base" -name libnative-window.dylib -print | head -1)
          test -s "$library"
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz -D engines/web
          tar -xzf engines/web/foafnaut-web.tar.gz -C engines/web docs/web/hub/html-webgpu/runtime
          lab=core/labs/demos/foafnaut
          bash "$lab/realpages/setup-host.sh" "$PWD/$lab" "$PWD/engines/web" "$window"
          echo "ENGINE=$library" >> "$GITHUB_ENV"
      - name: Replay the same pages as the Chrome references and check live navigation
        run: |
          set -euo pipefail
          lab=core/labs/demos/foafnaut
          survey=survey/labs/demos/foafnaut/realpages
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          mkdir -p out
          shasum -a 256 "$ENGINE" snapshots/*/*.zip > out/inputs.sha256
          deno run -A "$survey/survey.ts" --platform macos --host "$PWD/$lab" --engine "$ENGINE" \
            --only desktop-wikipedia-www,desktop-frogfind --snapshots "$PWD/snapshots" --timeout 100 --retries 0 \
            --watch 8 --out "$PWD/out/offline" --release "$CORE"
          deno run -A "$survey/survey.ts" --platform macos --host "$PWD/$lab" --engine "$ENGINE" \
            --only desktop-wikipedia-www,desktop-frogfind --timeout 100 --retries 0 \
            --watch 8 --chrome "$chrome" --out "$PWD/out/live" --release "$CORE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-frogfind-desktop
          path: out/
          retention-days: 7
