name: Check automatic block ratio widths with pinned WPT reftests
on:
  push:
    branches: [checks/1096-block-ratio-reftests]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  BASELINE_RUN: "45692334484"
  CANDIDATE_RUN: "45708903743"
  BASELINE: 5d4a4366293994bb3aa268c6c68882560e773aba
  CANDIDATE: 054a5169f5056011b7f31de0212fdad0a13954d0
  WPT: 94e2796a2aa59a232e4e43e8a218ae967e9fac77
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Verify that both source revisions have their exact engine artifacts
        run: |
          set -euo pipefail
          candidate="repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN"
          baseline="repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN"
          tag="build-${BASELINE:0:12}-foafnaut-linux-x86_64"
          until gh api "$candidate/jobs" --jq '.jobs[].name' | grep -Fx "Build libweb-render.so from $CANDIDATE"; do
            if [[ "$(gh api "$candidate" --jq .status)" == completed ]]; then exit 1; fi
            sleep 20
          done
          until gh api "$candidate/artifacts" --jq '.artifacts[] | select(.expired|not) | .name' | grep -Fx branch-engine; do
            if [[ "$(gh api "$candidate" --jq .status)" == completed ]]; then exit 1; fi
            sleep 30
          done
          until gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name' | grep -Fx foafnaut-linux-x86_64.tar.gz; do
            if [[ "$(gh api "$baseline" --jq .status)" == completed ]]; then exit 1; fi
            sleep 30
          done
          # The sole source change between the released engine and the candidate parent is the WPT runner.
          test "$(gh api "repos/danbri/factoidal-core/git/commits/$CANDIDATE" --jq '.parents[0].sha')" = "acfa63c86cf9c273cb3bbffcdab86b1cc52874cc"
  reftest:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: experiments/block-ratio-width/cases.txt
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CANDIDATE }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            tests/browser-wpt
            third_party/fonts
      - uses: actions/checkout@v4
        with:
          repository: web-platform-tests/wpt
          ref: ${{ env.WPT }}
          path: wpt
          persist-credentials: false
          sparse-checkout: |
            css/css-sizing
            css/reference
            fonts
            images
            common
            resources
            svg
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CANDIDATE_RUN }}
          name: branch-engine
          path: engines/candidate
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Record input identities and run the same pixel checks twice
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          test "$(git -C core rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C wpt rev-parse HEAD)" = "$WPT"
          mkdir -p runtime out engines/baseline
          tag="build-${BASELINE:0:12}-foafnaut-linux-x86_64"
          archive=foafnaut-linux-x86_64.tar.gz
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D engines/baseline -p build-info.json -p "$archive"
          expected=$(jq -er --arg base "$BASELINE" --arg name "$archive" 'select(.source_commit==$base) | .artifacts[$name].sha256' engines/baseline/build-info.json)
          echo "$expected  engines/baseline/$archive" | sha256sum -c -
          tar -xzf "engines/baseline/$archive" -C engines/baseline
          mv engines/baseline/foafnaut/libweb-render.so engines/baseline/libweb-render.so
          tag="build-e4445d14752c-foafnaut-web"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D runtime -p build-info.json -p foafnaut-web.tar.gz
          expected=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' runtime/build-info.json)
          echo "$expected  runtime/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf runtime/foafnaut-web.tar.gz -C runtime docs/web/hub/html-webgpu/runtime
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          curl --compressed --retry 3 -fsSL "https://wpt.fyi/api/manifest?sha=$WPT" -o MANIFEST.json
          sha256sum engines/*/libweb-render.so MANIFEST.json experiments/block-ratio-width/cases.txt > out/inputs.sha256
          only=$(paste -sd, experiments/block-ratio-width/cases.txt)
          for role in baseline candidate; do
            python3 core/tests/browser-wpt/wpt-reftests.py run --manifest MANIFEST.json --wpt-root "$PWD/wpt" \
              --native-engine "$PWD/engines/$role/libweb-render.so" --prefix css/css-sizing/aspect-ratio/ --jobs 2 --no-pictures --only "$only" --out "$PWD/out/$role"
          done
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import collections
          import json
          from pathlib import Path

          def load(role):
              result = json.loads(Path(f"out/{role}/results.json").read_text())
              assert result["valid"], (role, result.get("invalidReason"))
              return {entry["test"]: entry["status"] for entry in result["tests"]}

          cases=set(Path("experiments/block-ratio-width/cases.txt").read_text().splitlines())
          baseline,candidate=load("baseline"),load("candidate")
          assert baseline.keys() == candidate.keys() == cases, (len(baseline),len(candidate),len(cases))
          changes={case:[baseline[case],candidate[case]] for case in sorted(cases) if baseline[case] != candidate[case]}
          Path("out/changes.json").write_text(json.dumps(changes,indent=2)+"\n")
          print(f"Same-pin comparison of {len(cases)} block aspect-ratio reftests.")
          print(collections.Counter(map(tuple,changes.values())))
          print(f"Pixel matches: {sum(x == 'PASS' for x in baseline.values())} → {sum(x == 'PASS' for x in candidate.values())} / {len(cases)}")
          for name, (before, after) in changes.items():
              print(f"- `{name}` {before} → {after}")
          if any(before == "PASS" and after != "PASS" for before, after in changes.values()):
              raise SystemExit("One or more passing parent reftests regressed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block-ratio-width-wpt
          path: out/
          retention-days: 7
