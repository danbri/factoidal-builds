name: Compare zero font size in two pinned Linux native engines
on:
  push:
    branches: [codex/zero-font-native-replay]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: 76f307e51e441e60b6cc5191b66475e2c8dbc918
  WPT: 94e2796a2aa59a232e4e43e8a218ae967e9fac77
  RUNTIME: 98cf12b45124a964363520bda0d84a543a19094d
  CANDIDATE: e05848eb8b6be6d99fd8458ce10fca13cdafdc2e
  CANDIDATE_RUN: '45698004376'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/zero-font-native-replay
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CORE }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            tests/browser-wpt
            labs/demos/foafnaut
            formal/lean4/lean-toolchain
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: actions/checkout@v4
        with:
          repository: web-platform-tests/wpt
          ref: ${{ env.WPT }}
          path: wpt
          persist-credentials: false
          sparse-checkout: |
            css/css-fonts
            resources
      - name: Verify the exact native candidate build
        run: |
          set -euo pipefail
          mkdir -p out
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs" |
            jq -e --arg sha "$CANDIDATE" '.jobs[] | select(.name == ("Build libweb-render.so from " + $sha) and .conclusion == "success") | {id,name,status,conclusion}' > out/candidate-build.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/artifacts" |
            jq -e '.artifacts[] | select(.name == "branch-engine" and .expired == false) | {id,digest,size_in_bytes,workflow_run}' > out/candidate-artifact.json
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CANDIDATE_RUN }}
          name: branch-engine
          path: candidate
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Extract checksum-verified released engine and runtime
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE"
          test "$(git -C wpt rev-parse HEAD)" = "$WPT"
          mkdir -p out engine runtime
          for record in "engine:$CORE:foafnaut-linux-x86_64" "runtime:$RUNTIME:foafnaut-web"; do
            dest=${record%%:*}
            pair=${record#*:}
            sha=${pair%%:*}
            set=${pair#*:}
            gh release download "build-${sha:0:12}-$set" -R "$GITHUB_REPOSITORY" -D "$dest" -p build-info.json -p "$set.tar.gz"
            expected=$(jq -er --arg sha "$sha" --arg file "$set.tar.gz" \
              'select(.source_commit == $sha) | .artifacts[$file].sha256' "$dest/build-info.json")
            echo "$expected  $dest/$set.tar.gz" | sha256sum -c -
            if [[ $dest == runtime ]]; then
              tar -xzf "$dest/$set.tar.gz" -C "$dest" docs/web/hub/html-webgpu/runtime
            else
              tar -xzf "$dest/$set.tar.gz" -C "$dest"
            fi
          done
          engine="$PWD/engine/foafnaut/libweb-render.so"
          sum=$(jq -er '.artifacts["foafnaut-linux-x86_64.tar.gz"].files["foafnaut/libweb-render.so"].sha256' engine/build-info.json)
          echo "$sum  $engine" | sha256sum -c -
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
      - name: Compare zero-width text and the spacing controls
        run: |
          set -euo pipefail
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          toolchain=$(cat candidate/lean-toolchain)
          test "$toolchain" = "$(tr -d ' \n' < core/formal/lean4/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          export LD_LIBRARY_PATH="$("$HOME/.elan/bin/elan" run "$toolchain" lean --print-prefix)/lib/lean"
          test -d "$LD_LIBRARY_PATH"
          fixture="$PWD/experiments/zero-font-native-replay"
          wpt="$PWD/wpt/css/css-fonts"
          curl -fsSL --retry 3 -o out/wpt-3-ref.html "https://raw.githubusercontent.com/web-platform-tests/wpt/$WPT/css/reference/ref-filled-green-200px-square.html"
          echo '6a0bda50a3e358356fcf79c51b8de1d2d62ceebca0fdfe857f782b7cf4c7391e  out/wpt-3-ref.html' | sha256sum -c -
          python3 - "$fixture" "$wpt" "$PWD/out/wpt-3-ref.html" > out/jobs.jsonl <<'PY'
          import json,sys
          generated, wpt, third_ref = sys.argv[1:]
          files = [
              ("pair", f"{generated}/font-pair.html"), ("pair-ref", f"{generated}/font-pair-ref.html"),
              ("positive", f"{generated}/font-pair-positive.html"), ("spaced", f"{generated}/font-pair-spaced.html"),
              ("wpt-1", f"{wpt}/font-size-zero-1.html"), ("wpt-1-ref", f"{wpt}/font-size-zero-1-ref.html"),
              ("wpt-2", f"{wpt}/font-size-zero-2.html"), ("wpt-2-ref", f"{wpt}/font-size-zero-2-ref.html"),
              ("wpt-3", f"{wpt}/font-size-zero-3.html"), ("wpt-3-ref", third_ref),
          ]
          for name, path in files:
              print(json.dumps({"url":"file://" + path,"file":name + ".png","width":800,"height":600}))
          PY
          sha256sum engine/foafnaut/libweb-render.so candidate/libweb-render.so "$fixture"/*.html "$wpt"/font-size-zero-{1,2,3}*.html > out/inputs.sha256
          renderer=core/tests/browser-wpt/reftest-render.ts
          for engine in baseline candidate; do
            if [[ $engine == baseline ]]; then lib="$PWD/engine/foafnaut/libweb-render.so"
            else lib="$PWD/candidate/libweb-render.so"; fi
            deno run --no-check --no-config --no-npm --unstable-ffi -A "$renderer" \
              --native-engine "$lib" --list out/jobs.jsonl --out "out/$engine" | tee "out/$engine.log"
          done
          python3 "$fixture/report-font.py" | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-font-native-replay
          path: out/
          retention-days: 7
