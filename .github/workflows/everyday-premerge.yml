name: Everyday page changes premerge
on:
  push:
    branches: [wip/everyday-premerge]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {change: measured Wasm budget, sha: 1dd937c6e92e7abf7df5a77d26d2e72b5b6ea06b, base: f43b16f155d62addbe5c54380818f0653859d238}
    name: Premerge ${{ matrix.change }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ matrix.sha }}
          fetch-depth: 8
          persist-credentials: false
          path: core
          sparse-checkout: |
            tools
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Install the pinned WABT
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wabt.tar.gz"
          curl --retry 3 -fsSL -o "$archive" https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz
          echo "84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/wabt"
          tar -xzf "$archive" -C "$RUNNER_TEMP/wabt"
          wat=$(find "$RUNNER_TEMP/wabt" -name wat2wasm -print -quit)
          test -x "$wat"
          dirname "$wat" >> "$GITHUB_PATH"
      - name: Run repository premerge checks
        working-directory: core
        env:
          BASE: ${{ matrix.base }}
          EXPECTED: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) = "$EXPECTED" ]]
          git cat-file -e "$BASE^{commit}"
          bash tools/premerge.sh --changed --base "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
