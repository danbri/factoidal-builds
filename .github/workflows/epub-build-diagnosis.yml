name: EPUB release gate diagnosis
on:
  push:
    branches: [wip/epub-lean-check]
    paths: [.github/workflows/epub-build-diagnosis.yml]
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: d929fac2a46828067f71c8cf2657dfd3830f785f
          persist-credentials: false
      - name: Check the release registry with the proposed patch
        run: |
          curl -fsSL https://raw.githubusercontent.com/danbri/factoidal-core/2bfa6ac199e0782116c66985a56d584ad486990d/foundation/entrypoints.toml -o foundation/entrypoints.toml
          bash tests/dataflow/run.sh
