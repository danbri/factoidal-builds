name: EPUB native build diagnosis
on:
  push:
    branches: [wip/epub-lean-check]
    paths: [.github/workflows/epub-build-diagnosis.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 44952862905
          name: build-log
          github-token: ${{ github.token }}
          path: log
      - run: |
          grep -n -i -E 'error|failed|refused|killed|no space' log/build.log | tail -35 || true
          tail -35 log/build.log
