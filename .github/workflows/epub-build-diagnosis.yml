name: EPUB release gate diagnosis
on:
  push:
    branches: [wip/epub-lean-check]
    paths: [.github/workflows/epub-build-diagnosis.yml]
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 7192fb7c3f2839789bc462adb765625c5981044e
          persist-credentials: false
      - name: Check the merged release entry-point registry
        run: python3 -I tools/entrypoint-gate.py --root .
