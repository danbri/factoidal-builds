name: Raster background position paired reftests
on:
  push:
    branches: [wip/paired-raster-bg-position]
    paths: [.github/workflows/raster-bg-position-pixels.yml]
permissions:
  actions: read
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      WPT: 4b26db8978f6024d3184ca483d74afbc354b35de
      WEB_TAG: build-ef1710ff226d-foafnaut-web
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: f8c13cf7450105f736be219a5e26a170a2710165
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub
            third_party/fonts
            tests/browser-wpt
            formal/lean4/lean-toolchain
          sparse-checkout-cone-mode: false
      - name: Wait for the two exact native engine builds
        shell: bash
        run: |
          set -euo pipefail
          for pair in 45068248543:3abafe8e49518b313f197d721088e95090d4fda5 45069093254:f8c13cf7450105f736be219a5e26a170a2710165; do
            run=${pair%%:*}
            sha=${pair#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[].name' |
              grep -Fx "Build libweb-render.so from $sha"
            until gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx branch-engine; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status || true)
              if [[ $status == completed ]]; then
                echo "::error::Native build run $run ended without a branch-engine artifact."
                exit 1
              fi
              sleep 30
            done
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 45068248543
          name: branch-engine
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 45069093254
          name: branch-engine
          github-token: ${{ github.token }}
          path: candidate
      - id: pins
        run: echo "deno=v$(sed -n 's/^DENO_VERSION=//p' core/labs/demos/foafnaut/toolchain-versions.env)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.pins.outputs.deno }}
      - name: Install the renderer runtime and pinned WPT inputs
        shell: bash
        run: |
          set -euo pipefail
          tc=$(tr -d '[:space:]' < core/formal/lean4/lean-toolchain)
          for role in baseline candidate; do
            test "$tc" = "$(cat "$role/lean-toolchain")"
          done
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          echo "LD_LIBRARY_PATH=$(ELAN_TOOLCHAIN="$tc" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean" >> "$GITHUB_ENV"
          gh release download "$WEB_TAG" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz
          echo 'cb7ef521b7ec41ae27375afba8d7056f75295498419a9f5f976e08323b7353d5  foafnaut-web.tar.gz' | sha256sum -c -
          mkdir -p web
          tar -xzf foafnaut-web.tar.gz -C web docs/web/hub/html-webgpu/runtime
          runtime=web/docs/web/hub/html-webgpu/runtime
          host=core/labs/demos/foafnaut/.build
          mkdir -p "$host/native-html/runtime" "$host/engines"
          cp "$runtime"/web-render.{mjs,wasm} "$host/native-html/runtime/"
          cp "$runtime"/render-plan.{mjs,wasm} "$host/engines/"
          curl --compressed --retry 3 -fsSL "https://wpt.fyi/api/manifest?sha=$WPT" -o MANIFEST.json
      - uses: actions/checkout@v4
        with:
          repository: web-platform-tests/wpt
          ref: 4b26db8978f6024d3184ca483d74afbc354b35de
          path: wpt
          persist-credentials: false
          sparse-checkout: |
            css/css-backgrounds
            css/CSS2/backgrounds
            css/CSS2/reference
            css/CSS2/support
            css/support
            css/reference
            common
            fonts
            images
      - name: Compare pinned WPT and the local positioning fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > names.txt
          import json
          import struct
          import zlib
          from pathlib import Path

          manifest = Path("MANIFEST.json")
          data = json.loads(manifest.read_text())
          css = data["items"]["reftest"]["css"]
          paths = [("CSS2/backgrounds", css["CSS2"]["backgrounds"]),
                   ("css-backgrounds", css["css-backgrounds"])]
          names = [f"/css/{directory}/{name}" for directory, cases in paths
                   for name, item in cases.items() if isinstance(item, list)
                   and name.startswith("background-position-")
                   and "-applies-to-" not in name and "-ref." not in name]
          assert len(names) >= 10, names

          folder = Path("wpt/css/foafnaut-regressions")
          folder.mkdir(parents=True, exist_ok=True)
          def png_chunk(kind, payload):
              return (struct.pack(">I", len(payload)) + kind + payload +
                      struct.pack(">I", zlib.crc32(kind + payload)))
          (folder / "green.png").write_bytes(
              bytes.fromhex("89504e470d0a1a0a") +
              png_chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0)) +
              png_chunk(b"IDAT", zlib.compress(bytes([0, 0, 128, 0, 255]))) +
              png_chunk(b"IEND", b""))
          (folder / "raster-position.html").write_text("""<!doctype html>
          <style>
          body {margin:0}
          div {width:100px;height:40px;background:red url(green.png) no-repeat 0 0 / 20px 8px}
          #a {background-position:right 10px bottom 5px}
          #b {background-position:50% 25%}
          #c {--p: right 10px bottom 5px; background-position:var(--p); background-position-x:25%}
          </style><div id=a></div><div id=b></div><div id=c></div>""")
          (folder / "raster-position-ref.html").write_text("""<!doctype html>
          <style>
          body {margin:0}
          div {position:relative;width:100px;height:40px;background:red}
          i {position:absolute;width:20px;height:8px;background:green}
          #a {left:70px;top:27px}
          #b {left:40px;top:8px}
          #c {left:20px;top:27px}
          </style><div><i id=a></i></div><div><i id=b></i></div><div><i id=c></i></div>""")
          local = "/css/foafnaut-regressions/raster-position.html"
          css["foafnaut-regressions"] = {
              "raster-position.html": ["local", [None, [
                  ["/css/foafnaut-regressions/raster-position-ref.html", "=="]
              ], {}]]
          }
          manifest.write_text(json.dumps(data))
          print(",".join(sorted(names + [local])))
          PY
          names=$(cat names.txt)
          for role in baseline candidate; do
            python3 core/tests/browser-wpt/wpt-reftests.py run --manifest MANIFEST.json \
              --wpt-root "$PWD/wpt" --native-engine "$PWD/$role/libweb-render.so" --prefix css/ --jobs 2 \
              --only "$names" --out "$PWD/out/$role"
          done
          python3 - "$names" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          names = set(sys.argv[1].split(","))
          results = {}
          for role in ("baseline", "candidate"):
              d = json.loads(Path(f"out/{role}/results.json").read_text())
              assert d["valid"] and {row["test"] for row in d["tests"]} == names
              results[role] = {row["test"]: row["status"] for row in d["tests"]}
              print(role, dict(Counter(results[role].values())))
          local = "/css/foafnaut-regressions/raster-position.html"
          assert results["baseline"][local] == "FAIL", results["baseline"][local]
          assert results["candidate"][local] == "PASS", results["candidate"][local]
          for name in sorted(names):
              old, new = (results[role][name] for role in ("baseline", "candidate"))
              if old != new:
                  print(name, old, new)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raster-bg-position-pixels
          path: out/
          retention-days: 14

