name: Compare embedded SVG paint on the exact candidate
on:
  push:
    branches: [wip/svg-author-cascade-fixtures]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: core-diagnostics
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Verify the 13 expected computed paints in Chrome
        run: |
          set -euo pipefail
          mkdir -p out
          python3 core-diagnostics/cascade-cases.py "$RUNNER_TEMP/fixtures"
          cd "$RUNNER_TEMP/fixtures"
          for page in *.html; do
            google-chrome --headless=new --no-sandbox --no-first-run --disable-gpu \
              --user-data-dir="$RUNNER_TEMP/chrome-cascade" --virtual-time-budget=1500 \
              --dump-dom "file://$PWD/$page" > "$GITHUB_WORKSPACE/out/$page"
          done
          python3 - "$GITHUB_WORKSPACE/out" <<'PYTHON' | tee "$GITHUB_WORKSPACE/out/chrome-results.json"
          import json, pathlib, re, sys
          output = pathlib.Path(sys.argv[1])
          results = []
          for case in json.loads(pathlib.Path("cases.json").read_text()):
              actual = re.search(r'<output id="result">rgb\((\d+), (\d+), (\d+)\)</output>',
                                 (output / (case["id"] + ".html")).read_text())
              assert actual, case["id"]
              pixel = "#" + "".join(f"{int(value):02x}" for value in actual.groups())
              results.append({**case, "actual": pixel})
          print(json.dumps(results, indent=2))
          assert all(r["actual"] == r["want"] for r in results)
          PYTHON
      - name: Wait for the exact candidate's native build
        env:
          GH_TOKEN: ${{ github.token }}
          CORE: 663a60a7309b479dc04515a538475643c9bcff23
          BUILD: '45436424819'
        run: |
          set -euo pipefail
          run="repos/$GITHUB_REPOSITORY/actions/runs/$BUILD"
          gh api "$run/jobs" --jq '.jobs[].name' | grep -Fx "Build libweb-render.so from $CORE"
          until gh api "$run/artifacts" --jq '.artifacts[].name' | grep -Fx branch-engine; do
            if [[ "$(gh api "$run" --jq '.status')" == completed ]]; then
              echo "::error::Exact candidate build did not produce an engine"
              exit 1
            fi
            sleep 30
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: '45436424819'
          name: branch-engine
          path: engine
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: '45430099580'
          name: desktop-govuk-snapshot
          path: snapshot
          github-token: ${{ github.token }}
      - name: Check all fixture paints and the archived GOV.UK markup
        run: |
          set -euo pipefail
          mkdir -p out
          toolchain=$(cat engine/lean-toolchain)
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          export LD_LIBRARY_PATH="$(ELAN_TOOLCHAIN="$toolchain" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean"
          lib="$PWD/engine/libweb-render.so"
          zip=$(find "$PWD/snapshot" -name 'desktop-govuk-*.zip' -print -quit)
          sha256sum "$lib" "$zip" > out/inputs.sha256
          python3 - "$zip" "$RUNNER_TEMP/govuk.html" <<'PYTHON'
          import json, pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as snapshot:
              manifest = json.loads(snapshot.read("manifest.json"))
              url = manifest["reference"]["document_url"]
              assert url == "https://www.gov.uk/"
              source = next(e for e in manifest["entries"] if e["url"] == url)
              assert source["source"] == "chrome"
              pathlib.Path(sys.argv[2]).write_bytes(snapshot.read(source["body"]))
          PYTHON
          deno run --no-config --allow-read --allow-ffi --unstable-ffi core-diagnostics/govuk-icon-probe.ts \
            "$lib" "$RUNNER_TEMP/govuk.html" | tee out/govuk-icon.ndjson
          jq -se '
            any(.[]; .label == "external-descendant" and .sky > 1500 and .black > 50 and .black < 300)
            and any(.[]; .label == "no-css" and .sky == 0 and .black > 1500)
          ' out/govuk-icon.ndjson
          deno run --no-config --allow-read --allow-ffi --unstable-ffi core-diagnostics/cascade-native.ts \
            "$lib" "$RUNNER_TEMP/fixtures" require-pass | tee out/native-results.ndjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-svg-author-cascade
          path: out/
          retention-days: 7
