name: Measure pending-scroll priority on BBC and Wikipedia
on:
  push:
    branches: [wip/scroll-awaiting-band]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: 51f7ce6af97b0d17aa7b7f337238b6835d81c8fe
  SET: foafnaut-engine-darwin-arm64
  WEB: build-4618bea0c1ac-foafnaut-web
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: release-tests
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 4a49c914c4ed2c70479a55ddae8a0ffb2d487f93
          fetch-depth: 2
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: 45413803852
          name: bbc-home-matched-snapshot
          path: snapshots
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 45416936347
          name: desktop-wikipedia-www-snapshot
          path: snapshots
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Set up the pinned engine and desktop host
        run: |
          set -euo pipefail
          mkdir -p engines/base engines/web
          gh release download "build-${CORE:0:12}-$SET" -R "$GITHUB_REPOSITORY" -p "$SET.tar.gz" -p build-info.json -D engines/base
          jq -e --arg sha "$CORE" '.source_commit == $sha' engines/base/build-info.json >/dev/null
          expected=$(jq -er --arg archive "$SET.tar.gz" '.artifacts[$archive].sha256' engines/base/build-info.json)
          echo "$expected  engines/base/$SET.tar.gz" | shasum -a 256 -c -
          tar -xzf "engines/base/$SET.tar.gz" -C engines/base
          library=$(find "$PWD/engines/base" -name libweb-render.dylib -print | head -1)
          window=$(find "$PWD/engines/base" -name libnative-window.dylib -print | head -1)
          test -s "$library"
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz -D engines/web
          tar -xzf engines/web/foafnaut-web.tar.gz -C engines/web docs/web/hub/html-webgpu/runtime
          lab=core/labs/demos/foafnaut
          bash "$lab/realpages/setup-host.sh" "$PWD/$lab" "$PWD/engines/web" "$window"
          echo "ENGINE=$library" >> "$GITHUB_ENV"
      - name: Test the queue and replay three matched pages
        run: |
          set -euo pipefail
          lab="$PWD/core/labs/demos/foafnaut"
          deno test --no-config "$lab/native_html_queue_test.ts" "$lab/scroll_prefetch_test.ts"
          git -C core show 44f71d2e63f689635afcb1f4e0cbf7fc2142ddef:labs/demos/foafnaut/run_html.ts > "$lab/replay_baseline.ts"
          mkdir -p out
          shasum -a 256 "$ENGINE" "$lab/run_html.ts" "$lab/replay_baseline.ts" > out/inputs.sha256
          cp "$lab/run_html.ts" "$lab/replay_waiting.ts"
          python3 release-tests/scroll-waiting-edit.py "$lab/replay_waiting.ts"
          shasum -a 256 "$lab/replay_waiting.ts" >> out/inputs.sha256
          for case_id in bbc wiki; do
            case "$case_id" in
              bbc) file=desktop-bbc-news-20261124.zip; url=https://www.bbc.com/news; size=1280x800 ;;
              wiki) file=desktop-wikipedia-www-20261124.zip; url=https://en.wikipedia.org/wiki/World_Wide_Web; size=1280x800 ;;
            esac
            export REALPAGES_REPLAY="$(find "$PWD/snapshots" -name "$file" -print -quit)"
            test -s "$REALPAGES_REPLAY"
            shasum -a 256 "$REALPAGES_REPLAY" >> out/inputs.sha256
            for arm in baseline1 queued1 waiting1 waiting2 queued2 baseline2; do
              case "$arm" in
                baseline*) host="$lab/replay_baseline.ts" ;;
                queued*) host="$lab/run_html.ts" ;;
                waiting*) host="$lab/replay_waiting.ts" ;;
              esac
              deno run --no-check --no-config --no-npm --node-modules-dir=none --unstable-webgpu --unstable-ffi -A \
                --preload "$lab/realpages/replay.ts" "$host" \
                --native-engine "$ENGINE" --offscreen --offscreen-size "$size@1" --no-state \
                --be-liberal-in-what-we-accept --perf-summary --scroll-sweep --idle-checks-only \
                --url "$url" > "out/$case_id-$arm.log" 2>&1
              grep -q '"type":"native-html-perf-summary"' "out/$case_id-$arm.log"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-awaiting-band
          path: out/
          retention-days: 7
