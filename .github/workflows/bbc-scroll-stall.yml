name: Identify the BBC scroll prefetch gates
on:
  push:
    branches: [wip/bbc-scroll-gates]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: 51f7ce6af97b0d17aa7b7f337238b6835d81c8fe
  SET: foafnaut-engine-darwin-arm64
  WEB: build-4618bea0c1ac-foafnaut-web
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: release-tests
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 51f7ce6af97b0d17aa7b7f337238b6835d81c8fe
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: 45413803852
          name: bbc-home-matched-snapshot
          path: snapshots
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Set up the pinned engine and desktop host
        run: |
          set -euo pipefail
          mkdir -p engines/base engines/web
          gh release download "build-${CORE:0:12}-$SET" -R "$GITHUB_REPOSITORY" -p "$SET.tar.gz" -p build-info.json -D engines/base
          jq -e --arg sha "$CORE" '.source_commit == $sha' engines/base/build-info.json >/dev/null
          expected=$(jq -er --arg archive "$SET.tar.gz" '.artifacts[$archive].sha256' engines/base/build-info.json)
          echo "$expected  engines/base/$SET.tar.gz" | shasum -a 256 -c -
          tar -xzf "engines/base/$SET.tar.gz" -C engines/base
          library=$(find "$PWD/engines/base" -name libweb-render.dylib -print | head -1)
          window=$(find "$PWD/engines/base" -name libnative-window.dylib -print | head -1)
          test -s "$library"
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz -D engines/web
          tar -xzf engines/web/foafnaut-web.tar.gz -C engines/web docs/web/hub/html-webgpu/runtime
          lab=core/labs/demos/foafnaut
          bash "$lab/realpages/setup-host.sh" "$PWD/$lab" "$PWD/engines/web" "$window"
          echo "ENGINE=$library" >> "$GITHUB_ENV"
      - name: Trace the native scheduling gates across a scroll band
        run: |
          set -euo pipefail
          lab="$PWD/core/labs/demos/foafnaut"
          export REALPAGES_REPLAY="$PWD/snapshots/bbc.com/desktop-bbc-news-20261124.zip"
          test -s "$REALPAGES_REPLAY"
          mkdir -p out
          shasum -a 256 "$ENGINE" "$REALPAGES_REPLAY" "$lab/run_html.ts" > out/inputs.sha256
          python3 release-tests/scroll-gate-edit.py "$lab/run_html.ts"
          for arm in scripts-on scripts-off; do
            set --
            if [[ $arm == scripts-off ]]; then set -- --no-scripts; fi
            deno run --no-check --no-config --no-npm --node-modules-dir=none --unstable-webgpu --unstable-ffi -A \
              --preload "$lab/realpages/replay.ts" "$lab/run_html.ts" \
              --native-engine "$ENGINE" --offscreen --offscreen-size 1280x800@1 --no-state \
              --be-liberal-in-what-we-accept --perf-summary --scroll-sweep --idle-checks-only "$@" \
              --url https://www.bbc.com/news > "out/$arm.log" 2>&1
            grep -q '"type":"native-html-perf-summary"' "out/$arm.log"
            grep -E '"type":"native-html-(scroll-gate|scroll-diagnostic-frame|prefetch|scroll|frame)"' \
              "out/$arm.log" > "out/$arm.jsonl"
            grep -q '"type":"native-html-scroll-gate"' "out/$arm.jsonl"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbc-scroll-gates
          path: out/
          retention-days: 7
