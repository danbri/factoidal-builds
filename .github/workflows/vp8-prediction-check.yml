name: Compare VP8 keyframe predictions with libwebp
on:
  push:
    branches: [wip/vp8-prediction-check]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: core-diagnostics
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 7757db5a42a2965a00f7aaf598a389b38ac12a37
          path: core
          persist-credentials: false
          sparse-checkout: |
            formal/lean4/L4Factoidal/Codec/WebP.lean
            formal/lean4/L4Factoidal/Codec/VP8Tables.lean
            formal/lean4/L4Factoidal/Codec/VP8Control.lean
            formal/lean4/lean-toolchain
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 45413803852
          name: bbc-home-matched-snapshot
          path: capture
          github-token: ${{ github.token }}
      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat core/formal/lean4/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the reference WebP command
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp
      - name: Check theorems and re-read real WebP headers
        working-directory: core/formal/lean4
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out"
          tmp="$RUNNER_TEMP/webp-check"
          mkdir -p "$out" "$tmp/lib/L4Factoidal/Codec" "$tmp/photos"
          lean --version | tee "$out/lean-version.txt"
          lean -o "$tmp/lib/L4Factoidal/Codec/WebP.olean" L4Factoidal/Codec/WebP.lean | tee "$out/lean.txt"
          export LEAN_PATH="$tmp/lib"
          lean -o "$tmp/lib/L4Factoidal/Codec/VP8Tables.olean" L4Factoidal/Codec/VP8Tables.lean | tee -a "$out/lean.txt"
          lean -o "$tmp/lib/L4Factoidal/Codec/VP8Control.olean" L4Factoidal/Codec/VP8Control.lean | tee -a "$out/lean.txt"
          if grep -q sorryAx "$out/lean.txt"; then exit 1; fi
          cp "$GITHUB_WORKSPACE/core-diagnostics/WebPProbe.lean" "$tmp/WebPProbe.lean"
          snap=$(find "$GITHUB_WORKSPACE/capture" -name 'desktop-bbc-news-*.zip' -print -quit)
          sha256sum "$snap" > "$out/capture.sha256"
          python3 "$GITHUB_WORKSPACE/core-diagnostics/webp-probe.py" extract "$snap" "$tmp/photos" > "$out/expected.json"
          LEAN_PATH="$tmp/lib" lean --run "$tmp/WebPProbe.lean" "$tmp/photos"/*.webp | tee "$out/actual.tsv"
          python3 "$GITHUB_WORKSPACE/core-diagnostics/webp-probe.py" compare "$out/expected.json" "$out/actual.tsv"
      - name: Compare all BBC controls and a four-partition libvpx frame
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP/webp-check"
          command -v ffmpeg >/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -v error -f lavfi -i 'testsrc2=size=64x64:rate=1' -frames:v 1 -pix_fmt yuv420p \
            -c:v libvpx -slices 4 -f ivf -y "$temp/multiparts.ivf"
          python3 - "$temp" <<'PYTHON'
          from pathlib import Path
          import struct, sys
          scratch=Path(sys.argv[1])
          ivf=(scratch/"multiparts.ivf").read_bytes()
          assert ivf.startswith(b"DKIF") and ivf[8:12]==b"VP80"
          size=int.from_bytes(ivf[32:36],"little")
          frame=ivf[44:44+size]
          assert len(frame)==size
          riff=b"WEBPVP8 "+struct.pack("<I",size)+frame+bytes(size%2)
          good=b"RIFF"+struct.pack("<I",len(riff))+riff
          (scratch/"photos"/"multiparts.webp").write_bytes(good)
          table=20+10+(int.from_bytes(frame[:3],"little")>>5)
          bad=bytearray(good)
          bad[table:table+3]=bytes([255,255,255])
          (scratch/"bad.webp").write_bytes(bad)
          PYTHON
          webpinfo -bitstream_info "$temp/photos/multiparts.webp" | grep -E 'Total partitions: *4'
          export ELAN_TOOLCHAIN="$(cat core/formal/lean4/lean-toolchain)"
          export LEAN_PATH="$temp/lib"
          lean --run core-diagnostics/VP8ControlProbe.lean "$temp/photos"/*.webp | tee out/vp8-controls.jsonl
          python3 core-diagnostics/compare-vp8-control.py out/vp8-controls.jsonl
          if lean --run core-diagnostics/VP8ControlProbe.lean "$temp/bad.webp" > out/rejected.log 2>&1; then exit 1; fi
          grep -F "VP8 partition outside payload" out/rejected.log
      - name: Compare every probability and macroblock with libwebp 1.6.0
        shell: bash
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP/webp-check"
          export ELAN_TOOLCHAIN="$(cat core/formal/lean4/lean-toolchain)"
          export LEAN_PATH="$temp/lib"
          archive="$temp/libwebp-1.6.0.tar.gz"
          curl --retry 3 -fsSL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz -o "$archive"
          printf '%s  %s\n' e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564 "$archive" | sha256sum -c
          tar -xzf "$archive" -C "$temp"
          src="$temp/libwebp-1.6.0"
          patch --directory "$src" -p1 < core-diagnostics/vp8-reference-probe.patch
          cmake -S "$src" -B "$temp/reference" -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF > out/reference-config.txt
          cmake --build "$temp/reference" --target dwebp --parallel 2 > out/reference-build.txt
          python3 core-diagnostics/compare-vp8-prediction.py "$temp/reference/dwebp" \
            core-diagnostics/VP8PredictionProbe.lean "$temp/photos/"*.webp | tee out/prediction.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vp8-prediction-check
          path: out/
          retention-days: 7
