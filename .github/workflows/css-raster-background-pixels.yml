name: Raster CSS background paired reftests
on:
  push:
    branches: [wip/paired-css-raster-backgrounds]
    paths: [.github/workflows/css-raster-background-pixels.yml]
permissions:
  actions: read
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      WPT: 4b26db8978f6024d3184ca483d74afbc354b35de
      WEB_TAG: build-ef1710ff226d-foafnaut-web
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: eb61c0676443f3a43e0eb92251544ddcfd04efa2
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub
            third_party/fonts
            tests/browser-wpt
            formal/lean4/lean-toolchain
          sparse-checkout-cone-mode: false
      - name: Wait for the two exact native engine builds
        shell: bash
        run: |
          set -euo pipefail
          for pair in 45052839017:b9f6c92bd022d7659752e0962aa34f7b4b53ccd1 45056293883:eb61c0676443f3a43e0eb92251544ddcfd04efa2; do
            run=${pair%%:*}
            sha=${pair#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[].name' |
              grep -Fx "Build libweb-render.so from $sha"
            until gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx branch-engine; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status || true)
              if [[ $status == completed ]]; then
                echo "::error::Native build run $run ended without a branch-engine artifact."
                exit 1
              fi
              sleep 30
            done
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 45052839017
          name: branch-engine
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 45056293883
          name: branch-engine
          github-token: ${{ github.token }}
          path: candidate
      - id: pins
        run: echo "deno=v$(sed -n 's/^DENO_VERSION=//p' core/labs/demos/foafnaut/toolchain-versions.env)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.pins.outputs.deno }}
      - name: Install the renderer runtime and pinned WPT inputs
        shell: bash
        run: |
          set -euo pipefail
          tc=$(tr -d '[:space:]' < core/formal/lean4/lean-toolchain)
          for role in baseline candidate; do
            test "$tc" = "$(cat "$role/lean-toolchain")"
          done
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          echo "LD_LIBRARY_PATH=$(ELAN_TOOLCHAIN="$tc" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean" >> "$GITHUB_ENV"
          gh release download "$WEB_TAG" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz
          echo 'cb7ef521b7ec41ae27375afba8d7056f75295498419a9f5f976e08323b7353d5  foafnaut-web.tar.gz' | sha256sum -c -
          mkdir -p web
          tar -xzf foafnaut-web.tar.gz -C web docs/web/hub/html-webgpu/runtime
          runtime=web/docs/web/hub/html-webgpu/runtime
          host=core/labs/demos/foafnaut/.build
          mkdir -p "$host/native-html/runtime" "$host/engines"
          cp "$runtime"/web-render.{mjs,wasm} "$host/native-html/runtime/"
          cp "$runtime"/render-plan.{mjs,wasm} "$host/engines/"
          suite=css/css-backgrounds
          for file in background-image-001.html background-image-002.html background-image-cover-zoomed-1.html \
              reference/background-image-001-ref.html reference/background-image-cover-zoomed-1-ref.html \
              support/green.png support/red.png support/40px-wide-20px-tall-green-rect.png; do
            mkdir -p "wpt/$suite/$(dirname "$file")"
            curl --retry 3 -fsSL "https://raw.githubusercontent.com/web-platform-tests/wpt/$WPT/$suite/$file" -o "wpt/$suite/$file"
          done
          curl --compressed --retry 3 -fsSL "https://wpt.fyi/api/manifest?sha=$WPT" -o MANIFEST.json
      - name: Add an imported stylesheet origin regression
        shell: bash
        run: |
          set -euo pipefail
          testdir=wpt/css/foafnaut-regressions
          mkdir -p "$testdir/assets/nested" "$testdir/assets/pixels"
          cp wpt/css/css-backgrounds/support/green.png "$testdir/assets/pixels/"
          cat > "$testdir/background-import-url.html" <<'HTML'
          <!doctype html>
          <link rel="stylesheet" href="assets/main.css">
          <style>body { margin: 0 }</style>
          <div class="tile" id="test"></div>
          HTML
          cat > "$testdir/assets/main.css" <<'CSS'
          @import url("nested/card.css");
          .tile { width: 100px; height: 100px; background-image: url(unused.png); }
          CSS
          cat > "$testdir/assets/nested/card.css" <<'CSS'
          #test { background-color: red; background-image: url(../pixels/green.png); }
          CSS
          cat > "$testdir/background-import-url-ref.html" <<'HTML'
          <!doctype html>
          <style>body { margin: 0 }</style>
          <img src="assets/pixels/green.png">
          HTML
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("MANIFEST.json")
          data = json.loads(manifest.read_text())
          css = data["items"]["reftest"]["css"]
          css["foafnaut-regressions"] = {
              "background-import-url.html": ["local", [None, [
                  ["/css/foafnaut-regressions/background-import-url-ref.html", "=="]
              ], {}]]
          }
          manifest.write_text(json.dumps(data))
          PY
      - name: Compare both engines on WPT and the local stylesheet case
        shell: bash
        run: |
          set -euo pipefail
          prefix=/css/css-backgrounds/background-image
          for role in baseline candidate; do
            python3 core/tests/browser-wpt/wpt-reftests.py run --manifest MANIFEST.json \
              --wpt-root "$PWD/wpt" --native-engine "$PWD/$role/libweb-render.so" --prefix css/ --jobs 1 \
              --only "$prefix-001.html,$prefix-002.html,$prefix-cover-zoomed-1.html,/css/foafnaut-regressions/background-import-url.html" --out "$PWD/out/$role"
          done
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          names = {f"/css/css-backgrounds/background-image-{case}.html" for case in ("001", "002", "cover-zoomed-1")}
          local_name = "/css/foafnaut-regressions/background-import-url.html"
          names.add(local_name)
          for role in ("baseline", "candidate"):
              data = json.loads(Path(f"out/{role}/results.json").read_text())
              assert data["valid"] and {row["test"] for row in data["tests"]} == names
              for row in data["tests"]:
                  edge, = row["edges"]
                  if row["test"] == local_name:
                      assert edge["to"] == "/css/foafnaut-regressions/background-import-url-ref.html"
                      assert row["status"] == ("PASS" if role == "candidate" else "FAIL"), row
                  else:
                      assert edge["to"].startswith("/css/css-backgrounds/reference/background-image-")
                  assert row["status"] in ("PASS", "FAIL")
                  print(role, row["test"], row["status"], edge.get("totalPixels"), edge.get("maxDifference"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-raster-background-pixels
          path: out/
          retention-days: 14
