name: CSS background sizing paired reftests
on:
  push:
    branches: [wip/paired-css-raster-backgrounds]
    paths: [.github/workflows/css-raster-background-pixels.yml]
permissions:
  actions: read
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      WPT: 4b26db8978f6024d3184ca483d74afbc354b35de
      WEB_TAG: build-ef1710ff226d-foafnaut-web
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ec6e9c49a46b88db36fec3f65205dab6bcee6f28
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub
            third_party/fonts
            tests/browser-wpt
            formal/lean4/lean-toolchain
          sparse-checkout-cone-mode: false
      - name: Wait for the two exact native engine builds
        shell: bash
        run: |
          set -euo pipefail
          for pair in 45062203910:a512ab9189130fda9043a40cc5d277ffa94801c7 45063563433:ec6e9c49a46b88db36fec3f65205dab6bcee6f28; do
            run=${pair%%:*}
            sha=${pair#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[].name' |
              grep -Fx "Build libweb-render.so from $sha"
            until gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx branch-engine; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status || true)
              if [[ $status == completed ]]; then
                echo "::error::Native build run $run ended without a branch-engine artifact."
                exit 1
              fi
              sleep 30
            done
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 45062203910
          name: branch-engine
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 45063563433
          name: branch-engine
          github-token: ${{ github.token }}
          path: candidate
      - id: pins
        run: echo "deno=v$(sed -n 's/^DENO_VERSION=//p' core/labs/demos/foafnaut/toolchain-versions.env)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.pins.outputs.deno }}
      - name: Install the renderer runtime and pinned WPT inputs
        shell: bash
        run: |
          set -euo pipefail
          tc=$(tr -d '[:space:]' < core/formal/lean4/lean-toolchain)
          for role in baseline candidate; do
            test "$tc" = "$(cat "$role/lean-toolchain")"
          done
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          echo "LD_LIBRARY_PATH=$(ELAN_TOOLCHAIN="$tc" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean" >> "$GITHUB_ENV"
          gh release download "$WEB_TAG" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz
          echo 'cb7ef521b7ec41ae27375afba8d7056f75295498419a9f5f976e08323b7353d5  foafnaut-web.tar.gz' | sha256sum -c -
          mkdir -p web
          tar -xzf foafnaut-web.tar.gz -C web docs/web/hub/html-webgpu/runtime
          runtime=web/docs/web/hub/html-webgpu/runtime
          host=core/labs/demos/foafnaut/.build
          mkdir -p "$host/native-html/runtime" "$host/engines"
          cp "$runtime"/web-render.{mjs,wasm} "$host/native-html/runtime/"
          cp "$runtime"/render-plan.{mjs,wasm} "$host/engines/"
          curl --compressed --retry 3 -fsSL "https://wpt.fyi/api/manifest?sha=$WPT" -o MANIFEST.json
      - uses: actions/checkout@v4
        with:
          repository: web-platform-tests/wpt
          ref: 4b26db8978f6024d3184ca483d74afbc354b35de
          path: wpt
          persist-credentials: false
          sparse-checkout: |
            css/css-backgrounds
            css/support
            css/reference
            common
            fonts
            images
      - name: Exercise shorthand size and no-repeat on a 1px image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wpt/css/foafnaut-regressions
          cat > wpt/css/foafnaut-regressions/background-size-repeat.html <<'HTML'
          <!doctype html>
          <style>
          body { margin: 0 }
          div { width: 80px; height: 30px; background: url(green.png) 0 0 / 50% 10px no-repeat }
          </style>
          <div></div>
          HTML
          cat > wpt/css/foafnaut-regressions/background-size-repeat-ref.html <<'HTML'
          <!doctype html>
          <style>body { margin: 0 } div { width: 40px; height: 10px; background: lime }</style>
          <div></div>
          HTML
          python3 - <<'PY'
          import json
          import struct
          import zlib
          from pathlib import Path

          def png_chunk(kind, contents):
              body = kind + contents
              return struct.pack(">I", len(contents)) + body + struct.pack(">I", zlib.crc32(body))

          fixture = Path("wpt/css/foafnaut-regressions")
          (fixture / "green.png").write_bytes(
              b"\x89PNG\r\n\x1a\n"
              + png_chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0))
              + png_chunk(b"IDAT", zlib.compress(bytes((0, 0, 255, 0, 255))))
              + png_chunk(b"IEND", b"")
          )
          manifest = Path("MANIFEST.json")
          data = json.loads(manifest.read_text())
          data["items"]["reftest"]["css"]["foafnaut-regressions"] = {
              "background-size-repeat.html": ["local", [None, [
                  ["/css/foafnaut-regressions/background-size-repeat-ref.html", "=="]
              ], {}]]
          }
          manifest.write_text(json.dumps(data))
          PY
      - name: Compare both engines on pinned background size and repeat cases
        shell: bash
        run: |
          set -euo pipefail
          local_case=/css/foafnaut-regressions/background-size-repeat.html
          names="$local_case"
          dir=/css/css-backgrounds
          for size in 002 005 006 008 009 011 012 013 014 015 016 017 018 019 020; do
            names="$names,$dir/background-size-$size.html"
          done
          for repeat in no-repeat repeat-x repeat-y; do
            names="$names,$dir/background-repeat/background-repeat-$repeat.xht"
          done
          for role in baseline candidate; do
            python3 core/tests/browser-wpt/wpt-reftests.py run --manifest MANIFEST.json \
              --wpt-root "$PWD/wpt" --native-engine "$PWD/$role/libweb-render.so" --prefix css/ --jobs 1 \
              --only "$names" --out "$PWD/out/$role"
          done
          python3 - "$names" "$local_case" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path

          names, local_case = set(sys.argv[1].split(",")), sys.argv[2]
          for role in ("baseline", "candidate"):
              data = json.loads(Path(f"out/{role}/results.json").read_text())
              assert data["valid"] and {row["test"] for row in data["tests"]} == names
              for row in data["tests"]:
                  print(role, row["test"], row["status"], [edge.get("totalPixels") for edge in row["edges"]])
                  assert row["status"] in ("PASS", "FAIL"), row
                  if row["test"] == local_case:
                      assert row["status"] == ("PASS" if role == "candidate" else "FAIL"), row
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-background-sizing-pixels
          path: out/
          retention-days: 14
