name: Diagnose the extra space before the W3C homepage header
on:
  push:
    branches: [wip/w3c-header-geometry]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: core-diagnostics
      - uses: actions/download-artifact@v4
        with:
          run-id: 45414537051
          name: branch-engine
          path: engine
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 45403312317
          name: w3c-home-snapshots
          path: snapshots
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Install the engine's recorded Lean runtime
        run: |
          set -euo pipefail
          tc=$(cat engine/lean-toolchain)
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          echo "LD_LIBRARY_PATH=$(ELAN_TOOLCHAIN="$tc" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean" >> "$GITHUB_ENV"
      - name: Record the header geometry under isolated fixture changes
        run: |
          set -euo pipefail
          mkdir -p out
          sha256sum engine/libweb-render.so snapshots/w3.org/*.zip > out/inputs.sha256
          for shape in narrow wide; do
            width=480; [[ $shape == narrow ]] || width=1440
            zip=$(find "$PWD/snapshots" -name "w3c-home-$shape-*.zip" -print -quit)
            python3 core-diagnostics/w3c-gap-fixture.py "$zip" > "$RUNNER_TEMP/fixture.json"
            deno run --no-config --allow-read --allow-ffi --unstable-ffi core-diagnostics/w3c-gap.ts \
              "$PWD/engine/libweb-render.so" "$RUNNER_TEMP/fixture.json" "$width" | tee "out/$shape.ndjson"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3c-header-geometry
          path: out
          retention-days: 7
