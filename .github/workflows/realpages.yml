name: Real-page survey

# Everyday pages (Wikipedia desktop and mobile skins, BBC News, GitHub, MDN, a blog, Hacker
# News, a W3C spec, and core's Spinal Tap showcase page) on each Foafnaut release: core's
# labs/demos/foafnaut/realpages/survey.ts with its page list and budgets, compared with the
# survey of the release before (compare.ts). Each platform runs it twice:
#
#   offline (the gate): every page answered from its snapshot in third_party/realpages of this
#     repository (public pages vendored as fair use for testing, with provenance; README there),
#     replayed into the host by core's realpages/replay.ts: the same bytes each time, so a
#     change is the engine's. The reference picture is the one taken with the snapshot.
#   live (information): the pages as they are now, and headless Chrome now; the network and
#     the pages drift, so nothing here fails the job.
#
#   macOS (macos-15, GPU): run_html.ts of the release's own core commit off screen on the
#     release's libweb-render.dylib: verdict, first frame, first layout, GPU per frame, idle
#     CPU over 15 s, longest script turn, scroll latency p50/p95, peak RSS, liberal-mode
#     skips, crash or exit, and the layout similarity against Chrome's picture.
#   Linux (ubuntu-latest, no window): Textnaut on the self-contained libweb-render.so: load,
#     layout, rows, links, wall, CPU, peak RSS, crash or exit.
#
# Results: the job summary (tables with changes against the previous release, regressions);
# release assets realpages-<platform>-<mode>.json/.md; one row per page in
# realpages/trend.csv on the branch wpt-scores (with realpages/runs/<run_id>/ and
# latest-/previous-<platform>-<mode>.json). Pictures and logs: the artifact
# realpages-<platform>-pictures, kept 7 days.
# A crash or exit of the browser in the offline survey fails the job; every other
# regression is a warning: a verdict worse than before, a number over 1.5 times the previous
# one (above a noise floor), layout similarity down by more than 0.05. A live page that cannot
# be fetched is "unreachable".
#
# Starts: after each run of build.yml (foafnaut-darwin-arm64), foafnaut-macos.yml
# (foafnaut-engine-darwin-arm64) and foafnaut-linux.yml (foafnaut-linux-x86_64) that
# published a release; by hand:
#   gh workflow run realpages.yml -R danbri/factoidal-builds -f release=build-<12 hex>-foafnaut-darwin-arm64
#   gh workflow run realpages.yml -R danbri/factoidal-builds -f release=build-<12 hex>-foafnaut-linux-x86_64 -f survey_ref=<core branch>
# One survey at a time for each platform; a waiting one is replaced by a newer one.
#
# Cost: macOS about 40-60 min (15 pages, two runs each, offline and live); Linux about 10 min.

on:
  # TEMPORARY branch test (remove before merge): the survey of the two releases of the brief.
  push:
    branches: [wip/realpages-ci]
    paths: ['.github/workflows/realpages.yml', 'release-tests/realpages.py']
  workflow_run:
    workflows: ['Build Factoidal from factoidal-core', 'Foafnaut macOS engine', 'Foafnaut Linux engine']
    types: [completed]
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag(s), comma list (build-<12 hex>-foafnaut-darwin-arm64, -foafnaut-engine-darwin-arm64, -foafnaut-linux-x86_64); empty: the newest of each platform'
        required: false
        default: ''
      platforms:
        description: 'With no release: macos, linux or both'
        required: false
        default: 'macos,linux'
      survey_ref:
        description: 'factoidal-core ref of the survey tools (realpages/)'
        required: false
        default: 'main'
      only:
        description: 'Page ids to survey, comma list (empty: all)'
        required: false
        default: ''
      record:
        description: 'Record on the results branch and as release assets'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: realpages-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'Foafnaut Linux engine' && 'linux' || 'macos') || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CORE_REPO: danbri/factoidal-core

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
      any: ${{ steps.r.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CREATED: ${{ github.event.workflow_run.created_at }}
          RELEASE: ${{ github.event_name == 'push' && 'build-cc73af028afe-foafnaut-darwin-arm64,build-6efc9cffbee3-foafnaut-linux-x86_64' || inputs.release }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 release-tests/realpages.py resolve --event "$EVENT" --workflow "${WORKFLOW:-}" --conclusion "${CONCLUSION:-}" \
            --run-created "${CREATED:-}" --release "${RELEASE:-}" --platforms "${PLATFORMS:-macos,linux}"

  survey:
    name: Survey ${{ matrix.platform }} ${{ matrix.tag }}
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
      # The host: the release's own commit (run_html.ts and Textnaut must match the engine).
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ matrix.core_commit }}
          path: host
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      # The survey tools: survey_ref (default main), so a survey of an older release uses today's rules.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ github.event_name == 'push' && 'wip/realpages-ci' || inputs.survey_ref || 'main' }}
          path: tools
          sparse-checkout: |
            labs/demos/foafnaut/realpages
      - name: Pins
        id: pins
        run: |
          echo "deno=v$(grep -E '^DENO_VERSION=' host/labs/demos/foafnaut/toolchain-versions.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "tools=$(git -C tools rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.pins.outputs.deno }}
      - name: The release's engine and the host's Wasm modules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          SET: ${{ matrix.set }}
          WEB: ${{ matrix.web_tag }}
        run: |
          set -euo pipefail
          R=$RUNNER_TEMP/rel; mkdir -p "$R/eng" "$R/web"
          gh release download "$TAG" -R "${{ github.repository }}" -p "$SET.tar.gz" -p build-info.json -D "$R"
          tar -xzf "$R/$SET.tar.gz" -C "$R/eng"
          gh release download "$WEB" -R "${{ github.repository }}" -p foafnaut-web.tar.gz -D "$R"
          tar -xzf "$R/foafnaut-web.tar.gz" -C "$R/web" docs/web/hub/html-webgpu/runtime
          LIB=$(find "$R/eng" -name 'libweb-render.dylib' -o -name 'libweb-render.so' | head -1)
          [ -n "$LIB" ] || { echo "::error::$TAG has no engine library"; exit 1; }
          WINDOW=$(find "$R/eng" -name 'libnative-window.dylib' | head -1)
          bash tools/labs/demos/foafnaut/realpages/setup-host.sh "$PWD/host/labs/demos/foafnaut" "$R/web" "$WINDOW"
          echo "LIB=$LIB" >> "$GITHUB_ENV"
          { echo "Engine: \`$TAG\` (\`$(basename "$LIB")\`, sha256 $(shasum -a 256 "$LIB" | cut -c1-16)); host: core \`${{ matrix.core_commit }}\`; Wasm modules: \`$WEB\`; survey tools: core \`${{ steps.pins.outputs.tools }}\`"
            echo "Window library: ${WINDOW:+from the release}${WINDOW:-built from native_window.m of the host}"; } >> "$GITHUB_STEP_SUMMARY"
      # Offline first (the gate): each page from its snapshot in third_party/realpages of this
      # repository, replayed into the host (core's realpages/replay.ts), so a change in the
      # numbers is the engine's. Then live (drift, information only): the pages as they are now.
      - name: Survey offline (snapshots; the gate) and live (information)
        id: survey
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
          ONLY: ${{ inputs.only }}
        run: |
          set -uo pipefail
          P=${{ matrix.platform }}; T=tools/labs/demos/foafnaut/realpages
          for MODE in offline live; do
            K=$P-$MODE; S=$RUNNER_TEMP/survey-$MODE
            python3 builds/release-tests/realpages.py previous --platform "$K" --release "$TAG" --out "$RUNNER_TEMP/previous-$K.json"
            ARGS=(--platform "$P" --engine "$LIB" --host "$PWD/host/labs/demos/foafnaut" --out "$S" --release "$TAG")
            [ -z "${ONLY:-}" ] || ARGS+=(--only "$ONLY")
            if [ "$MODE" = offline ]; then ARGS+=(--snapshots "$PWD/builds/third_party/realpages");
            elif [ "$P" = macos ]; then ARGS+=(--chrome "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"); fi
            deno run -A "$T/survey.ts" "${ARGS[@]}" || { echo "::error::the $MODE survey did not finish"; echo "rc_$MODE=9" >> "$GITHUB_OUTPUT"; continue; }
            cp "$S/summary.json" "$S/summary-$K.json"
            PREV=(); [ -f "$RUNNER_TEMP/previous-$K.json" ] && PREV=(--previous "$RUNNER_TEMP/previous-$K.json")
            INFO=(); [ "$MODE" = live ] && INFO=(--informational)
            deno run --allow-read --allow-write "$T/compare.ts" --current "$S/summary.json" ${PREV[@]+"${PREV[@]}"} ${INFO[@]+"${INFO[@]}"} \
              --markdown "$S/table-$K.md" --trend "$S/trend-$K.csv" --run-id "${{ github.run_id }}" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --annotate
            echo "rc_$MODE=$?" >> "$GITHUB_OUTPUT"
            { cat "$S/table-$K.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realpages-${{ matrix.platform }}-pictures
          path: |
            ${{ runner.temp }}/survey-*/shots/
            ${{ runner.temp }}/survey-*/logs/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realpages-${{ matrix.platform }}-summary
          path: |
            ${{ runner.temp }}/survey-*/summary-*.json
            ${{ runner.temp }}/survey-*/table-*.md
            ${{ runner.temp }}/survey-*/trend-*.csv
          if-no-files-found: ignore
      - name: A crash or exit of the browser on a snapshot fails the survey
        if: steps.survey.outputs.rc_offline != '0'
        run: |
          echo "::error::offline survey: a page crashed or the browser exited, or the survey did not finish (see the table)"
          exit 1

  record:
    needs: [resolve, survey]
    if: always() && needs.resolve.outputs.any == 'true' && (github.event_name == 'workflow_run' || inputs.record)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: realpages-*-summary
          path: ${{ runner.temp }}/rec
      - name: Results branch and release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 release-tests/realpages.py record --src "$RUNNER_TEMP/rec"
          for J in "$RUNNER_TEMP"/rec/*/*/summary-*.json "$RUNNER_TEMP"/rec/*/summary-*.json; do
            [ -f "$J" ] || continue
            P=$(basename "$J" .json); P=${P#summary-}
            TAG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release"])' "$J")
            U=$RUNNER_TEMP/up/$P; mkdir -p "$U"
            cp "$J" "$U/realpages-$P.json"; cp "$(dirname "$J")/table-$P.md" "$U/realpages-$P.md"
            gh release upload "$TAG" -R "${{ github.repository }}" "$U/realpages-$P.json" "$U/realpages-$P.md" --clobber
            echo "Recorded $P survey of $TAG: release assets realpages-$P.json, realpages-$P.md; branch wpt-scores realpages/" >> "$GITHUB_STEP_SUMMARY"
          done
