name: Visible CSS control character paired reftests
on:
  push:
    branches: [wip/paired-control-pictures]
    paths: [.github/workflows/control-picture-pixels.yml]
permissions:
  actions: read
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      WPT: 4b26db8978f6024d3184ca483d74afbc354b35de
      WEB_TAG: build-ef1710ff226d-foafnaut-web
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 7eb1586c308b5039cadad9f4ace16d7ac2f50f06
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub
            third_party/fonts
            tests/browser-wpt
            formal/lean4/lean-toolchain
          sparse-checkout-cone-mode: false
      - name: Wait for the two exact native engine builds
        shell: bash
        run: |
          set -euo pipefail
          for pair in 45052839017:b9f6c92bd022d7659752e0962aa34f7b4b53ccd1 45056066244:7eb1586c308b5039cadad9f4ace16d7ac2f50f06; do
            run=${pair%%:*}
            sha=${pair#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[].name' |
              grep -Fx "Build libweb-render.so from $sha"
            until gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx branch-engine; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status || true)
              if [[ $status == completed ]]; then
                echo "::error::Native build run $run ended without a branch-engine artifact."
                exit 1
              fi
              sleep 30
            done
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 45052839017
          name: branch-engine
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 45056066244
          name: branch-engine
          github-token: ${{ github.token }}
          path: candidate
      - id: pins
        run: echo "deno=v$(sed -n 's/^DENO_VERSION=//p' core/labs/demos/foafnaut/toolchain-versions.env)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.pins.outputs.deno }}
      - name: Install the renderer runtime and pinned WPT inputs
        shell: bash
        run: |
          set -euo pipefail
          tc=$(tr -d '[:space:]' < core/formal/lean4/lean-toolchain)
          for role in baseline candidate; do
            test "$tc" = "$(cat "$role/lean-toolchain")"
          done
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          echo "LD_LIBRARY_PATH=$(ELAN_TOOLCHAIN="$tc" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean" >> "$GITHUB_ENV"
          gh release download "$WEB_TAG" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz
          echo 'cb7ef521b7ec41ae27375afba8d7056f75295498419a9f5f976e08323b7353d5  foafnaut-web.tar.gz' | sha256sum -c -
          mkdir -p web
          tar -xzf foafnaut-web.tar.gz -C web docs/web/hub/html-webgpu/runtime
          runtime=web/docs/web/hub/html-webgpu/runtime
          host=core/labs/demos/foafnaut/.build
          mkdir -p "$host/native-html/runtime" "$host/engines"
          cp "$runtime"/web-render.{mjs,wasm} "$host/native-html/runtime/"
          cp "$runtime"/render-plan.{mjs,wasm} "$host/engines/"
          report=20261122T1812Z-wpt-reftest-css-linux-x86_64-gh45053563282a1
          curl --retry 3 -fsSL "https://raw.githubusercontent.com/danbri/factoidal-builds/wpt-scores/runs/$report/results.tsv.gz" -o results.tsv.gz
          older=20261122T1336Z-wpt-reftest-css-linux-x86_64-gh45028286099a1
          curl --retry 3 -fsSL "https://raw.githubusercontent.com/danbri/factoidal-builds/wpt-scores/runs/$older/results.tsv.gz" -o older.tsv.gz
          awk -F '\t' 'NR==FNR { prior[$1]=$2; next } /control-chars-/ && $1 ~ /white-space\/control-chars-[0-9A-F]+\.html$/ && prior[$1]=="PASS" && $2=="FAIL" && $8=="0" {print $1}' \
            <(gzip -dc older.tsv.gz) <(gzip -dc results.tsv.gz) > cases.txt
          test "$(wc -l < cases.txt)" -eq 60
          mkdir -p wpt/css/css-text/white-space/reference
          export WPT
          xargs -n 1 -P 10 sh -ec 'curl --retry 3 -fsSL "https://raw.githubusercontent.com/web-platform-tests/wpt/$WPT$1" -o "wpt$1"' _ < cases.txt
          ref=/css/css-text/white-space/reference/control-chars-000-ref.html
          curl --retry 3 -fsSL "https://raw.githubusercontent.com/web-platform-tests/wpt/$WPT$ref" -o "wpt$ref"
          curl --compressed --retry 3 -fsSL "https://wpt.fyi/api/manifest?sha=$WPT" -o MANIFEST.json
      - name: Measure all sixty zero-difference mismatch failures on both engines
        shell: bash
        run: |
          set -euo pipefail
          names=$(paste -sd , cases.txt)
          for role in baseline candidate; do
            python3 core/tests/browser-wpt/wpt-reftests.py run --manifest MANIFEST.json \
              --wpt-root "$PWD/wpt" --native-engine "$PWD/$role/libweb-render.so" --prefix css/ --jobs 2 \
              --only "$names" --out "$PWD/out/$role"
          done
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          names = set(Path("cases.txt").read_text().splitlines())
          for role in ("baseline", "candidate"):
              data = json.loads(Path(f"out/{role}/results.json").read_text())
              assert data["valid"] and {row["test"] for row in data["tests"]} == names
              passed = sum(row["status"] == "PASS" for row in data["tests"])
              print(f"{role}: {passed} of {len(names)} control-character reftests passed")
              for row in data["tests"]:
                  edge, = row["edges"]
                  assert edge["relation"] == "!="
                  assert edge["to"] == "/css/css-text/white-space/reference/control-chars-000-ref.html"
                  print(role, row["test"], row["status"], edge.get("totalPixels"), edge.get("maxDifference"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-picture-pixels
          path: out/
          retention-days: 14
