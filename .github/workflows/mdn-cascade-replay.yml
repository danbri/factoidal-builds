name: Measure MDN after indexing CSS property names
on:
  push:
    branches: [wip/css-applied-name-hash-replay]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  BASELINE_RUN: "45536215217"
  CANDIDATE_RUN: "45536215156"
  BASELINE: 856332018542401c736a133af05d1653fed525ee
  CANDIDATE: af97d7a27fb9b691524efe6c7af519e6fe752d91
  WEB: build-05ec0b29ca8a-foafnaut-web
jobs:
  wait-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Wait for both exact native engine artifacts
        run: |
          set -euo pipefail
          for run in "$BASELINE_RUN" "$CANDIDATE_RUN"; do
            endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$run"
            until gh api "$endpoint/artifacts" --jq '.artifacts[] | select(.expired|not) | .name' | grep -Fx branch-engine; do
              if [[ "$(gh api "$endpoint" --jq .status)" == completed ]]; then
                echo "No native engine artifact in $run" >&2
                exit 1
              fi
              sleep 30
            done
          done
  replay:
    needs: wait-engine
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            release-tests/mdn-cascade-replay.py
            third_party/realpages/developer.mozilla.org/mdn-display-20261115.zip
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 856332018542401c736a133af05d1653fed525ee
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BASELINE_RUN }}
          name: branch-engine
          path: engines/baseline
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CANDIDATE_RUN }}
          name: branch-engine
          path: engines/candidate
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 45464645924
          name: foafnaut-browser-linux-x86_64-candidate
          path: package
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Verify and install the pinned inputs
        run: |
          set -euo pipefail
          lab="$PWD/core/labs/demos/foafnaut"
          test "$(git -C core rev-parse HEAD)" = "$BASELINE"
          mkdir -p runtime out
          for pair in "$BASELINE_RUN:$BASELINE" "$CANDIDATE_RUN:$CANDIDATE"; do
            run=${pair%:*}
            sha=${pair#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[].name' |
              grep -Fx "Build libweb-render.so from $sha"
          done
          cmp engines/{baseline,candidate}/lean-toolchain
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat engines/baseline/lean-toolchain)"
          echo "LD_LIBRARY_PATH=$(ls -d "$HOME/.elan/toolchains/"*/lib/lean | head -1)" >> "$GITHUB_ENV"

          mapfile -t archives < <(find package -name '*.tar.gz')
          test "${#archives[@]}" -eq 1
          echo "76e2d22ed3e6a52ef8e79d347bae491a19f486799d7873644619645fb948ed4e  ${archives[0]}" | sha256sum -c -
          tar -xzf "${archives[0]}" -C package
          window=$(find "$PWD/package" -name libnative-window.so -print -quit)
          test -s "$window"
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -D runtime -p build-info.json -p foafnaut-web.tar.gz
          expected=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' runtime/build-info.json)
          echo "$expected  runtime/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf runtime/foafnaut-web.tar.gz -C runtime docs/web/hub/html-webgpu/runtime
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          cp "$window" "$lab/.build/native/libnative-window.so"

          dataset="$PWD/third_party/realpages"
          test "$(git hash-object "$dataset/developer.mozilla.org/mdn-display-20261115.zip")" = f08704fa2df02f35d8b1e9e05877e6c1016b4dbd
          sha256sum engines/*/libweb-render.so "$window" "$lab/run_html.ts" "$dataset/developer.mozilla.org/mdn-display-20261115.zip" > out/inputs.sha256
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers xvfb xauth time
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          dpkg-query -W mesa-vulkan-drivers libvulkan1 libsdl2-2.0-0 > out/driver-versions.txt
      - name: Replay scroll in baseline, candidate, candidate, baseline order
        env:
          DENO_WEBGPU_BACKEND: vulkan
          SDL_VIDEODRIVER: x11
          GALLIVM_PERF: nopt
          BENCHMARK_CASE: mdn
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1440x1100x24' python3 release-tests/mdn-cascade-replay.py \
            "$PWD/core/labs/demos/foafnaut" "$PWD/engines/baseline/libweb-render.so" \
            "$PWD/engines/candidate/libweb-render.so" "$PWD/third_party/realpages" "$PWD/out" |
            tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdn-cascade-replay
          path: |
            out/*.txt
            out/*.json
            out/*.sha256
            out/*/frame.*
          retention-days: 7
