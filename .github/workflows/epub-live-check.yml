name: Live Factoidal Hub EPUB smoke
on:
  push:
    branches: [wip/epub-lean-check]
    paths: [.github/workflows/epub-live-check.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 298f7b18723dd9cb3176863de5c7ba675137b9f4
          sparse-checkout: docs/web/hub/epub
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Wait for the matching runtime on the public Hub
        run: |
          for attempt in $(seq 1 48); do
            if curl -fsS "https://danbri.github.io/factoidal/web/hub/html-webgpu/runtime/manifest.json?epub-check=$GITHUB_RUN_ID-$attempt" \
                | jq -e '.kind == "release" and .sourceCommit == "298f7b18723dd9cb3176863de5c7ba675137b9f4"'; then exit 0; fi
            sleep 20
          done
          echo "The exact runtime was not deployed by Pages."
          exit 1
      - name: Open the public Hub and read a local EPUB
        run: |
          cat > check.cjs <<'JS'
          const {chromium} = require('playwright');
          const assert = require('node:assert/strict');
          const {readFileSync} = require('node:fs');
          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage({viewport:{width:390,height:760}});
              page.setDefaultTimeout(20000);
              const payloads = [];
              page.on('request', r => {if (r.method() !== 'GET') payloads.push(r.method());});
              await page.goto('https://danbri.github.io/factoidal/web/hub/epub/');
              await page.getByRole('button',{name:'Try a sample'}).click();
              const frame = page.frameLocator('#reader');
              await frame.getByRole('heading',{name:'Inside an EPUB'}).waitFor();
              await frame.getByRole('link',{name:'Continue to Reading order'}).click();
              await frame.getByRole('heading',{name:'Reading order'}).waitFor();
              await page.getByLabel('Choose an EPUB').setInputFiles({
                name:'local-check.epub',mimeType:'application/epub+zip',
                buffer:readFileSync('docs/web/hub/epub/sample.epub')
              });
              await frame.getByRole('heading',{name:'Inside an EPUB'}).waitFor();
              assert.equal(await page.locator('#status').textContent(),'');
              assert.deepEqual(payloads,[]);
              console.log('The public Hub opened a locally selected EPUB and followed its chapter link.');
            } finally {
              await browser.close();
            }
          })().catch(error => {console.error(error);process.exitCode=1});
          JS
          node check.cjs
