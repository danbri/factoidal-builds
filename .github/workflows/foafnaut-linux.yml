name: Foafnaut Linux engine

# Builds the native Foafnaut engine library for Linux (libweb-render.so) from one
# factoidal-core commit on main and publishes it as release
# build-<12 hex>-foafnaut-linux-<arch> (arch x86_64 on ubuntu-latest, arm64 on
# ubuntu-24.04-arm, only on a dispatch with arm64=true), with <set>.tar.gz and build-info.json in the format of build.yml's
# releases (sha256 of the tarball and of every file).
#
# Why a workflow of its own: build.yml holds one pending run in its concurrency group,
# and a change to it (or to scripts/) starts a run that cancels another session's
# pending build. This workflow runs after build.yml instead, for the commit whose
# foafnaut releases that run published, and on request.
#
# The build is core's labs/demos/foafnaut/build-web-render.sh --native (Lean modules
# from source with the pinned toolchain; no Emscripten). On Linux the library links
# Lean's shared runtime (libleanshared*.so; libleanrt.a can not go into a shared
# library, see that script), so a user needs the same Lean toolchain:
# `elan toolchain install $(cat foafnaut/lean-toolchain)` and
# LD_LIBRARY_PATH=~/.elan/toolchains/<toolchain>/lib/lean. The release says so in
# foafnaut/README-linux.txt. Gate: one WPT page through core's runner with this library
# (start check), and core's native_html_test.ts when present. This is a CPU engine
# library for the WPT runner and the desktop; no GPU, no window.
#
# Cost: Linux minutes only, about 25-35 min a build for each arch.

on:
  # build.yml: the commit that run published. Branch WPT check only gives a tick for the
  # same check as the schedule (GitHub starts scheduled runs late or not at all when it
  # is busy; branch checks end often while people work). Not Release tests: that
  # workflow starts on each run of this one, and the two would start each other.
  workflow_run:
    workflows: ['Build Factoidal from factoidal-core', 'Branch WPT check']
    types: [completed]
  schedule:
    # Every 20 minutes: the newest main commit, when it has no Linux engine release and
    # changes engine code (release-tests/release-tests.py linux-candidate). x86_64 only.
    # The finished build starts the Linux full WPT run (release-tests.yml), so a main
    # commit has a score in about an hour without a macOS runner. The same step starts
    # build.yml for main when no build run was made since that commit: build.yml's own
    # hourly poll is often late (2026-11-13: none for two hours).
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      core_ref:
        description: '40-hex factoidal-core commit on main (empty: the commit of the newest foafnaut-darwin-arm64 release)'
        required: false
        default: ''
      arm64:
        description: 'Also build arm64 (never built automatically: it would hold the queue of main)'
        type: boolean
        default: false
      force:
        description: 'Rebuild when the release exists'
        type: boolean
        default: false

permissions:
  contents: read

# One build at a time; a waiting run is replaced by a newer one (the newest commit wins).
concurrency:
  group: foafnaut-linux
  cancel-in-progress: false

env:
  CORE_REPO: danbri/factoidal-core

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name != 'Build Factoidal from factoidal-core'
    permissions:
      contents: read
      actions: write
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      short: ${{ steps.r.outputs.short }}
      arches: ${{ steps.r.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FROM: ${{ github.event.workflow_run.name }}
          ARM64: ${{ inputs.arm64 }}
          IN_REF: ${{ inputs.core_ref }}
          FORCE: ${{ inputs.force }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_run ] && [ "$FROM" != 'Build Factoidal from factoidal-core' ]; }; then
            python3 release-tests/release-tests.py linux-candidate --dispatch-build
            exit 0
          fi
          if [ -n "${IN_REF:-}" ]; then
            SHA=$(gh api "repos/$CORE_REPO/commits/$IN_REF" --jq .sha)
          else
            # The newest foafnaut-darwin-arm64 release (on a workflow_run: the one that run published).
            SHA=$(gh api "repos/$REPO/releases?per_page=100" | python3 -c '
          import json, os, re, sys
          run = os.environ.get("BUILD_RUN_ID") or ""
          rs = [r for r in json.load(sys.stdin) if re.fullmatch(r"build-[0-9a-f]{12}-foafnaut-darwin-arm64", r["tag_name"])
                and (not run or f"/actions/runs/{run}" in (r.get("body") or ""))]
          rs.sort(key=lambda r: r.get("published_at") or "")
          m = re.search(r"/commit/([0-9a-f]{40})", rs[-1].get("body") or "") if rs else None
          print(m[1] if m else "")')
          fi
          if [ -z "$SHA" ]; then echo "No new foafnaut release: nothing to build"; echo 'arches=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          STATUS=$(gh api "repos/$CORE_REPO/compare/main...$SHA" --jq .status)
          case "$STATUS" in behind|identical) ;; *) echo "::error::$SHA is not on core main ($STATUS)"; exit 1;; esac
          SHORT=${SHA:0:12}
          ARCHES=()
          WANT="x86_64"; if [ "${ARM64:-false}" = true ]; then WANT="x86_64 arm64"; fi
          for A in $WANT; do
            if [ "${FORCE:-false}" != true ] && gh release view "build-$SHORT-foafnaut-linux-$A" -R "$REPO" > /dev/null 2>&1; then
              echo "build-$SHORT-foafnaut-linux-$A exists"; continue
            fi
            ARCHES+=("\"$A\"")
          done
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "arches=[$(IFS=,; echo "${ARCHES[*]:-}")]" >> "$GITHUB_OUTPUT"
          echo "core $SHA; arches [${ARCHES[*]:-}]" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: libweb-render.so ${{ matrix.arch }}
    needs: resolve
    if: needs.resolve.outputs.arches != '[]' && needs.resolve.outputs.arches != ''
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: core
      - name: Install elan and the pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          T=$(tr -d ' \n' < core/formal/lean4/lean-toolchain)
          elan toolchain install "$T"
          sudo apt-get update -q && sudo apt-get install -y -q libuv1-dev
      - name: Pins
        id: pins
        run: echo "deno=v$(grep -E '^DENO_VERSION=' core/labs/demos/foafnaut/toolchain-versions.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.pins.outputs.deno }}
      # build.yml's Lake cache of the newest build (restore only) and the C objects of the
      # last engine build (release-tests/leanc-cache.sh): unchanged modules are not
      # compiled again.
      - name: Restore build.yml's Lake cache
        uses: actions/cache/restore@v4
        with:
          path: core/formal/lean4/.lake
          key: lake-linux-${{ matrix.arch }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ hashFiles('core/formal/lean4/**/*.lean', 'core/formal/lean4/lakefile.lean', 'core/formal/lean4/ffi/**', 'core/tools/wasmvm/quickjs/*.js') }}
          restore-keys: |
            lake-linux-${{ matrix.arch }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Restore the C object cache
        uses: actions/cache/restore@v4
        with:
          path: ~/leanc-cache
          key: leanc-objects-v1-${{ matrix.arch }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ github.run_id }}
          restore-keys: |
            leanc-objects-v1-${{ matrix.arch }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Build libweb-render.so
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/leanc-cache" "$HOME/leanc-shim"
          rm -f "$HOME/leanc-cache/.hits" "$HOME/leanc-cache/.misses"; touch "$HOME/leanc-cache/.start"
          cp builds/release-tests/leanc-cache.sh "$HOME/leanc-shim/leanc"; chmod +x "$HOME/leanc-shim/leanc"
          export LEANC_REAL=$(ls "$HOME"/.elan/toolchains/*/bin/leanc | head -1) LEANC_CACHE="$HOME/leanc-cache"
          export LEANC_ID="$(tr -d ' \n' < core/formal/lean4/lean-toolchain) ${{ matrix.arch }}"
          T0=$(date +%s)
          RC=0
          PATH="$HOME/leanc-shim:$PATH" bash core/labs/demos/foafnaut/build-web-render.sh --native > "$RUNNER_TEMP/build.log" 2>&1 || RC=$?
          HITS=$(wc -c < "$HOME/leanc-cache/.hits" 2>/dev/null || echo 0); MISSES=$(wc -c < "$HOME/leanc-cache/.misses" 2>/dev/null || echo 0)
          echo "Build exit $RC in $(( ($(date +%s) - T0) / 60 )) min; C objects: $HITS from the cache, $MISSES compiled." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "misses=$MISSES" >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ]; then
            grep -n -E -A6 ': error: |^error: |build refused' "$RUNNER_TEMP/build.log" | head -60 | cut -c1-400
            tail -30 "$RUNNER_TEMP/build.log" | cut -c1-400
            exit 1
          fi
          # Keep only the objects this build used.
          find "$HOME/leanc-cache" -name '*.o' ! -newer "$HOME/leanc-cache/.start" -delete
          ls -la core/labs/demos/foafnaut/.build/web-render/engines/
      - name: Save the C object cache
        if: steps.build.outputs.misses != '0' && steps.build.outputs.misses != ''
        uses: actions/cache/save@v4
        with:
          path: ~/leanc-cache
          key: leanc-objects-v1-${{ matrix.arch }}-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ github.run_id }}
      - name: Package
        id: pkg
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SET=foafnaut-linux-$ARCH
          OUT=$RUNNER_TEMP/pkg; STAGE=$OUT/stage; mkdir -p "$STAGE/foafnaut"
          ENG=core/labs/demos/foafnaut/.build/web-render
          cp "$ENG/engines/libweb-render.so" "$STAGE/foafnaut/"
          [ -f "$ENG/engine-build.txt" ] && cp "$ENG/engine-build.txt" "$STAGE/foafnaut/"
          T=$(tr -d ' \n' < core/formal/lean4/lean-toolchain)
          echo "$T" > "$STAGE/foafnaut/lean-toolchain"
          ldd "$STAGE/foafnaut/libweb-render.so" > "$STAGE/foafnaut/ldd.txt" || true
          cat > "$STAGE/foafnaut/README-linux.txt" <<EOF
          libweb-render.so: the Foafnaut engine (BubblePopKit) for Linux $ARCH, factoidal-core $SHA.
          It links Lean's shared runtime. Install the same toolchain and point the loader at it:
            elan toolchain install $T
            export LD_LIBRARY_PATH=\$HOME/.elan/toolchains/$(echo "$T" | sed 's|/|--|g; s|:|---|g')/lib/lean
          Use it with factoidal-core's tests/browser-wpt/testharness-run.ts --native-engine libweb-render.so
          (the Wasm module of the same commit's foafnaut-web release goes in labs/demos/foafnaut/.build/native-html/runtime).
          EOF
          ( cd "$STAGE" && find . -type f | sort | tar --owner=0 --group=0 --numeric-owner --mtime='1970-01-01' -czf "$OUT/$SET.tar.gz" -T - )
          python3 - "$STAGE" "$OUT/$SET.tar.gz" "$SET" "$SHA" "$RUN_URL" "$T" > "$OUT/build-info.json" <<'EOF'
          import hashlib, json, os, platform, subprocess, sys, datetime
          stage, tarball, set_, sha, run_url, tc = sys.argv[1:]
          h = lambda p: hashlib.sha256(open(p, 'rb').read()).hexdigest()
          files = {}
          for dp, _, fs in os.walk(stage):
              for f in fs:
                  p = os.path.join(dp, f); files[os.path.relpath(p, stage)] = {"sha256": h(p), "size": os.path.getsize(p)}
          deno = subprocess.run(["deno", "--version"], capture_output=True, text=True).stdout.splitlines()[0]
          print(json.dumps({"built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "run_url": run_url,
                            "set": set_, "source_commit": sha, "source_ref": "main", "source_repo": "danbri/factoidal-core",
                            "toolchains": {"lean": tc, "deno": deno, "platform": f"linux-{platform.machine()}",
                                           "note": "built by foafnaut-linux.yml after build.yml; gates: the WPT start check below"},
                            "artifacts": {os.path.basename(tarball): {"sha256": h(tarball), "size": os.path.getsize(tarball), "files": files}}}, indent=1))
          EOF
          echo "set=$SET" >> "$GITHUB_OUTPUT"
      - name: 'Gate, one WPT page through the runner with this library'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          set -euo pipefail
          T=$(tr -d ' \n' < core/formal/lean4/lean-toolchain)
          export LD_LIBRARY_PATH=$(ls -d "$HOME"/.elan/toolchains/*/lib/lean | head -1)
          # The runner loads the Wasm module and, for WPT, never calls it: this commit's when
          # build.yml has published it, else the newest released one.
          WEB="build-$SHORT-foafnaut-web"
          gh release view "$WEB" -R "${{ github.repository }}" > /dev/null 2>&1 || WEB=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[]|select(.tag_name|test("^build-[0-9a-f]{12}-foafnaut-web$"))]|sort_by(.published_at)|last|.tag_name')
          echo "Wasm module from $WEB"
          gh release download "$WEB" -R "${{ github.repository }}" -p foafnaut-web.tar.gz -D "$RUNNER_TEMP/web"
          mkdir -p "$RUNNER_TEMP/web/x" && tar -xzf "$RUNNER_TEMP/web/foafnaut-web.tar.gz" -C "$RUNNER_TEMP/web/x"
          RT=core/labs/demos/foafnaut/.build/native-html/runtime; mkdir -p "$RT"
          cp "$RUNNER_TEMP/web/x/docs/web/hub/html-webgpu/runtime/web-render."{mjs,wasm} "$RT/"
          python3 -m pip install --quiet --target "$RUNNER_TEMP/pydeps" pyyaml==6.0.3
          echo /dom/nodes/Node-textContent.html > "$RUNNER_TEMP/one.list"
          python3 core/tests/browser-wpt/wpt-score.py tree --wpt-root "$RUNNER_TEMP/wpt" --list "$RUNNER_TEMP/one.list" > /dev/null
          PYTHONPATH="$RUNNER_TEMP/pydeps" timeout 600 python3 core/tests/browser-wpt/wpt-score.py run --list "$RUNNER_TEMP/one.list" \
            --dir "$RUNNER_TEMP/gate" --wpt-root "$RUNNER_TEMP/wpt" --native-engine "$RUNNER_TEMP/pkg/stage/foafnaut/libweb-render.so" \
            --jobs 1 --max-hours 0.1 -- --script-engine bubblepop
          cat "$RUNNER_TEMP"/gate/part0.jsonl | head -c 600; echo
          python3 -c 'import json,glob,sys; r=[json.loads(l) for f in glob.glob(sys.argv[1]+"/part*.jsonl") for l in open(f) if l.strip()]; assert r and r[0]["harness"]=="OK" and any(s["status"]=="PASS" for s in r[0]["subtests"]), r' "$RUNNER_TEMP/gate"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.resolve.outputs.short }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SET: ${{ steps.pkg.outputs.set }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG="build-$SHORT-$SET"
          gh release delete "$TAG" -R "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" -R "${{ github.repository }}" --latest=false --title "$TAG" \
            --notes "Built from https://github.com/$CORE_REPO/commit/$SHA (main) by $RUN_URL. Linux native Foafnaut engine library (libweb-render.so) for the WPT runner; needs the Lean toolchain named in foafnaut/lean-toolchain at run time (foafnaut/README-linux.txt)." \
            "$RUNNER_TEMP/pkg/$SET.tar.gz" "$RUNNER_TEMP/pkg/build-info.json"
      # The Linux full WPT run of this commit starts now, not when this workflow ends.
      - name: Start the Linux full run
        if: matrix.arch == 'x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          gh workflow run release-tests.yml -R "${{ github.repository }}" -f release="build-$SHORT" \
            -f platforms=linux-x86_64 -f suites=wpt -f trigger=factoidal-release
          echo "Started release-tests.yml for build-$SHORT on Linux" >> "$GITHUB_STEP_SUMMARY"
