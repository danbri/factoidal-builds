name: Responsive sizing geometry
on:
  push:
    branches: [wip/viewport-size-math-probe]
permissions:
  actions: read
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the exact candidate engine
        run: |
          set -euo pipefail
          run=45394174433
          uri="repos/$GITHUB_REPOSITORY/actions/runs/$run"
          gh api "$uri/jobs" --jq '.jobs[].name' | grep -Fx 'Build libweb-render.so from b398c9bb24ca5d8d69b073a913a987ef191290d2'
          until gh api "$uri/artifacts" --jq '.artifacts[].name' | grep -qx branch-engine; do
            if [[ $(gh api "$uri" --jq .status) == completed ]]; then
              echo "::error::Candidate build did not publish a native engine"
              exit 1
            fi
            sleep 20
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 45394174433
          name: branch-engine
          github-token: ${{ github.token }}
          path: engine
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Read relative and explicit CSS geometry at two viewport widths
        run: |
          set -euo pipefail
          tc=$(cat engine/lean-toolchain)
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          export LD_LIBRARY_PATH="$(ELAN_TOOLCHAIN="$tc" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean"
          deno run --no-config --allow-ffi --unstable-ffi release-tests/diagnostics/viewport-size-math.ts engine/libweb-render.so | tee geometry.ndjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-size-math-geometry
          path: geometry.ndjson
          retention-days: 7
