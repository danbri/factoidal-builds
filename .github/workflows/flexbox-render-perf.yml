name: Isolate the W3C Flexbox startup work per script
on:
  push:
    branches: [wip/flexbox-render-perf]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: 472993e362b585c5724f8de9d13115e8383f9f80
  SET: foafnaut-engine-darwin-arm64
  WEB: build-4618bea0c1ac-foafnaut-web
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            third_party/realpages/w3.org
            core-diagnostics
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 472993e362b585c5724f8de9d13115e8383f9f80
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Set up the pinned engine and desktop host
        run: |
          set -euo pipefail
          mkdir -p engines/base engines/web
          gh release download "build-${CORE:0:12}-$SET" -R "$GITHUB_REPOSITORY" -p "$SET.tar.gz" -p build-info.json -D engines/base
          jq -e --arg sha "$CORE" '.source_commit == $sha' engines/base/build-info.json >/dev/null
          expected=$(jq -er --arg archive "$SET.tar.gz" '.artifacts[$archive].sha256' engines/base/build-info.json)
          echo "$expected  engines/base/$SET.tar.gz" | shasum -a 256 -c -
          tar -xzf "engines/base/$SET.tar.gz" -C engines/base
          library=$(find "$PWD/engines/base" -name libweb-render.dylib -print | head -1)
          window=$(find "$PWD/engines/base" -name libnative-window.dylib -print | head -1)
          test -s "$library"
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -p foafnaut-web.tar.gz -D engines/web
          tar -xzf engines/web/foafnaut-web.tar.gz -C engines/web docs/web/hub/html-webgpu/runtime
          lab=core/labs/demos/foafnaut
          bash "$lab/realpages/setup-host.sh" "$PWD/$lab" "$PWD/engines/web" "$window"
          echo "ENGINE=$library" >> "$GITHUB_ENV"
      - name: Replay the original and each one-script variant
        run: |
          set -euo pipefail
          lab="$PWD/core/labs/demos/foafnaut"
          archive="$PWD/third_party/realpages/w3.org/w3c-flexbox-20261115.zip"
          variants="$RUNNER_TEMP/script-variants"
          mkdir -p out
          shasum -a 256 "$ENGINE" "$lab/run_html.ts" "$archive" > out/inputs.sha256
          python3 core-diagnostics/flexbox-script-variants.py "$archive" "$variants" > out/variants.json
          for arm in baseline1 no-ref-hints no-wpt no-dfn-panel no-fixup baseline2; do
            export REALPAGES_REPLAY="$archive"
            [[ $arm = baseline* ]] || export REALPAGES_REPLAY="$variants/$arm.zip"
            /usr/bin/time -l deno run --no-check --no-config --no-npm --node-modules-dir=none \
              --unstable-webgpu --unstable-ffi -A --preload "$lab/realpages/replay.ts" "$lab/run_html.ts" \
              --native-engine "$ENGINE" --offscreen --offscreen-size 1280x800@1 --no-state \
              --be-liberal-in-what-we-accept --perf-summary --watch-sweep 10 \
              --url https://www.w3.org/TR/css-flexbox-1/ > "out/$arm.watch.log" 2>&1
            grep -q '"type":"native-html-perf-summary"' "out/$arm.watch.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3c-flexbox-perf
          path: out/
          retention-days: 7
