name: Check search forms in the published Linux browser
on:
  push:
    branches: [codex/installed-linux-form-check]
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: e4445d14752cc3ec75da7bf2fc1797263d02efbf
  SET: foafnaut-browser-linux-x86_64
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: release-tests/installed-forms-ci.ts
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CORE }}
          path: release-tests/source
          persist-credentials: false
          sparse-checkout: labs/demos/foafnaut/daily_use_server.ts
          sparse-checkout-cone-mode: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Install software Vulkan and the verified bundle
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers xvfb xauth
          mkdir -p incoming out
          tag="build-${CORE:0:12}-$SET"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$SET.tar.gz" -p build-info.json -D incoming
          file="$SET.tar.gz"
          checksum=$(jq -er --arg sha "$CORE" --arg file "$file" 'select(.source_commit == $sha) | .artifacts[$file].sha256' incoming/build-info.json)
          echo "$checksum  incoming/$file" | sha256sum -c -
          tar -xzf "incoming/$file" -C incoming
          app=$(find "$PWD/incoming" -type f -name foafnaut -perm -u=x -print -quit)
          test -n "$app"
          echo "FOAFNAUT_APP=$app" >> "$GITHUB_ENV"
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          cp incoming/build-info.json out/
      - name: Check focus, typing, and search navigation
        env:
          DENO_WEBGPU_BACKEND: vulkan
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          mkdir -m 700 "$RUNNER_TEMP/runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          xvfb-run -a deno run --no-config -A release-tests/installed-forms-ci.ts "$FOAFNAUT_APP" "$PWD/out" | tee "$GITHUB_STEP_SUMMARY"
      - name: Capture the actual FrogFind homepage served to Foafnaut
        if: always() && env.FOAFNAUT_APP != ''
        env:
          DENO_WEBGPU_BACKEND: vulkan
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p -m 700 "$RUNNER_TEMP/runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          app="$FOAFNAUT_APP"
          out="$PWD/out"
          (
            cd "$(dirname "$app")"
            xvfb-run -a timeout 70 "$app" --offscreen --no-state --url https://frogfind.com/ \
              --shot "$out/frogfind-live.png"
          ) > out/frogfind-live.log 2>&1 || result=$?
          printf 'Live FrogFind browser exit %s\n' "${result:-0}" | tee -a "$GITHUB_STEP_SUMMARY"
          rg 'native-html-(loaded|refused|shot)' out/frogfind-live.log | tail -6 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-linux-search-forms
          path: out/
          retention-days: 7
