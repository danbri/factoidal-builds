name: Check percentage-grid layout against pinned baseline with WPT reftests
on:
  push:
    branches: [wip/1051-grid-wpt-pixels]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  BASELINE_RUN: "45649724924"
  CANDIDATE_RUN: "45658716312"
  BASELINE: 839dc27f0d873bbef749fc6ad36ecb2bf6e95316
  CANDIDATE: c80b56516c9e75def5e809cad577f47f3354dc9e
  WPT: 056c528ccb5844b01628e0cd667520535dee16cc
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Verify that both source revisions have their exact engine artifacts
        run: |
          set -euo pipefail
          for entry in "$BASELINE_RUN:$BASELINE" "$CANDIDATE_RUN:$CANDIDATE"; do
            endpoint="repos/$GITHUB_REPOSITORY/actions/runs/${entry%:*}"
            gh api "$endpoint/jobs" --jq '.jobs[].name' | grep -Fx "Build libweb-render.so from ${entry#*:}"
            until gh api "$endpoint/artifacts" --jq '.artifacts[] | select(.expired|not) | .name' | grep -Fx branch-engine; do
              if [[ "$(gh api "$endpoint" --jq .status)" == completed ]]; then exit 1; fi
              sleep 30
            done
          done
  reftest:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: experiments/grid-percentage-wpt/cases.txt
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 4
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            tests/browser-wpt
            third_party/fonts
      - uses: actions/checkout@v4
        with:
          repository: web-platform-tests/wpt
          ref: ${{ env.WPT }}
          path: wpt
          persist-credentials: false
          sparse-checkout: |
            css
            fonts
            images
            common
            resources
            svg
            quirks/reference
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BASELINE_RUN }}
          name: branch-engine
          path: engines/baseline
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CANDIDATE_RUN }}
          name: branch-engine
          path: engines/candidate
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Record input identities and run the same pixel checks twice
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          test "$(git -C core rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C wpt rev-parse HEAD)" = "$WPT"
          git -C core merge-base --is-ancestor "$BASELINE" "$CANDIDATE"
          mkdir -p runtime out
          tag="build-e4445d14752c-foafnaut-web"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D runtime -p build-info.json -p foafnaut-web.tar.gz
          expected=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' runtime/build-info.json)
          echo "$expected  runtime/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf runtime/foafnaut-web.tar.gz -C runtime docs/web/hub/html-webgpu/runtime
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          curl --compressed --retry 3 -fsSL "https://wpt.fyi/api/manifest?sha=$WPT" -o MANIFEST.json
          sha256sum engines/*/libweb-render.so MANIFEST.json experiments/grid-percentage-wpt/cases.txt > out/inputs.sha256
          only=$(paste -sd, experiments/grid-percentage-wpt/cases.txt)
          for role in baseline candidate; do
            python3 core/tests/browser-wpt/wpt-reftests.py run --manifest MANIFEST.json --wpt-root "$PWD/wpt" \
              --native-engine "$PWD/engines/$role/libweb-render.so" --prefix css/css-grid/ --jobs 2 --no-pictures --only "$only" --out "$PWD/out/$role"
          done
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import collections
          import json
          from pathlib import Path

          def load(role):
              result = json.loads(Path(f"out/{role}/results.json").read_text())
              assert result["valid"], (role, result.get("invalidReason"))
              return {entry["test"]: entry["status"] for entry in result["tests"]}

          cases=set(Path("experiments/grid-percentage-wpt/cases.txt").read_text().splitlines())
          baseline,candidate=load("baseline"),load("candidate")
          assert baseline.keys() == candidate.keys() == cases, (len(baseline),len(candidate),len(cases))
          changes={case:[baseline[case],candidate[case]] for case in sorted(cases) if baseline[case] != candidate[case]}
          Path("out/changes.json").write_text(json.dumps(changes,indent=2)+"\n")
          print(f"Exact baseline comparison of {len(cases)} Grid reftests for percentage sizes, edges and nesting.")
          print(collections.Counter(map(tuple,changes.values())))
          for name, (before, after) in changes.items():
              print(f"- `{name}` {before} → {after}")
          if any(before == "PASS" and after != "PASS" for before, after in changes.values()):
              raise SystemExit("One or more passing baseline reftests regressed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-percentage-wpt
          path: out/
          retention-days: 7
