name: Compare software Vulkan settings on all 24 Linux browser pages
on:
  push:
    branches: [wip/published-linux-mesa-comparison]
permissions:
  contents: read
  actions: read
env:
  CORE_SHA: 4a0c174b706690a21d66e23463a9da355f4271fa
  RELEASE_RUN: "45543448538"
jobs:
  wait-release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Wait for the exact public package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${CORE_SHA:0:12}-foafnaut-browser-linux-x86_64"
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN"
          while true; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq \
              '.assets[].name' 2>/dev/null | grep -Fx window-smoke.json; then
              break
            fi
            if [[ "$(gh api "$endpoint" --jq .status)" == completed ]]; then
              echo "Exact release run ended without a public browser archive" >&2
              exit 1
            fi
            sleep 45
          done
  survey:
    needs: wait-release
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: release-tests/native-worker-survey.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CORE_SHA }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut/realpages
            labs/demos/foafnaut/pages
      - name: Download the published browser and its checked receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir package
          tag="build-${CORE_SHA:0:12}-foafnaut-browser-linux-x86_64"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D package \
            -p foafnaut-browser-linux-x86_64.tar.gz -p build-info.json -p window-smoke.json
      - name: Check the exact package and install the X11 and Vulkan runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find package -name '*.tar.gz')
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          jq -e --arg sha "$CORE_SHA" --arg digest "$digest" --arg file "$(basename "$archive")" \
            '.source_commit == $sha and .artifacts[$file].sha256 == $digest' package/build-info.json
          jq -e --arg sha "$CORE_SHA" --arg digest "$digest" \
            '.sourceCommit == $sha and .archive_sha256 == $digest and .worker == "native" and .status == "pass"' package/window-smoke.json
          tar -xzf "$archive" -C package
          binary=$(find "$PWD/package" -type f -name foafnaut -print -quit)
          (cd "$(dirname "$binary")" && sha256sum -c SHA256SUMS)
          test -s "$(dirname "$binary")/libweb-render.so"
          jq -e --arg sha "$CORE_SHA" '.commitFull == $sha' "$(dirname "$binary")/BUILD-INFO.json"
          echo "FOAFNAUT_BINARY=$binary" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool python3-pil python3-xlib
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/foafnaut-runtime" >> "$GITHUB_ENV"
          mkdir -p out
          sha256sum package/*.json "${archives[0]}" "$binary" core/labs/demos/foafnaut/realpages/pages.json > out/inputs.sha256
          dpkg-query -W mesa-vulkan-drivers libvulkan1 libsdl2-2.0-0 > out/runtime-versions.txt
          install -d -m 700 "$RUNNER_TEMP/foafnaut-runtime"
      - name: Compare stock Vulkan and nopt in the packaged native browser
        env:
          SDL_VIDEODRIVER: x11
          DENO_WEBGPU_BACKEND: vulkan
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          order=(stock nopt)
          if (( PART % 2 )); then order=(nopt stock); fi
          for role in "${order[@]}"; do
            export XDG_CACHE_HOME="$RUNNER_TEMP/cache-$role"
            export MESA_SHADER_CACHE_DIR="$XDG_CACHE_HOME"
            mkdir -p "$XDG_CACHE_HOME" "out/$role"
            if [[ "$role" == nopt ]]; then export GALLIVM_PERF=nopt; else unset GALLIVM_PERF; fi
            printf '%s\n' "$role" >> out/run-order.txt
            xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 release-tests/native-worker-survey.py \
              "$FOAFNAUT_BINARY" "$PWD/core/labs/demos/foafnaut" "$PWD/out/$role" "$PART" 4
            /usr/bin/python3 - "$role" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json, sys
          from PIL import Image

          directory = Path("out") / sys.argv[1]
          metadata = directory / "summary.json"
          entries = json.loads(metadata.read_text())
          for entry in entries:
              if entry["state"] != "presented":
                  continue
              with Image.open(directory / (entry["id"] + ".png")) as window:
                  layers = entry["firstFrame"].get("layers") or {}
                  top = int(layers.get("top", 65))
                  assert 0 <= top < window.height
                  document = window.crop((0, top, window.width, window.height))
                  entry["firstDocumentSHA256"] = sha256(document.convert("RGB").tobytes()).hexdigest()
          metadata.write_text(json.dumps(entries, indent=2) + "\n")
          PY
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-window-survey-${{ matrix.part }}
          path: out/
          retention-days: 7
  report:
    runs-on: ubuntu-latest
    needs: survey
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mesa-window-survey-*
          path: results
      - name: Summarize the registered pages
        run: |
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          def load(role):
              rows = [row for path in Path("results").glob(f"*/{role}/summary.json") for row in json.loads(path.read_text())]
              assert len(rows) == len({r["id"] for r in rows}) == 24
              assert all(r.get("documentEngine") == "native" for r in rows if r["state"] == "presented")
              return {r["id"]: r for r in rows}

          stock, nopt = load("stock"), load("nopt")
          assert set(stock) == set(nopt)
          arms = {"stock": stock, "nopt": nopt}
          print("| Page | Stock first frame ms | nopt first frame ms | Stock graphics ms | nopt graphics ms | Same document pixels |")
          print("| --- | ---: | ---: | ---: | ---: | --- |")
          for name, a in sorted(stock.items()):
              b = nopt[name]
              assert a["url"] == b["url"] and a["viewport"] == b["viewport"]
              ha, hb = a.get("firstDocumentSHA256"), b.get("firstDocumentSHA256")
              f, g = a.get("firstFrame") or {}, b.get("firstFrame") or {}
              print(f'| {name} | {a.get("presentedMs")} | {b.get("presentedMs")} | {f.get("sessionMs")} | {g.get("sessionMs")} | {"yes" if ha and ha == hb else "changed or missing"} |')
          for role, rows in arms.items():
              in_budget = sum(r.get("presentedMs") is not None and r["presentedMs"] <= r["budget"]["first_frame_s"] * 1000 for r in rows.values())
              wheel = sum(r.get("scrollChangesPixels") is True for r in rows.values())
              print(f"{role} had {in_budget}/24 first frames within budget and visible wheel changes on {wheel}/24 pages.")
          Path("mesa-comparison.json").write_text(json.dumps(arms, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: published-mesa-comparison
          path: mesa-comparison.json
          if-no-files-found: error
          retention-days: 7
