name: Check real keyboard and button submission for a FrogFind-shaped GET form
on:
  push:
    branches: [wip/frogfind-form-window-check]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  CORE: aa2c4b775740efbf644ea59fe3d9b0bf881cae38
jobs:
  form:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        backend: [wasm, native]
        submission: [enter, button]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: experiments/frogfind-form
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CORE }}
          path: core
          sparse-checkout: labs/demos/foafnaut/check-linux-browser.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 45524300796
          name: branch-engine
          path: native
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 45533984047
          name: frogfind-origin
          path: snapshot
          github-token: ${{ github.token }}
      - name: Verify the published archive, native engine and upstream form shape
        run: |
          set -euo pipefail
          mkdir -p package out
          echo "3db65e438145fcce040bf0354d07d49d691cc8acd89bd05c48f3e3d3753f2c16  snapshot/live.html" | sha256sum -c -
          gh release download "build-${CORE:0:12}-foafnaut-browser-linux-x86_64" -R "$GITHUB_REPOSITORY" -D package -p foafnaut-browser-linux-x86_64.tar.gz
          echo '6e12ebd78d447c6836e8f5bced9892d8a309586740604089b5f7369afa5a6684  package/foafnaut-browser-linux-x86_64.tar.gz' | sha256sum -c -
          tar -xzf package/foafnaut-browser-linux-x86_64.tar.gz -C package
          (cd package/foafnaut-linux-x86_64 && sha256sum -c SHA256SUMS)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45524300796/jobs" --jq '.jobs[].name' |
            grep -Fx "Build libweb-render.so from $CORE"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/ActionRetro/FrogFind/d70edb9f2e6c098db3f44943cd671ddcf3088ff9/index.php -o "$RUNNER_TEMP/frogfind-upstream.php"
          grep -F '<form action="/" method="get">' "$RUNNER_TEMP/frogfind-upstream.php"
          grep -F '<input type="text" size="30" name="q"' "$RUNNER_TEMP/frogfind-upstream.php"
          grep -F '<input type="submit"' "$RUNNER_TEMP/frogfind-upstream.php"
          sha256sum package/*.tar.gz native/libweb-render.so "$RUNNER_TEMP/frogfind-upstream.php" > out/inputs.sha256
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool python3-pil python3-xlib
      - name: Click the field, type, and wait for the submitted results
        env:
          SDL_VIDEODRIVER: x11
          DENO_WEBGPU_BACKEND: vulkan
          GALLIVM_PERF: nopt
          BACKEND: ${{ matrix.backend }}
          SUBMISSION: ${{ matrix.submission }}
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          test -n "$VK_DRIVER_FILES"
          xvfb-run -a -s '-screen 0 1280x1024x24' /usr/bin/python3 experiments/frogfind-form/probe.py \
            "$PWD/core/labs/demos/foafnaut" "$PWD/package/foafnaut-linux-x86_64/foafnaut" \
            "$PWD/native/libweb-render.so" "$PWD/out" "$BACKEND" "$SUBMISSION" "$PWD/snapshot/live.html"
          jq -e '.status=="pass" and (.queries|length)==1' out/receipt.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frogfind-form-${{ matrix.backend }}-${{ matrix.submission }}
          path: out/
          retention-days: 7
