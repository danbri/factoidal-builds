name: EPUB Lean check
on:
  push:
    branches: [wip/epub-lean-check]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: a4234513cba096b31463f0f00129a58847dc35b2
          persist-credentials: false
          sparse-checkout: |
            formal/lean4
            tools
            docs/web/hub/epub
      - name: Install Lean
        run: |
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the EPUB reader and run its guards
        working-directory: formal/lean4
        run: lake build L4Factoidal.Epub
      - name: Check the reader and print its theorem axioms
        working-directory: formal/lean4
        run: lake env lean -DwarningAsError=true L4Factoidal/Epub.lean
      - name: Check standard font obfuscation against an independent EPUB fixture
        working-directory: formal/lean4
        run: |
          python3 - <<'PY'
          from hashlib import sha1
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZIP_STORED
          
          root = Path('.')
          source_book = Path('../../docs/web/hub/epub/sample.epub')
          with ZipFile(source_book) as source:
              members = {name: source.read(name) for name in source.namelist()}
          package = members['EPUB/book.opf'].replace(b'urn:factoidal:hub:epub-sample', b'urn:factoidal:\nhub:epub-sample').replace(b'</manifest>', b'<item id="font" href="typeface.otf" media-type="font/otf"/></manifest>')
          font = bytes((i*103+19)%256 for i in range(1200))
          key = sha1(b'urn:factoidal:hub:epub-sample').digest()
          encoded = bytes(v ^ key[i%20] if i < 1040 else v for i,v in enumerate(font))
          (root/'font-original.bin').write_bytes(font)
          entry = '''<enc:EncryptedData><enc:EncryptionMethod Algorithm="{scheme}"/><enc:CipherData><enc:CipherReference URI="{target}"/></enc:CipherData></enc:EncryptedData>'''
          obfuscation = 'http://www.idpf.org/2008/embedding'
          header = '<encryption xmlns="urn:oasis:names:tc:opendocument:xmlns:container" xmlns:enc="http://www.w3.org/2001/04/xmlenc#">'
          cases = {
              'idpf-font': entry.format(scheme=obfuscation,target='EPUB/typeface.otf'),
              'mixed-encryption': entry.format(scheme=obfuscation,target='EPUB/typeface.otf') +
                  entry.format(scheme='http://www.w3.org/2009/xmlenc11#aes256-gcm',target='EPUB/a.xhtml'),
              'nonfont-obfuscation': entry.format(scheme=obfuscation,target='EPUB/a.xhtml'),
              'unlisted-font': entry.format(scheme=obfuscation,target='EPUB/absent.otf'),
              'duplicate-font': entry.format(scheme=obfuscation,target='EPUB/typeface.otf') * 2,
          }
          for name, elements in cases.items():
              with ZipFile(root/(name+'.epub'), 'w', ZIP_DEFLATED) as out:
                  out.writestr('mimetype',members['mimetype'],ZIP_STORED)
                  for k,v in members.items():
                      if k!='mimetype':
                          out.writestr(k,package if k=='EPUB/book.opf' else v)
                  out.writestr('EPUB/typeface.otf',encoded)
                  out.writestr('META-INF/encryption.xml',header+elements+'</encryption>')
          PY
          cat > CheckFonts.lean <<'LEAN'
          import L4Factoidal.Epub
          open L4Factoidal.Epub
          def main : IO Unit := do
            let root := "./"
            let readBook := fun name => (openBook <$> IO.FS.readBinFile (root ++ name ++ ".epub"))
            let result ← readBook "idpf-font"
            let book ← IO.ofExcept (result.mapError IO.userError)
            let some font := book.manifest.find? (·.id == "font") | throw (IO.userError "Font missing")
            let expected ← IO.FS.readBinFile (root ++ "font-original.bin")
            unless font.bytes == expected do throw (IO.userError "Incorrect font bytes")
            let html ← IO.ofExcept ((book.readerHtml (some 1)).mapError IO.userError)
            unless (html.splitOn "Reading order").length > 1 do throw (IO.userError "Missing chapter")
            for name in ["mixed-encryption", "nonfont-obfuscation", "unlisted-font", "duplicate-font"] do
              let book ← readBook name
              if book.toOption.isSome then throw (IO.userError ("Unexpected acceptance: " ++ name))
            IO.println "Restored all 1,200 font bytes and opened chapter two. Refused mixed encryption and three invalid descriptors."
          LEAN
          lake env lean --run CheckFonts.lean
      - name: Run the generated C stack gate
        run: python3 tools/lean-tail-recursion-audit.py --gate
