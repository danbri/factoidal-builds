name: Compare large SVG image sharpness and page cost on frozen captures
on:
  push:
    branches: [wip/svg-image-budget-flexbox-replay]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  BASELINE_RUN: "45513142327"
  CANDIDATE_RUN: "45519866851"
  BASELINE: 8f560793c59f0b8c3afc69646861954b85d9e3fd
  CANDIDATE: 0defebb2c5f41e5836c2de1f8ddc2eb6de1ae96a
  WEB: build-05ec0b29ca8a-foafnaut-web
jobs:
  wait-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Wait for both exact native engine artifacts
        run: |
          set -euo pipefail
          for pair in "$BASELINE_RUN:$BASELINE" "$CANDIDATE_RUN:$CANDIDATE"; do
            run=${pair%:*}
            sha=${pair#*:}
            endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$run"
            until gh api "$endpoint/artifacts" --jq '.artifacts[] | select(.expired|not) | .name' | grep -Fx branch-engine; do
              if [[ "$(gh api "$endpoint" --jq .status)" == completed ]]; then
                echo "No native engine artifact in $run" >&2
                exit 1
              fi
              sleep 25
            done
            gh api "$endpoint/jobs" --jq '.jobs[].name' | grep -Fx "Build libweb-render.so from $sha"
          done
  replay:
    needs: wait-engine
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            release-tests/svg-image-budget-report.py
            third_party/realpages/w3.org/w3c-flexbox-20261115.zip
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 8f560793c59f0b8c3afc69646861954b85d9e3fd
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            tests/browser-wpt
            third_party/fonts
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BASELINE_RUN }}
          name: branch-engine
          path: engines/baseline
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CANDIDATE_RUN }}
          name: branch-engine
          path: engines/candidate
          github-token: ${{ github.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Verify the engine archives and replay inputs
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$BASELINE"
          mkdir -p runtime out snapshots
          cmp engines/{baseline,candidate}/lean-toolchain
          tc=$(cat engines/baseline/lean-toolchain)
          curl --retry 3 -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$tc"
          echo "LD_LIBRARY_PATH=$(ELAN_TOOLCHAIN="$tc" "$HOME/.elan/bin/lean" --print-prefix)/lib/lean" >> "$GITHUB_ENV"
          gh release download "$WEB" -R "$GITHUB_REPOSITORY" -D runtime -p build-info.json -p foafnaut-web.tar.gz
          expected=$(jq -er '.artifacts["foafnaut-web.tar.gz"].sha256' runtime/build-info.json)
          echo "$expected  runtime/foafnaut-web.tar.gz" | sha256sum -c -
          tar -xzf runtime/foafnaut-web.tar.gz -C runtime docs/web/hub/html-webgpu/runtime
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          flexbox=third_party/realpages/w3.org/w3c-flexbox-20261115.zip
          echo "a01b88268d16a2ab95bdf0a2edf8f56bf5634bf3534fa793d13263166f38d206  $flexbox" | sha256sum -c -
          cp "$flexbox" snapshots/w3c-flexbox.zip
          sha256sum engines/*/libweb-render.so snapshots/*.zip > out/inputs.sha256
      - name: Replay the same pages in baseline, candidate, candidate, baseline order
        run: |
          set -euo pipefail
          export REFTEST_TIME=1
          lab="$PWD/core/labs/demos/foafnaut"
          for case_id in w3c-flexbox; do
            file=w3c-flexbox; url=https://www.w3.org/TR/css-flexbox-1/; width=1280; height=735
            export REALPAGES_REPLAY="$PWD/snapshots/$file.zip"
            for arm in a1 b1 b2 a2; do
              engine=baseline; if [[ "$arm" == b* ]]; then engine=candidate; fi
              key="$case_id-$arm"
              jq -nc --arg url "$url" --arg file "$key.png" --argjson width "$width" --argjson height "$height" \
                '{url:$url,width:$width,height:$height,file:$file}' > "$RUNNER_TEMP/job.jsonl"
              /usr/bin/time -f '%e %M' -o "out/$key.time" timeout 230s deno run -A --unstable-ffi --preload "$lab/realpages/replay.ts" \
                core/tests/browser-wpt/reftest-render.ts --list "$RUNNER_TEMP/job.jsonl" \
                --native-engine "$PWD/engines/$engine/libweb-render.so" --out "$PWD/out" > "out/$key.log" 2>&1
              test -s "out/$key.png"
              sed -n 's/^__done //p' "out/$key.log" | jq -e '.status == "ok"' >/dev/null
            done
          done
          python3 release-tests/svg-image-budget-report.py out | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-image-budget-replay
          path: out/
          retention-days: 7
