name: Check the Array at fuel proof with the release target
on:
  push:
    branches: [wip/array-at-fuel-mono-check]
permissions:
  contents: read
env:
  CORE: 005ca9bb64863eefdb58a9f495c8a6493f8cb1ec
jobs:
  fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: builds
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 005ca9bb64863eefdb58a9f495c8a6493f8cb1ec
          path: core
          persist-credentials: false
      - name: Install the release Lean toolchain
        run: bash builds/scripts/install-elan.sh
      - uses: actions/cache/restore@v4
        with:
          path: core/formal/lean4/.lake
          key: lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-${{ hashFiles('core/formal/lean4/**/*.lean', 'core/formal/lean4/lakefile.lean', 'core/formal/lean4/ffi/**', 'core/tools/wasmvm/quickjs/*.js') }}
          restore-keys: |
            lake-linux-x86_64-${{ hashFiles('core/formal/lean4/lean-toolchain') }}-
      - name: Confirm generated proofs are current
        working-directory: core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE"
          mkdir -p "$RUNNER_TEMP/native-proof"
          python3 tools/fuelmono-natives.py formal/lean4/L4Factoidal/JS/Interp.lean "$RUNNER_TEMP/native-proof"
          for proof in FuelMonoNatives_arrayAtWithLength.lean FuelMonoNatives_moreNativeTypedMethod.lean; do
            cmp "$RUNNER_TEMP/native-proof/$proof" "formal/lean4/L4Factoidal/JS/$proof"
          done
      - name: Compile the exact release fuel target and print axioms
        working-directory: core/formal/lean4
        run: |
          set -euo pipefail
          lake build JSFuelMono 2>&1 | tee "$RUNNER_TEMP/fuel-mono.log"
          cat > "$RUNNER_TEMP/axioms.lean" <<'LEAN'
          import L4Factoidal.JS.FuelMonoAll
          #print axioms L4Factoidal.JS.FuelMono.natives_arrayAtWithLength_mono
          #print axioms L4Factoidal.JS.FuelMono.natives_moreNativeTypedMethod_mono
          #print axioms L4Factoidal.JS.FuelMono.IH_all
          LEAN
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          if grep -Eq 'sorryAx|failed' "$RUNNER_TEMP/axioms.txt"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: array-at-fuel-proof
          path: |
            ${{ runner.temp }}/fuel-mono.log
            ${{ runner.temp }}/axioms.txt
          retention-days: 7
