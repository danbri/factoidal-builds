name: Profile BBC final script startup reply
on:
  push:
    branches: [wip/textnaut-bbc-load]
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  CANDIDATE: 76f307e51e441e60b6cc5191b66475e2c8dbc918
  RUNTIME: 98cf12b45124a964363520bda0d84a543a19094d
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: experiments/textnaut-load/instrument.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: ${{ env.CANDIDATE }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut
            docs/web/hub/foafnaut
            third_party/fonts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Read checksum-verified engine and runtime from releases
        run: |
          set -euo pipefail
          mkdir -p out engine runtime
          test "$(git -C core rev-parse HEAD)" = "$CANDIDATE"
          for entry in "engine:$CANDIDATE:foafnaut-linux-x86_64" "runtime:$RUNTIME:foafnaut-web"; do
            dest=${entry%%:*}
            pair=${entry#*:}
            sha=${pair%%:*}
            set=${pair#*:}
            gh release download "build-${sha:0:12}-$set" -R "$GITHUB_REPOSITORY" -D "$dest" -p build-info.json -p "$set.tar.gz"
            expected=$(jq -er --arg sha "$sha" --arg asset "$set.tar.gz"               'select(.source_commit == $sha) | .artifacts[$asset].sha256' "$dest/build-info.json")
            echo "$expected  $dest/$set.tar.gz" | sha256sum -c -
            if [[ $dest == runtime ]]; then
              tar -xzf "$dest/$set.tar.gz" -C "$dest" docs/web/hub/html-webgpu/runtime
            else
              tar -xzf "$dest/$set.tar.gz" -C "$dest"
            fi
          done
      - name: Sample Linux native execution during the final startup reply
        run: |
          set -euo pipefail
          if command -v perf >/dev/null && perf --version >/dev/null 2>&1; then
            profiler="$(command -v perf)"
          else
            sudo apt-get update -q
            sudo apt-get install -y -q linux-tools-generic
            profiler="$(find /usr/lib/linux-tools -type f -name perf | sort -V | tail -1)"
          fi
          test -x "$profiler"
          sudo "$profiler" stat -e cpu-clock:u -- true
          lab="$PWD/core/labs/demos/foafnaut"
          bash "$lab/realpages/setup-host.sh" "$lab" "$PWD/runtime"
          browser="$lab/textnaut/textnaut.ts"
          python3 experiments/textnaut-load/instrument.py "$browser"
          deno check --no-config --import-map="$lab/textnaut/import_map.json" "$browser"
          lib="$PWD/engine/foafnaut/libweb-render.so"
          lib_hash=$(jq -er '.artifacts["foafnaut-linux-x86_64.tar.gz"].files["foafnaut/libweb-render.so"].sha256' engine/build-info.json)
          echo "$lib_hash  $lib" | sha256sum -c -
          sha256sum "$browser" "$lib" > out/inputs.sha256
          deno_bin=$(command -v deno)
          data="$RUNNER_TEMP/bbc-start.perf"
          sudo env DENO_DIR="${DENO_DIR:-$HOME/.cache/deno}" "$profiler" record --quiet -o "$data" \
            --clockid monotonic -e cpu-clock:u -F 79 --call-graph dwarf,8192 -- \
            timeout 180s "$deno_bin" run --no-prompt --allow-read --allow-ffi --allow-net --allow-env \
            --import-map="$lab/textnaut/import_map.json" "$browser" --dump --width 160 --timing --engine "$lib" \
            https://www.bbc.co.uk/news > out/browser.txt 2> out/browser.log
          grep '^{"type":"textnaut-load-phases"' out/browser.log > out/phases.json
          range=$(jq -er '[.startupAnswers[] | select(.pending|not)] | last | .from + "," + .to' out/phases.json)
          test -n "$range"
          for group in no-children children; do
            sudo "$profiler" report -i "$data" --time "$range" --stdio "--$group" \
              --sort dso,sym --percent-limit 0.2 > "out/$group.txt"
          done
          head -n 60 out/no-children.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textnaut-bbc-final-native-profile
          path: out/
          retention-days: 7
