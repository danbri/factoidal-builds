name: Survey all registered pages in the packaged Linux browser
on:
  push:
    branches: [wip/linux-window-everyday-survey]
permissions:
  contents: read
  actions: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: release-tests/packaged-linux-survey.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: 05ec0b29ca8ad75ef2dfca91a4f06cf16ed58067
          path: core
          persist-credentials: false
          sparse-checkout: |
            labs/demos/foafnaut/realpages
            labs/demos/foafnaut/pages
      - uses: actions/download-artifact@v4
        with:
          run-id: 45464645924
          name: foafnaut-browser-linux-x86_64-candidate
          path: package
          github-token: ${{ github.token }}
      - name: Check the exact package and install the X11 and Vulkan runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find package -name '*.tar.gz')
          test "${#archives[@]}" -eq 1
          echo "76e2d22ed3e6a52ef8e79d347bae491a19f486799d7873644619645fb948ed4e  ${archives[0]}" | sha256sum -c -
          tar -xzf "${archives[0]}" -C package
          binary=$(find "$PWD/package" -type f -name foafnaut -print -quit)
          echo "f13f8bf61fa7f760d37308b70ad7d4d55c89a707b969ec5a7fad44eaf7f59e0c  $binary" | sha256sum -c -
          jq -e '.commitFull=="05ec0b29ca8ad75ef2dfca91a4f06cf16ed58067"' "$(dirname "$binary")/BUILD-INFO.json"
          echo "FOAFNAUT_BINARY=$binary" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool python3-pil python3-xlib
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/foafnaut-runtime" >> "$GITHUB_ENV"
          install -d -m 700 "$RUNNER_TEMP/foafnaut-runtime"
      - name: Capture first visible frames and send a native scroll event
        env:
          SDL_VIDEODRIVER: x11
          DENO_WEBGPU_BACKEND: vulkan
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 release-tests/packaged-linux-survey.py             "$FOAFNAUT_BINARY" "$PWD/core/labs/demos/foafnaut" "$PWD/out" "$PART" 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-window-survey-${{ matrix.part }}
          path: out/
          retention-days: 7
  report:
    runs-on: ubuntu-latest
    needs: survey
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-window-survey-*
          path: results
      - name: Summarize the registered pages
        run: |
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import collections, json
          from pathlib import Path

          rows = [row for path in Path("results").glob("*/summary.json") for row in json.loads(path.read_text())]
          assert len(rows) == len({r["id"] for r in rows}) == 24
          print("Linux X11 / software Vulkan once per registered URL")
          print()
          print("| Page | State | Target viewport frame ms | Wheel to scroll trace ms |")
          print("| --- | --- | ---: | ---: |")
          for row in sorted(rows,key=lambda r:r["id"]):
              frame = row.get("presentedMs")
              state = row["state"]
              if frame is not None and row["documentColorsAtLeast"] < 2:
                  state = "uniform document pixels"
              elif frame is not None and frame > row["budget"]["first_frame_s"]*1000:
                  state = "over first-frame budget"
              print(f'| {row["id"]} | {state} | {frame if frame is not None else ""} | {row.get("scrollObservedMs","")} |')
          print()
          print(dict(collections.Counter(r["state"] for r in rows)))
          PY
