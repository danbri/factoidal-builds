<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="-20 -10 320 210">
  <title>Lean SVG painted-primitives experiment</title>
  <desc>Fractional geometry, inherited paints, currentColor, strokes and polygon winding.</desc>
  <rect x="-20" y="-10" width="320" height="210" fill="#121827"/>
  <g stroke="#e8efff" stroke-width="2.5" fill="#35d3a7">
    <rect x="1.25" y="12.5" width="79.5" height="58.25"/>
    <circle cx="131.5" cy="42" r="31.25" fill="#5c8dfa"/>
  </g>
  <ellipse cx="239.5" cy="42.5" rx="42.5" ry="24.25" fill="#ef6eb8"/>
  <g fill="currentColor" color="green">
    <polygon points="5.5,113 42,84.25 80.5,113 64,155.5 22,155.5"/>
    <circle cx="132.5" cy="123.5" r="30" color="aqua" fill-opacity=".8"/>
  </g>
  <line x1="193.5" y1="97.5" x2="279.5" y2="153.5" stroke="#ffbe4f" stroke-width="11.5"/>
  <circle cx="242.5" cy="122.5" r="82.5" fill="red" stroke="blue" stroke-width="10" opacity=".5"/>
  <rect x="-5" y="177.5" width="290" height="3.25" fill="#e8efff"/>
</svg>
